[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doeff-domain"
version = "0.1.0"
description = "Vocabulary cohesion domains for doeff — defdomain, domain registry, conformance checks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "doeff-vm>=0.2.0",
    # does not pull in doeff-hy (ADR-DOE-DOMAIN-001 R1), so the Hy version pin is the same as the Hy declaration in doeff-hy — so that
    # environments pulling only doeff-domain also get the doeff-hy upper bound. If they differ, the ADR-DOE-HY-008 R6 check goes red.
    "hy>=1.3.0,<=1.3.1",
]

[project.optional-dependencies]
# The dogfood declaration module (doeff_domain._core_effects_domains) is the
# ONLY part of this package allowed to depend on doeff-core-effects
# (ADR-DOE-DOMAIN-001 D1, one-way).
# The check assert-no-orphan-effects imports every module of doeff-core-effects, so the dependencies of optional (extra) modules
# are also needed — aiohttp_http_server.hy imports aiohttp from extra http-server, and _http_handlers_impl.hy imports httpx from extra http.
dogfood = ["doeff-core-effects[http,http-server]>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_domain"]

[tool.uv.sources]
doeff-vm = { workspace = true }
doeff-core-effects = { workspace = true }
