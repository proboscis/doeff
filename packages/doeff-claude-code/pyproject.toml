[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doeff-claude-code"
version = "0.1.0"
description = "claude の print mode の process の寿命を持つ effect と handler(会話と手番の単位の公開 effect・本番の handler・fake の handler)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "doeff>=0.2.0",
    "doeff-core-effects",
    "doeff-hy",
    "doeff-time",
    "hy>=1.3",
]

[tool.hatch.build.targets.wheel]
# import 名 doeff_claude_code の入口(__init__.py)は hy を読み込み、`_` で隠した Hy の module の名を遅延で出す。
packages = ["src/doeff_claude_code"]
# editable の install は src を明示して sys.path に載せる。
dev-mode-dirs = ["src"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-hy = { workspace = true }
doeff-time = { workspace = true }
