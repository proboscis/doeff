[build-system]
# license の SPDX の式と license-files(PEP 639)を既定で core metadata に書くのは hatchling 1.27 から(既定の版 2.4)。
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doeff-hy"
version = "0.8.0"
description = "Algebraic effects for Python: Hy macros for writing doeff programs, effects, handlers and tests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "hy", "lisp", "macros"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Lisp",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 核の 5 個は 1 つの番号で出し、互いの依存はその 2 桁の系に限る(tests/test_core_packages_version.py)。
dependencies = [
    "doeff>=0.8.0,<0.9",
    "doeff-core-effects>=0.8.0,<0.9",
    # 上限は doeff の uv.lock の hy の版ちょうど — doeff の検が確かめた版より新しい Hy を、doeff-hy を使う他の repo の lock に通さない。
    # Hy を上げる便は、この上限と uv.lock を同じ commit で上げる(ADR-DOE-HY-008 R6・card ki-0ff168f4eaf5)。
    # 下限は doeff-hy の検を走らせて緑だった最も古い版 1.3.0(merge-queue・code-quality の lock の版)— 1.2.0 では hy.eval に渡した
    # 名前空間の中の require が落ち、doeff-hy の検 10 本が赤だった(card ki-96ca6c49fffd)。
    # doeff-hy を引かずに Hy を宣言する配布物(doeff-domain)は、この行と同じ版の指定を置く(R6 の検が突き合わせる)。
    "hy>=1.3.0,<=1.3.1",
    # defwire の解き手(doeff_hy/wire.hy)— JSON と型を宣言した値の行き来は pydantic の TypeAdapter(validate_by_alias は 2.11 から)。
    "pydantic>=2.11",
    # pytest の plugin(Python 3.14 の Hy の ast.unparse の当て物を起動の時点で当てる)は別の配布物に置く —
    # pytest は pytest11 の entry point を持つ配布物の全 module に assert の書き換えの印を付け、ここに置くと
    # wheel で入れた repo で doeff_hy の .hy を Python として書き換えて import が落ちる(packages/doeff-hy-pytest)。
    "doeff-hy-pytest>=0.8.0,<0.9",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff/tree/main/packages/doeff-hy"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

[project.scripts]
doeff-hy-check = "doeff_hy.static_check:main"

[tool.hatch.build.targets.wheel]
# doeff_hy_bytecode_guard: macro が変わった Hy の module の古い bytecode を使わない包み(agora-redesign #1292)。
# venv の全ての Python の起動時に .pth から入れる(pytest・本番の入口・索引のどれが最初に Hy の module を読んでも効く)。
# doeff_hy の中に置かないのは、起動時に doeff_hy/__init__.py(Hy の import)を読まないため。
# hy-stubs: hy の部分の stub(PEP 561 の stub だけの package・py.typed は partial)。Hy の展開が必ず出す `import hy`・
# `import hy.models` を pyright strict が型の宣言なしと赤にしないため、doeff-hy-check を使う repo へ doeff-hy と一緒に配る
# (agora-redesign #2313)。
packages = ["src/doeff_hy", "src/doeff_hy_bytecode_guard", "src/hy-stubs"]

[tool.hatch.build.targets.wheel.force-include]
# .pth は中身が 1 行の固定文なので、editable の install でも写しが古くならない(hatchling は editable でも force-include を入れる)。
"src/doeff_hy_bytecode_guard.pth" = "doeff_hy_bytecode_guard.pth"

[tool.uv.sources]
doeff = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-hy-pytest = { workspace = true }
