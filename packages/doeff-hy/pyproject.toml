[build-system]
# From hatchling 1.27 (default version 2.4), the SPDX license expression and license-files (PEP 639) are written to core metadata by default.
# The build hook (hatch_build.py, a link to tools/doeff_hy_stub_hook.py) makes the .pyi of the .hy from the .hy at build time; these are the
# third-party modules the expansion imports (doeff, doeff-hy and doeff-core-effects are read from the checkout's sources, not required here).
requires = ["hatchling>=1.27", "hy>=1.3.0,<=1.3.1", "frozendict>=2.4.0", "doeff-vm"]
build-backend = "hatchling.build"

[project]
name = "doeff-hy"
version = "0.8.0"
description = "Algebraic effects for Python: Hy macros for writing doeff programs, effects, handlers and tests"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "hy", "lisp", "macros"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Lisp",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The five core packages are released under one version number, and their mutual dependencies are limited to that two-digit series (tests/test_core_packages_version.py).
dependencies = [
    "doeff>=0.8.0,<0.9",
    "doeff-core-effects>=0.8.0,<0.9",
    # The upper bound is exactly the hy version in doeff's uv.lock -- a Hy newer than what doeff's checks verified is not let into the lock of other repos that use doeff-hy.
    # When raising Hy, raise this upper bound and uv.lock in the same commit (ADR-DOE-HY-008 R6).
    # The lower bound is 1.3.0, the oldest version for which the doeff-hy checks ran green (the version in the merge-queue and code-quality locks) -- on 1.2.0 a require inside the
    # namespace passed to hy.eval failed, and 10 doeff-hy checks were red.
    # A distribution that declares Hy without pulling in doeff-hy (doeff-domain) carries the same version specifier as this line (the R6 check cross-checks it).
    "hy>=1.3.0,<=1.3.1",
    # The pytest plugin (applies the Python 3.14 Hy ast.unparse patch at startup) lives in a separate distribution --
    # pytest marks every module of a distribution that has a pytest11 entry point for assert rewriting, so putting it here would
    # make imports fail in repos installed from the wheel, by rewriting doeff_hy's .hy as Python (packages/doeff-hy-pytest).
    "doeff-hy-pytest>=0.8.0,<0.9",
]

[project.optional-dependencies]
# pydantic is not a dependency of the main package. The defwire decoder is
# the in-house doeff_hy/_wire_codec.py, and the job path (entry, foundation, main) does not import pydantic (doeff-job-path-imports-no-pydantic in .semgrep.yaml).
# Only doeff_hy._wire_parity, a tool that compares the in-house decoder with the pydantic decoder, imports pydantic -- a project that has a comparison test
# puts doeff-hy[parity] in its test dependency group (validate_by_alias is from 2.11).
parity = ["pydantic>=2.11"]

[project.urls]
Homepage = "https://github.com/proboscis/doeff/tree/main/packages/doeff-hy"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

[project.scripts]
doeff-hy-check = "doeff_hy._static_check:main"

[tool.hatch.build.targets.wheel]
# doeff_hy_bytecode_guard: a wrapper that does not use stale bytecode of a Hy module whose macros changed.
# Installed from a .pth at startup of every Python in the venv (effective whichever of pytest, the production entry, or the indexer first loads a Hy module).
# It is not placed inside doeff_hy so that startup does not load doeff_hy/__init__.py (the Hy import).
# hy-stubs: a stub for part of hy (a PEP 561 stub-only package; py.typed is partial). Handed out together with doeff-hy to repos that use doeff-hy-check so that pyright strict does not
# flag the `import hy` and `import hy.models` that Hy expansions always emit as having no type declarations.
packages = ["src/doeff_hy", "src/doeff_hy_bytecode_guard", "src/hy-stubs"]

[tool.hatch.build.targets.wheel.force-include]
# The .pth has fixed one-line content, so the copy does not go stale even in an editable install (hatchling includes force-include even for editable).
"src/doeff_hy_bytecode_guard.pth" = "doeff_hy_bytecode_guard.pth"

[tool.hatch.build]
# The .pyi made by the build hook are git-ignored, and hatchling leaves ignored files out of the wheel and the sdist — artifacts puts them in.
artifacts = ["*.pyi"]

[tool.hatch.build.hooks.custom]
# Make the .pyi of every .hy under stub-dirs, with module names taken from stub-root (tools/doeff_hy_stub_hook.py). The .pyi are not committed.
stub-root = "src"
stub-dirs = ["src/doeff_hy"]

[tool.uv]
# uv builds a path install again (and so runs the build hook) only when a file listed here changes: the .hy, the hook, and the tool and macros of
# doeff-hy that make the .pyi. Listing keys replaces uv's default keys, so pyproject.toml is listed too.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "src/**/*.hy" },
    { file = "src/**/*.py" },
]

[tool.uv.sources]
doeff-vm = { workspace = true }
doeff = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-hy-pytest = { workspace = true }
