[package]
name = "doeff-vm"
version = "0.8.0"
edition = "2021"
rust-version = "1.74"
description = "Rust VM for doeff algebraic effects with PyO3 Python bindings"
license = "MIT"
repository = "https://github.com/proboscis/doeff"
keywords = ["algebraic-effects", "vm", "python", "continuations"]

[lib]
name = "doeff_vm"
crate-type = ["cdylib"]

[features]
default = []
vm_debug_logs = []
# ADR-DOE-ENFORCE-001 R4: VM conformance oracle (per-step runtime invariants).
# Dev builds enable this via `make sync`; release wheels ship without it.
invariant-checks = ["doeff-vm-core/invariant-checks"]

[dependencies]
pyo3 = { version = "0.29", features = ["py-clone"] }
doeff-vm-core = { path = "../doeff-vm-core", features = ["python_bridge"] }
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }

# musl refuses to dlopen an extension whose C code uses the initial-exec TLS model, mimalloc's
# default ("initial-exec TLS resolves to dynamic definition" — doeff-vm Linux wheels install run
# 40526709517); local-dynamic TLS loads. glibc keeps the faster initial-exec model.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }

[build-dependencies]
pyo3-build-config = "0.29"

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize", "py-clone"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
