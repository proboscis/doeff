[build-system]
# Writing the license SPDX expression and license-files (PEP 639) with License-Expression, and including license-files in the sdist, require maturin 1.9.3 or later.
requires = ["maturin>=1.9.3,<2"]
# Wraps maturin and puts cargo's target in a temporary dir outside the working tree (tools/doeff_cargo_backend.py)
build-backend = "doeff_cargo_backend"
backend-path = ["."]

[project]
name = "doeff-vm"
version = "0.8.0"
description = "Algebraic effects for Python: the Rust virtual machine (a PyO3 extension) that runs doeff programs, their handlers and continuations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "virtual-machine", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff/tree/main/packages/doeff-vm"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "doeff_vm.doeff_vm"
python-source = "."
# The sdist contains path-dependency crates, so move the crates under doeff-vm/. The build entry point must sit at the same root as pyproject
# (backend-path = ["."]), so copy it to the root - without it the sdist cannot be built.
include = [{ path = "doeff_cargo_backend.py", format = "sdist" }]

# The key uv uses to decide whether to rebuild this package. uv's default keys are only pyproject.toml / setup.py /
# setup.cfg and do not look at Rust sources, so after an update that changes only Rust, `uv sync` /
# `uv run` keep using the old doeff_vm/*.so (from 2026-09-23 22:42 to 23:17 the pod's
# controller was down for 35 minutes on a stale .so).
# Listing keys here replaces the default keys, so pyproject.toml is listed explicitly too.
# This set is also the key for the wheel's storage location in the build entry point (tools/doeff_cargo_backend.py). The .py, .pyi and py.typed of python-source
# (doeff_vm/ in this dir) are listed too - in either hook the entry point installs Python from the working tree rather than from the stored wheel
# (ADR-DOE-BUILD-001 R2b), but uv rebuilds a non-editable path install only when the files listed here change. The license-files (LICENSE) that go into the wheel's
# dist-info are passed in from the stored wheel, so they are listed.
# Also list the build entry point's own file (it decides how the editable install is assembled) and the environment variables that change what the entry point puts into the storage key (the entry point's BUILD_ENV_NAMES, and
# the names in use among the prefixes CARGO_PROFILE_, CARGO_BUILD_, MATURIN_, PYO3_) - the intake work and make sync do not pass
# --reinstall-package, so the entry point is not invoked on changes uv does not notice (#3860 item 2).
# That the Cargo.toml / Cargo.lock / pyproject.toml / build.rs / *.rs of path-dependency crates (followed transitively via path = in Cargo.toml),
# the entry-point files, and the entry point's environment variable names are all listed, and that any change to any key makes uv invoke the entry point, are
# checked by tests/test_land_install_follows_rust_keys.py.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "build.rs" },
    { file = "src/**/*.rs" },
    { file = "doeff_vm/**/*.py" },
    { file = "doeff_vm/**/*.pyi" },
    { file = "doeff_vm/py.typed" },
    { file = "LICENSE" },
    { file = "../doeff-vm-core/pyproject.toml" },
    { file = "../doeff-vm-core/Cargo.toml" },
    { file = "../doeff-vm-core/Cargo.lock" },
    { file = "../doeff-vm-core/src/**/*.rs" },
    { file = "doeff_cargo_backend.py" },
    { env = "RUSTFLAGS" },
    { env = "CARGO_ENCODED_RUSTFLAGS" },
    { env = "RUSTC" },
    { env = "MACOSX_DEPLOYMENT_TARGET" },
    { env = "CARGO_BUILD_TARGET" },
    { env = "CARGO_BUILD_RUSTFLAGS" },
    { env = "CARGO_PROFILE_RELEASE_DEBUG" },
    { env = "CARGO_PROFILE_RELEASE_STRIP" },
    { env = "CARGO_PROFILE_RELEASE_LTO" },
    { env = "CARGO_PROFILE_RELEASE_OPT_LEVEL" },
    { env = "CARGO_PROFILE_RELEASE_CODEGEN_UNITS" },
    { env = "MATURIN_PEP517_ARGS" },
    { env = "PYO3_PYTHON" },
    { env = "PYO3_CONFIG_FILE" },
]
