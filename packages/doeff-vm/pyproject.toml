[build-system]
requires = ["maturin>=1.5,<2"]
# maturin を包み、cargo の target を作業木の外の一時の dir に置く(tools/doeff_cargo_backend.py・agora-redesign #1493)
build-backend = "doeff_cargo_backend"
backend-path = ["."]

[project]
name = "doeff-vm"
version = "0.2.0"
description = "Rust VM for doeff algebraic effects"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "doeff_vm.doeff_vm"
python-source = "."
# sdist は path 依存の crate を持つので crate を doeff-vm/ の下へ移す。build の口は pyproject と同じ根に要る
# (backend-path = ["."])ので、根に写す — 無いと sdist から組めない(agora-redesign #1493)。
include = [{ path = "doeff_cargo_backend.py", format = "sdist" }]

# uv が「この package を作り直すか」を決める鍵。uv の既定の鍵は pyproject.toml / setup.py /
# setup.cfg だけで Rust の source を見ないため、Rust だけが変わった更新の後の `uv sync` /
# `uv run` は古い doeff_vm/*.so をそのまま使い続ける(2026-09-23 22:42〜23:17 に pod の
# controller が古い .so で 35 分落ちた — card acp:kanban-issue:ki-3965aa5188ae)。
# ここに列挙すると既定の鍵は置き換わるので pyproject.toml も自分で並べる。
# この集合は build の口(tools/doeff_cargo_backend.py)の wheel の保存先の鍵でもある(agora-redesign #3860)。保存先の wheel は
# python-source(この dir の doeff_vm/)の .py・.pyi・py.typed も持つので、それも並べる — 並べないと Python だけを変えた後の
# 非 editable の入れ(worker の uv build)が、前の Python の入った wheel を保存先から引く。
# build の口の file そのもの(editable の組み方を決める)と、口が保存先の鍵に入れる組みを変える環境変数(口の BUILD_ENV_NAMES と、
# 接頭辞 CARGO_PROFILE_・CARGO_BUILD_・MATURIN_・PYO3_ のうち使う名)も並べる — 取り込みの作業と make sync は
# --reinstall-package を付けないので、uv が気づかない変化では口が呼ばれない(#3860 の 2)。
# path 依存の crate(Cargo.toml の path = を推移的にたどった先)の Cargo.toml / Cargo.lock / pyproject.toml / build.rs / *.rs・
# 口の file・口の環境変数の名が漏れなく載っている事と、どの鍵の変化でも uv が口を呼ぶ事は
# tests/test_land_install_follows_rust_keys.py が検査する。
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "doeff_vm/**/*.py" },
    { file = "doeff_vm/**/*.pyi" },
    { file = "doeff_vm/py.typed" },
    { file = "../doeff-vm-core/pyproject.toml" },
    { file = "../doeff-vm-core/Cargo.toml" },
    { file = "../doeff-vm-core/Cargo.lock" },
    { file = "../doeff-vm-core/src/**/*.rs" },
    { file = "doeff_cargo_backend.py" },
    { env = "RUSTFLAGS" },
    { env = "CARGO_ENCODED_RUSTFLAGS" },
    { env = "RUSTC" },
    { env = "MACOSX_DEPLOYMENT_TARGET" },
    { env = "CARGO_BUILD_TARGET" },
    { env = "CARGO_BUILD_RUSTFLAGS" },
    { env = "CARGO_PROFILE_RELEASE_DEBUG" },
    { env = "CARGO_PROFILE_RELEASE_STRIP" },
    { env = "CARGO_PROFILE_RELEASE_LTO" },
    { env = "CARGO_PROFILE_RELEASE_OPT_LEVEL" },
    { env = "CARGO_PROFILE_RELEASE_CODEGEN_UNITS" },
    { env = "MATURIN_PEP517_ARGS" },
    { env = "PYO3_PYTHON" },
    { env = "PYO3_CONFIG_FILE" },
]
