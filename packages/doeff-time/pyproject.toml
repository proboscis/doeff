[build-system]
# license の SPDX の式と license-files(PEP 639)を既定で core metadata に書くのは hatchling 1.27 から(既定の版 2.4)。
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doeff-time"
version = "0.2.0"
description = "Algebraic effects for Python: provider-agnostic time effects for doeff (delay, wait until, clock readings, scheduling) with asyncio, blocking and virtual-time handlers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "time", "clock", "scheduling", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "doeff>=0.9.0,<0.10",
    "doeff-core-effects>=0.9.0,<0.10",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff/tree/main/packages/doeff-time"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_time"]

[tool.uv.sources]
doeff = { workspace = true }
