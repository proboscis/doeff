# Default effect recognition configuration for SEDA.
# Extend or override these patterns with a project-level `seda.toml` file.
# The vocabulary mirrors the constructors doeff exports today
# (`doeff_core_effects.effects`, re-exported from `doeff`); the built-in copy
# lives in `src/effect_registry.rs`. A non-literal key is reported as
# `<kind>:<dynamic>`.

[effects.ask]
kind = "ask"
match = { call = "Ask", args = ["literal"] }

[effects.tell]
kind = "tell"
match = { call = "Tell", args = ["literal"] }

[effects.get]
kind = "get"
match = { call = "Get", args = ["literal"] }

[effects.put]
kind = "put"
match = { call = "Put", args = ["literal", "any"] }

[effects.slog]
kind = "slog"
match = { call = "slog", args = ["any"] }

[combinators.compose]
strategy = "union"

[combinators.pipe]
strategy = "union"

[combinators.partial]
strategy = "alias"

[limits]
max_tree_depth = 8
max_recursions = 16
