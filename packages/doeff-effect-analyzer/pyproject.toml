[build-system]
requires = ["maturin>=1.4,<2.0"]
# maturin を包み、cargo の target を作業木の外の一時の dir に置く(tools/doeff_cargo_backend.py・agora-redesign #1493)
build-backend = "doeff_cargo_backend"
backend-path = ["."]

[project]
name = "doeff-effect-analyzer"
version = "0.1.0"
description = "Static effect dependency analyzer for doeff programs"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]

[project.scripts]
doeff-effects = "doeff_effect_analyzer.cli:main"

[tool.maturin]
features = ["python"]
# Mixed layout: the pure-Python front end lives in python/doeff_effect_analyzer,
# the Rust core is the extension doeff_effect_analyzer._native.
python-source = "python"
module-name = "doeff_effect_analyzer._native"
