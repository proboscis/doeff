[project]
name = "doeff-core-effects"
version = "0.5.0"
description = "Standard effects and handlers for doeff: state, reader, writer, concurrency, HTTP, SQL, files and processes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# 核の 5 個は 1 つの番号で出し、互いの依存はその 2 桁の系に限る(tests/test_core_packages_version.py)。
dependencies = [
    "doeff>=0.5.0,<0.6",
    "doeff-hy>=0.5.0,<0.6",
    "frozendict>=2.4.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff/tree/main/packages/doeff-core-effects"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"

[project.optional-dependencies]
# 汎用の HTTP の待ち受けの本物の答え手 aiohttp-http-server(doeff_core_effects/aiohttp_http_server.hy — agora-redesign #802)と、
# 汎用の WebSocket の client の本物の答え手 aiohttp-ws-client(doeff_core_effects/aiohttp_ws_client.hy — agora-redesign #4007 U0)。
http-server = ["aiohttp>=3.14"]
# 汎用の SQL の本物の PostgreSQL の答え手 postgres-sql-handler(doeff_core_effects/postgres_sql.hy — agora-redesign #802 便 3)。
# ClickHouse の答え手は stdlib の urllib だけで、sqlite の答え手は stdlib の sqlite3 だけを使う。
postgres = ["psycopg>=3.1"]

[build-system]
# license の SPDX の式と license-files(PEP 639)を既定で core metadata に書くのは hatchling 1.27 から(既定の版 2.4)。
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doeff_core_effects", "doeff_lifeline"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-hy = { workspace = true }
