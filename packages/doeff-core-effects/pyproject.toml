[project]
name = "doeff-core-effects"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "doeff",
    "doeff-hy",
    "frozendict>=2.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# 汎用の HTTP の待ち受けの本物の答え手 aiohttp-http-server(doeff_core_effects/aiohttp_http_server.hy — agora-redesign #802 便 2)。
http-server = ["aiohttp>=3.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doeff_core_effects"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-hy = { workspace = true }
