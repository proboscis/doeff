[project]
name = "doeff-core-effects"
version = "0.8.0"
description = "Algebraic effects for Python: the standard doeff effects and handlers for state, reader, writer, concurrency, HTTP, SQL, files and processes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "concurrency", "state"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The 5 core packages are released under one version number, and their mutual dependencies are limited to that 2-digit series (tests/test_core_packages_version.py).
# The default is the Python core only -- pip install doeff installs 4 packages: doeff, doeff-vm, doeff-core-effects and frozendict. Hy (doeff-hy) for the Hy-written
# effects and handlers, and httpx for the HTTP client, are added by the extras below (tests/test_core_install_extras.py).
dependencies = [
    "doeff>=0.8.0,<0.9",
    "frozendict>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff/tree/main/packages/doeff-core-effects"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Hy that loads the Hy-written effects and handlers (file, process, sql, random, channel, meter, etc., cache).
hy = ["doeff-hy>=0.8.0,<0.9"]
# Handler for the HTTP client (http_handlers -- written in Hy, sends via httpx).
http = ["doeff-hy>=0.8.0,<0.9", "httpx>=0.27.0"]
# hy and http -- the same combination as the default up to 0.5.
all = ["doeff-hy>=0.8.0,<0.9", "httpx>=0.27.0"]
# The real answerer aiohttp-http-server for the generic HTTP listener (doeff_core_effects/_aiohttp_http_server.hy), and
# the real answerer aiohttp-ws-client for the generic WebSocket client (doeff_core_effects/_aiohttp_ws_client.hy).
# Both are written in Hy, so doeff-hy is included too.
http-server = ["doeff-hy>=0.8.0,<0.9", "aiohttp>=3.14"]
# The real PostgreSQL answerer postgres-sql-handler for generic SQL (doeff_core_effects/_postgres_sql.hy).
# Written in Hy, so doeff-hy is included too. The ClickHouse answerer uses only stdlib urllib and the sqlite answerer only stdlib sqlite3
# (both are written in Hy, so they are installed via the hy extra).
postgres = ["doeff-hy>=0.8.0,<0.9", "psycopg>=3.1"]

[build-system]
# Writing the license SPDX expression and license-files (PEP 639) into core metadata by default starts with hatchling 1.27 (default version 2.4).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doeff_core_effects", "doeff_lifeline"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-hy = { workspace = true }
