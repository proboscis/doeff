[project]
name = "doeff-core-effects"
version = "0.8.0"
description = "Algebraic effects for Python: the standard doeff effects and handlers for state, reader, writer, concurrency, HTTP, SQL, files and processes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "concurrency", "state"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# 核の 5 個は 1 つの番号で出し、互いの依存はその 2 桁の系に限る(tests/test_core_packages_version.py)。
# 既定は Python の核だけ — pip install doeff は doeff・doeff-vm・doeff-core-effects・frozendict の 4 個を入れる。Hy で書いた
# effect と handler の Hy(doeff-hy)と、HTTP の client の httpx は下の extra で足す(tests/test_core_install_extras.py)。
dependencies = [
    "doeff>=0.8.0,<0.9",
    "frozendict>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff/tree/main/packages/doeff-core-effects"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Hy で書いた effect と handler(file・process・sql・random・channel・meter など・cache)を読む Hy。
hy = ["doeff-hy>=0.8.0,<0.9"]
# HTTP の client の handler(http_handlers — Hy で書いてあり、httpx で送る)。
http = ["doeff-hy>=0.8.0,<0.9", "httpx>=0.27.0"]
# hy と http — 0.5 までの既定と同じ組。
all = ["doeff-hy>=0.8.0,<0.9", "httpx>=0.27.0"]
# 汎用の HTTP の待ち受けの本物の答え手 aiohttp-http-server(doeff_core_effects/_aiohttp_http_server.hy)と、
# 汎用の WebSocket の client の本物の答え手 aiohttp-ws-client(doeff_core_effects/_aiohttp_ws_client.hy)。
# どちらも Hy で書いてあるので doeff-hy も入れる。
http-server = ["doeff-hy>=0.8.0,<0.9", "aiohttp>=3.14"]
# 汎用の SQL の本物の PostgreSQL の答え手 postgres-sql-handler(doeff_core_effects/_postgres_sql.hy)。
# Hy で書いてあるので doeff-hy も入れる。ClickHouse の答え手は stdlib の urllib だけで、sqlite の答え手は stdlib の sqlite3 だけを
# 使う(どちらも Hy で書いてあるので extra hy で入れる)。
postgres = ["doeff-hy>=0.8.0,<0.9", "psycopg>=3.1"]

[build-system]
# license の SPDX の式と license-files(PEP 639)を既定で core metadata に書くのは hatchling 1.27 から(既定の版 2.4)。
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doeff_core_effects", "doeff_lifeline"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-hy = { workspace = true }
