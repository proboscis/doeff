[project]
name = "doeff-agentic"
version = "0.1.0"
description = "Agent-based workflow orchestration combining doeff-flow and doeff-agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
keywords = ["doeff", "agentic", "workflow", "orchestration", "agents", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # extra hy — state が Hy で書いた process の effect(doeff_core_effects._os_process)を読む。
    "doeff[hy]>=0.1.9",
    "doeff-flow>=0.1.0",
    "doeff-time",
    "click>=8.0.0",
    "rich>=13.0.0",
    "textual>=0.44.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Legacy tmux-based handler (deprecated)
legacy = [
    "doeff-agents>=0.1.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
# doeff-agentic answers ps・show・watch・attach・send・stop with the arguments and the JSON the IDE
# plugins use. It is the only provider of the doeff-agentic executable: the Rust CLI that used to
# provide it was removed.
doeff-agentic = "doeff_agentic._cli:main"
doeff-agentic-tui = "doeff_agentic._tui:main"

[project.urls]
Homepage = "https://github.com/proboscis/doeff"
Repository = "https://github.com/proboscis/doeff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_agentic"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-flow = { workspace = true }
doeff-time = { workspace = true }
