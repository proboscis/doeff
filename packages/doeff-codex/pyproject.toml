[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doeff-codex"
version = "0.1.0"
description = "codex の app-server(JSON-RPC・stdio)の process の器と、stdout の 1 行を型つきの記録へ分ける読み手(答えの文字の途中を含む)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "doeff>=0.2.0",
    "doeff-hy",
    "hy>=1.3",
]

[tool.hatch.build.targets.wheel]
# import 名 doeff_codex は Hy の module だけの namespace package(__init__ を持たない — hy を読み込んだ process が import する)。
packages = ["src/doeff_codex"]
# editable の install は .py の無い dir を sys.path に載せない — src を明示して載せる。
dev-mode-dirs = ["src"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-hy = { workspace = true }
