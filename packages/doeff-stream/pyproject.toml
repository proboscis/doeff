[project]
name = "doeff-stream"
version = "0.1.0"
description = "A fold over merged input sources for doeff: a pure step decides, the runtime runs its effects in tasks and feeds every task's end back as an input"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
dependencies = [
    "doeff>=0.1.0",
    "doeff-core-effects>=0.1.0",
    # Inputs reach the fold through the bus (Publish / WaitForEvent) and deadlines as TimerFired.
    "doeff-events>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_stream"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-events = { workspace = true }
