concern = "the DOEFF212 findings of one module with what reporting needs"
key = ["rel"]
fan_out = 3
review = "design-evidence-review-2026-11-20"

[[element.field]]
name = "rel"
type = "String"
fact = "the module's path from the root"

[[element.field]]
name = "path"
type = "PathBuf"
fact = "the module's path on disk"

[[element.field]]
name = "source"
type = "String"
fact = "the module's contents (for ranges)"

[[element.field]]
name = "hits"
type = "Vec<Hit>"
fact = "the findings"

[[element.rejected]]
shape = "a map from path to hits"
why = "the source travels with the hits to place ranges; a record keeps them together"
