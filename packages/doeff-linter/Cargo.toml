[package]
name = "doeff-linter"
version = "0.2.0"
edition = "2021"
description = "A linter for enforcing code quality and immutability patterns in Python"
license = "MIT"
repository = "https://github.com/proboscis/doeff"
keywords = ["linter", "python", "immutability", "code-quality"]

[lib]
name = "doeff_linter"
path = "src/lib.rs"

[[bin]]
name = "doeff-linter"
path = "src/main.rs"

[dependencies]
rustpython-parser = "0.4.0"
rustpython-ast = "0.4.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
colored = "2.1"
rayon = "1.10"
regex = "1.10"
# Checks only the syntax of whether a declared regex is readable (check_regex in architecture.rs). The regex dependency is already in Cargo.lock (no new crate is added).
regex-syntax = "0.8"
once_cell = "1.19"
chrono = "0.4"
# Facts of Hy files (definitions, imports, raw evidence of raw side effects) and the reader -- calls hy-index's analysis as a function (no child process is used).
doeff-indexer = { path = "../doeff-indexer", default-features = false }
# HTTP client used by the semantic rules (DOEFF201, DOEFF202) to ask Jev (Vercel AI Gateway) (used only with --semantic).
ureq = { version = "2.10", default-features = false, features = ["tls"] }
sha2 = "0.10"
# Before storing, the fact cache's store looks for absolute root paths in the spelling of values (SIMD substring search -- about 64KB per fact, thousands of times).
# The regex dependency is already in Cargo.lock (no new crate is added).
memchr = "2"
# Collects unknown config keys with their paths without stopping (the struct definition is the single source of truth for known keys -- no hand-maintained key table).
serde_ignored = "0.1"
# Stores the per-file cache of the repo-wide Hy index in a binary form without field names (147MB in JSON, 1.2 seconds to read).
bincode = "1.3"
# Binary allocator (global_allocator in main.rs) -- reading, walking, and tearing down the index cache involves millions of small allocations and frees, and the default allocator
# accounted for nearly half of a single-file run.
mimalloc = { version = "0.1", default-features = false }
# Decides whether to add more threads that stack up waiting by whether the thread requested disk reads (ru_inblock of getrusage's RUSAGE_THREAD) (Widen in bulk_read.rs).
# Already in Cargo.lock via dependencies such as mimalloc (no new crate is added).
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

