[package]
name = "doeff-linter"
version = "0.2.0"
edition = "2021"
description = "A linter for enforcing code quality and immutability patterns in Python"
license = "MIT"
repository = "https://github.com/proboscis/doeff"
keywords = ["linter", "python", "immutability", "code-quality"]

[lib]
name = "doeff_linter"
path = "src/lib.rs"

[[bin]]
name = "doeff-linter"
path = "src/main.rs"

[dependencies]
rustpython-parser = "0.4.0"
rustpython-ast = "0.4.0"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
colored = "2.1"
rayon = "1.10"
regex = "1.10"
once_cell = "1.19"
chrono = "0.4"
# Hy の file の事実(定義・import・生の副作用の証拠 raw)と読み取り器 — hy-index の解析を関数として呼ぶ(子 process は使わない)。
doeff-indexer = { path = "../doeff-indexer", default-features = false }
# 意味の規則(DOEFF201・202)で Jev(Vercel AI Gateway)へ問う HTTP の口(--semantic の時だけ使う)。
ureq = { version = "2.10", default-features = false, features = ["tls"] }
sha2 = "0.10"
# 設定の知らない鍵を、止めずに path つきで集める(struct の定義が知っている鍵の唯一の正本 — 鍵の表を手で持たない・agora-redesign #848)。
serde_ignored = "0.1"
# repo 全体の Hy の索引の file ごとの cache を、欄の名前を持たない binary の形で置く(JSON では 147MB・読みに 1.2 秒 — agora-redesign #1364)。
bincode = "1.3"
# binary の確保器(main.rs の global_allocator)— 索引の cache の読み・辿り・後片づけは小さな確保と解放の数百万回で、既定の確保器では
# 1 file の実行の半分近くを占めた(agora-redesign #1364)。
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

