[project]
name = "doeff-linter"
dynamic = ["version"]
description = "A linter for enforcing code quality and immutability patterns in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
keywords = ["linter", "python", "immutability", "code-quality", "doeff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
# Wraps maturin and puts cargo's target in a temporary dir outside the working tree (tools/doeff_cargo_backend.py)
build-backend = "doeff_cargo_backend"
backend-path = ["."]

[tool.maturin]
# Build as a pure Rust binary, not a Python extension
bindings = "bin"
strip = true
# The sdist carries the path-dependency crate (doeff-indexer), so the crate is moved under doeff-linter/. The build entry point
# must sit at the same root as pyproject (backend-path = ["."]), so it is copied to the root — without it the sdist cannot be built.
include = [{ path = "doeff_cargo_backend.py", format = "sdist" }]

# Inputs that let uv decide whether to rebuild (parent #1160).
# By default uv rebuilds a dependency installed by path only when pyproject.toml / setup.py / setup.cfg changes.
# The contents of this package are a Rust binary, so even if a .rs under src changes, the consumer's venv keeps the old binary
# (example: the `doeff-linter --version` in the agora-controllers venv kept reporting 7cfe942, from before the history rewrite).
# So we list all inputs of the binary:
#   - this crate's Cargo.toml, build.rs (decides the commit embedded in the version), .rs files under src, and .json data embedded via include_str!
#   - the path-dependency ../doeff-indexer's Cargo.toml, Cargo.lock, .rs files under src, and .json data
#   (this crate's Cargo.lock is not tracked in git, so it is not used as a key — add it if it gets tracked)
# We do not use the per-doeff-commit rebuild form (`{ git = { commit = true } }`) because the Rust build takes about 2 minutes.
# As a result, commits that change neither .rs nor data (docs only, etc.) do not trigger a rebuild, and the displayed version stays at the previous commit.
# To revert = delete this [tool.uv] section (back to uv's default).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "build.rs" },
    { file = "src/**/*.rs" },
    { file = "data/**/*.json" },
    { file = "../doeff-indexer/Cargo.toml" },
    { file = "../doeff-indexer/Cargo.lock" },
    { file = "../doeff-indexer/src/**/*.rs" },
    { file = "../doeff-indexer/data/**/*.json" },
]



