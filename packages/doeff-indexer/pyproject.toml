[build-system]
# 同梱する CLI の binary は .gitignore で python の source から外れ、下の include が wheel に足す。maturin 1.12 以前は足す file を
# project の根からの path のまま(python/doeff_indexer/bin/)入れ、命令の入口(_cli.py)が探す doeff_indexer/bin/ に無かった
# (PyPI の 0.1.3 の wheel)。python-source の下の path に直して入れるのは maturin 1.13 から(tools/verify_indexer_wheel.py が見る)。
requires = ["maturin>=1.13,<2.0"]
build-backend = "doeff_indexer_build_backend"
backend-path = ["."]

[project]
name = "doeff-indexer"
version = "0.2.0"
description = "Static indexer for doeff programs and Kleisli programs"
# Python の口は effect FindSymbols(python/doeff_indexer/_effects.py)と handler rust_indexer(_handlers.py)なので doeff を
# 読み、doeff と同じ版の Python から(ADR-DOE-API-001・agora card ki-1e51e218527e)。拡張の abi3 は Cargo.toml の pyo3 の
# abi3-py310 のまま(wheel の tag は cp310-abi3 で、入れられる版はこの requires-python が決める)— py311 へ上げるのは、wheel を
# 組む CI(.github/workflows/build-indexer.yml)の 3.10 の Python を 3.11 へ替えるのと同じ変更で。
# 0.2.0 で Python の口が替わった(class Indexer は入口に無い)。
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
dependencies = [
    "doeff>=0.8.0,<0.9",
]

[project.scripts]
doeff-indexer = "doeff_indexer._cli:main"

[tool.maturin]
features = ["python"]
# Rust の索引器の Python の口は内側の拡張 doeff_indexer._native。利用者は入口の effect と handler で引く(ADR-DOE-API-001)。
module-name = "doeff_indexer._native"
python-source = "python"
include = [
    { path = "python/doeff_indexer/bin/*", format = "wheel" }
]

[tool.uv.sources]
doeff = { workspace = true }

# uv が「作り直すか」を決める入力(doeff-linter の pyproject の同じ節と同じ訳)。root の dev の組が make sync でこの package を
# editable で入れ(目録と discovery の検が Rust の拡張を import する・card ki-1e51e218527e)、uv は既定では pyproject.toml が変わった
# 時にしか作り直さないので、拡張と同梱の binary の入力を全部並べる。python/ の .py は作業木から読むので鍵にしない。
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "data/**/*.json" },
]
