[build-system]
# The bundled CLI binary is excluded from the python source by .gitignore, and the include below adds it to the wheel. Up to maturin 1.12, the files to add were
# placed with their path from the project root unchanged (python/doeff_indexer/bin/), so they were not in doeff_indexer/bin/ where the command entry point (_cli.py) looks
# (the PyPI 0.1.3 wheel). Placing them at a path under python-source starts with maturin 1.13 (checked by tools/verify_indexer_wheel.py).
requires = ["maturin>=1.13,<2.0"]
build-backend = "doeff_indexer_build_backend"
backend-path = ["."]

[project]
name = "doeff-indexer"
version = "0.2.0"
description = "Static indexer for doeff programs and Kleisli programs"
# The Python interface is the effect FindSymbols (python/doeff_indexer/_effects.py) and the handler rust_indexer (_handlers.py), so it imports doeff
# and needs the same Python version as doeff (ADR-DOE-API-001). The extension's abi3 stays at pyo3's abi3-py310 in Cargo.toml
# (the wheel tag is cp310-abi3, and the installable versions are decided by this requires-python) -- raising to py311 is done in the same change that moves the CI
# that builds the wheel (.github/workflows/build-indexer.yml) from Python 3.10 to 3.11.
# In 0.2.0 the Python interface changed (class Indexer is no longer at the entry point).
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
dependencies = [
    "doeff>=0.8.0,<0.9",
]

[project.scripts]
doeff-indexer = "doeff_indexer._cli:main"

[tool.maturin]
features = ["python"]
# The Python interface of the Rust indexer is the inner extension doeff_indexer._native. Users query through the entry-point effect and handler (ADR-DOE-API-001).
module-name = "doeff_indexer._native"
python-source = "python"
include = [
    { path = "python/doeff_indexer/bin/*", format = "wheel" }
]

[tool.uv.sources]
doeff = { workspace = true }

# Inputs by which uv decides whether to rebuild (same reason as the same section of doeff-linter's pyproject). The root dev group installs this package
# editable via make sync (the catalog and discovery tests import the Rust extension), and by default uv rebuilds only when pyproject.toml changes,
# so all inputs of the extension and the bundled binary are listed. The .py files under python/ are read from the working tree, so they are not keys.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "data/**/*.json" },
]
