[project]
name = "doeff-claude-judge"
version = "0.1.0"
description = "Claude structured-output translation for doeff-system-one judgments (Judge -> system/user text and JSON Schema, structured answer -> Verdict)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
keywords = ["doeff", "effects", "claude", "system-one", "judgment", "structured-output"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "doeff>=0.1.0",
    "doeff-system-one",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff"
Repository = "https://github.com/proboscis/doeff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_claude_judge"]

[tool.uv.sources]
doeff = {workspace = true}
doeff-system-one = {workspace = true}
