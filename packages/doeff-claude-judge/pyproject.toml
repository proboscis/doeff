[project]
name = "doeff-claude-judge"
version = "0.1.0"
description = "Claude judge for doeff-system-one: Judge -> system/user text and JSON Schema -> one Claude Code CLI print run -> Verdict"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
keywords = ["doeff", "effects", "claude", "system-one", "judgment", "structured-output"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "doeff>=0.1.0",
    "doeff-system-one",
    "doeff-core-effects",
    "doeff-claude-code",
    "doeff-hy",
    "hy>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff"
Repository = "https://github.com/proboscis/doeff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_claude_judge"]

[tool.uv.sources]
doeff = {workspace = true}
doeff-system-one = {workspace = true}
doeff-core-effects = {workspace = true}
doeff-claude-code = {workspace = true}
doeff-hy = {workspace = true}
