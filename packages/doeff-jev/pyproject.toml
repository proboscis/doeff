[project]
name = "doeff-jev"
version = "0.1.0"
description = "TypeSafe Jev handlers for doeff-system-one judgments (direct System One API and Vercel AI Gateway), target resolution, answer cache"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
keywords = ["doeff", "effects", "jev", "typesafe", "system-one", "judgment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "doeff>=0.1.0",
    # extra http — 宛先の解決が Hy で書いた process の effect を、本番の配線が HTTP の client の handler を読む(card ki-006338b48f4b)。
    "doeff-core-effects[http]>=0.1.0",
    "doeff-system-one",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/proboscis/doeff"
Repository = "https://github.com/proboscis/doeff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_jev"]

[tool.uv.sources]
doeff = {workspace = true}
doeff-core-effects = {workspace = true}
doeff-system-one = {workspace = true}
