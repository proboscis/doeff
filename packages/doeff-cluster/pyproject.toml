[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doeff-cluster"
version = "0.1.0"
description = "doeff の Program を k8s の Deployment のように動かし続けるクラスタ(coordinator・worker・lease・Rollout・drain・effect の記録と再生)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "doeff>=0.2.0",
    "doeff-core-effects",
    "doeff-events[redis]",
    "doeff-hy",
    "doeff-time",
    "hy>=1.3",
    "httpx>=0.25.0",
    "cloudpickle>=3.0",
]

[tool.hatch.build.targets.wheel]
# import 名 doeff_cluster は Hy の module だけの namespace package(__init__ を持たない — hy を読み込んだ process が import する)。
packages = ["src/doeff_cluster"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-events = { workspace = true }
doeff-hy = { workspace = true }
doeff-time = { workspace = true }

# doeff-linter の設定 — この dir で linter を走らせた時だけ読む(linter は今の dir から上へ [tool.doeff-linter] を探す。
# doeff の根で走る hook と make lint-doeff は根の pyproject.toml を読む)。service と不変条件の宣言は同じ dir の architecture.hy。
# DOEFF013 は根の設定と同じ理由で外す(Optional / None を意図して使う)。層の置き場の規則 DOEFF114・115 は、src/doeff_cluster/ の
# 直下に平たく在った module を service → 層(core / intent / protocol / entry)と shared・foundation へ移す間(#1988・#2021・#1976)
# 対象外にしていた。最後の 3 file(新しい置き場を読み直すだけの旧い入口 cluster_foundation・job_context・job_entry)を消した変更で
# 効かせた(利用者 2026-10-03 00:1x "delete immediately. correctness is prioritized over 'working' somehow"・#2095・#2167)。
# root = "src": module の名を import の名(doeff_cluster.x)に揃える(この dir を根にすると src.doeff_cluster.x になる)。
# include = ["tests"]: 根の外の検の dir も歩く範囲に入れ、下の [tool.doeff-linter.definitions] の定義の書き方の規則で判じる
# (#2821 の案 A-1 — 以前は tests/ の .hy は linter の対象の外で、hook でも手元でも測られていなかった)。層の規則は
# 根の下の層の置き場だけなので tests には当たらない。定義の書き方の規則の母集団は src と tests(#2908 で src を足した)。
# 効かせるのは critical(DOEFF126 素の defk 呼び)・DOEFF112(タグ — 頭の MODULE-TAGS で補う・#2908)と当たり 0 の規則 —
# 当たりの在る major・minor(DOEFF110 defn・111 deff の理由・118 deftest でない検・119 class・123・124・125)は disable に置き、
# #2877 の子が数を 0 にした変更で 1 つずつ外す(先に効かせて main を赤にしない・登録簿に載せて通さない)。disable は package 全体で
# 1 つなので、DOEFF110 は tests と src の defn が両方 0 になった変更で外す。minor(123・124・125)は今は扱わない。
# DOEFF111 は src と tests の理由の無い deff が 0 になった変更(#2941 — http-request を defk に)で外した。
# DOEFF119 は情報の規則として当たりを直す作業を止めている(利用者 2026-10-01 の決め・#2912)ので disable に置いたまま。
[tool.doeff-linter]
root = "src"
architecture = "architecture.hy"
include = ["tests"]
disable = ["DOEFF013", "DOEFF110", "DOEFF119", "DOEFF123", "DOEFF124", "DOEFF125"]

# 生の副作用(環境変数・時刻・乱数・file・process・http・signal)に直に触ってよい層は foundation だけ(DOEFF106 — 書かないと
# DOEFF106 は何も出さずに走らない)。利用者の決め(2026-10-02 22:2x "reading env var from outside foundation handler is clear
# violation")で効かせた — それ以外の層は effect を出し、foundation の答え手(os-file-handler・subprocess-handler・時計の handler など)
# が答える(#3014)。当たりは 0 にしてから効かせた(登録簿に載せて通さない)。残る warning 1 件 = coordinator/protocol/store.hy の
# (.exists store)(置き場の Protocol の method・書き方では Path.exists と見分けられない弱い証拠 — cisco-c8 の決め・#3014)。
[tool.doeff-linter.raw_side_effects]
allowed_layers = ["foundation"]

[tool.doeff-linter.definitions]
paths = ["doeff_cluster", "../tests"]
test_paths = ["../tests/**/test_*.hy"]
