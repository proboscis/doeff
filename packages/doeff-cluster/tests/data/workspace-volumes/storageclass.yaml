# 作業場所の volume の級の例(検 test_workspace_volumes_handler.hy が級の parameters を読む)。現場の宣言は上に載る系の repo が持つ
# (この package は名と形だけを決める — README.md の「配備の材料」)。
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-workspace
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  diskSelector: "workspace"
  dataLocality: "best-effort"
  fsType: "ext4"
  staleReplicaTimeout: "2880"
  backupTargetName: "garage-workspace"
  recurringJobSelector: '[{"name":"workspace-backup","isGroup":true},{"name":"default","isGroup":true}]'
