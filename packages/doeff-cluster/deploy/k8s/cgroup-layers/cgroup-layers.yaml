# 機体の仕事だけを受ける worker の cgroup の層の共通の部分(JSON patch)。形は zeus と同じ(../nodes/zeus/cgroup.yaml の頭の註)。
#
# 訳: 層が無いと、常駐の job と、task・実行環境と木の準備・入口の検め・待ちの子が container の cgroup 1 つ(memory.max と cpu.max だけ)を
# 分け合い、1 本が上限の手前で回収を詰まらせると常駐の job も止まる(zeus の 10-24 06:03 JST の 16.7 分の止まりと同じ形)。CPU が埋まった
# 時も、常駐の job の thread が一括の仕事の thread と同じ重みで実行待ちに並ぶ。
#
# 層の名: worker = 起動の script・worker の本体・exec = init の tini だけ(と、runc が init の cgroup へ入れる kubectl exec・
# readinessProbe・preStop — WORKER_CGROUP_INIT_LAYER・deploy/boot.sh の「init の層」)・services = 常駐の job の shim と子・jobs = task・
# 待ちの子・実行環境と木の準備・入口の検め・keeper の版の準備(準備の層を宣言しない機体)・prepare = keeper の版の準備(宣言する機体
# だけ — 機体の cgroup.yaml の DOEFF_WORKER_PREPARE_CGROUP)・clis と commands = 会話の CLI とその命令(上に載る系の仕事を余りの空きで
# 受ける機体だけ — ../guest-work。zeus と違って clis も限る層)。値は機体の dir の cgroup.yaml の WORKER_CGROUP_LAYOUT。
#
# 値の決め方(helios の外 — helios の値の訳は ../nodes/helios/cgroup.yaml):
# - worker の memory.min 256M: worker の本体の RSS 126〜132 MiB(10-27 の 4 機体・11-01 の atlas 132 MiB)に余裕を足した、枠の file の worker
#   自身の分と同じ値。
# - exec の memory.max(init の層 — exec の命令が際限なく memory を増やしても、kernel はこの層の中だけで OOM で止める。11-04 12:59 UTC の
#   zeus では exec の grep 2 本が init と同じ上限の無い worker の層で 69 GB を持ち、機体の全体の OOM になった): 要る量 = readinessProbe +
#   preStop の drain 2 本(keeper の世代の重なり)+ 運用の読み。11-04 18:2x UTC に zeus の Pod で測った子の RSS の最大: readinessProbe
#   (ROLE=ready)15 MiB・drain の hy(drain_main の import)54 MiB・tail -n 5000・grep -c・ps・du 12〜15 MiB — 和 15 + 2 × 54 + 15 = 138 MiB。
#   ほかの層の値を変えずに置ける量(container の上限 − 守る層の min − 限る層の max)が 256M の機体(eos・k3s-0・k3s-2・k3s-3)と、それに
#   揃えた k3s-1 は 256M。空きの大きい atlas・helios は 512M(zeus は 1G — ../nodes/zeus/cgroup.yaml)で、運用の hy の 1 本(worker の本体と同じ
#   import で 300〜470 MiB)も通る値。cpu.weight は前に居た worker の層と同じ 1000(probe と preStop は遅れに敏感な 1 本 — 配備の層と同じ扱い)。
#   予算(memoryMiB)からは引かない: exec の命令は前から worker の層に居て予算の外だった。
# - jobs の memory.max = 準備の分 1536M + task の予約 × 3G。準備の分は、container の上限 2Gi の機体(k3s-0〜2)で準備が通っていた余地
#   (2Gi − worker の本体と常駐の job の約 0.4 GiB。oom_kill は 11-01 までの 5 日で 0)。task の 1 本の分は枠の file の task の分と同じ 3G。
#   この値は静的な上限: worker は見張りの回ごとに jobs の層の memory.max を、kubelet が Pod を追い出す線までの空き(Node の allocatable −
#   Pod の全部の working set — 下の host の cgroupfs の mount と Node の status から読む)から掛け直す(worker/protocol/eviction_line)。
# - prepare の memory.max(準備の層 — 空きの小さい機体 k3s-0〜2 だけ): keeper の版の準備を、追い出しの線から縮める jobs の層の外に置く
#   (11-02 の k3s-1 は jobs の上限 61〜139 MiB で準備の焼きが OOM で落ち続けた)。worker はこの値を縮めず、準備が走る間は値までの残りを
#   線の空きから先に取り置き、空きが値に足りない間は keeper が準備を起こさずに待つ(worker/core/eviction_rules の頭の註)。値 = 準備の山:
#   doeff 6e1996649 の root を冷えた bytecode の保存先で準備した process の木の anon の最大 — 焼き(並列数 = container の CPU の上限)2 並列で
#   453 MiB・8 並列で 802 MiB・uv sync で 275 MiB(11-02 に手元で測った)。CPU の上限 2 の機体は 453 × 1.4 を 128 MiB に切り上げた 640M。
#   jobs の層の値は、前の準備の分からこの値を引いた分(和は前のまま — 実行環境と木の準備は同じ焼きの道具で jobs の層に残る)。
#   空きの大きい機体(atlas・eos・k3s-3 — jobs の上限が線から縮めても準備の山を越える)と zeus・helios は宣言せず、準備は jobs の層で起きる。
# - 余裕 WORKER_EVICTION_MARGIN(追い出しの線の手前に残す余裕の床 — 宣言の無い機体は 1 GiB): その機体の 7 日の、worker の外の Pod の
#   working set の和の 30 秒の増えの最大を、5 秒の回 6 つに均して回 2 つ分にした値(最大 ÷ 3)を 64 MiB に切り上げ、128 MiB を下限にする
#   (atlas の 1 GiB と同じ式 — eviction_rules の EVICTION-MARGIN-BYTES の註)。worker は回ごとに外の増えを測り、p999 × 2 が床を越えれば
#   それを使う(載る Pod が替わった時に宣言の書き直しを待たない)。
# - 枠の file の memoryMiB(常駐の job の memory の予算)= container の上限 − worker の memory.min − jobs の memory.max(zeus と同じ式)。
#   会話の CLI と命令の限る層(clis・commands)を置く機体は、その 2 つの memory.max も引く — 会話は常駐の job の予算の外の余りだけを使う。
# - services の memory.min(atlas と k3s-1 の外)= その予算から 256M を引いた値(守る層と限る層の和を container の上限の内に残す余り)。どの機体でも、1 台の
#   worker の停止で移る常駐の job の落ち着いた値と起動の山(N+1 の判断 failover-refusals が予算に求める値)以上。
# - container の上限 = 層の和が入る大きさ。task を受けない機体は、予算を前の値のまま残すよう、前の上限に準備の分を足した(前の予算は
#   準備の memory を数えていなかった)。層が準備を jobs の max で抑えるので、ふだんの使いは上限を上げても増えない — 増えうるのは 1 台の停止で
#   常駐の job が移った時の services だけで、それは前の予算が既に約束していた分。
#
# 雛形の env の並び(WORK_DIR が 1 番・WORKER_PROVIDES が 5 番 — ../host-only と ../guest-work の操作が読む)を動かさないよう、足す物は全部末尾へ足す。
- op: add
  path: /spec/template/spec/initContainers/-
  value:
    name: cgroup-delegate
    image: zeus:5000/agent-worker-exp:in-c17f84e4dcaa
    restartPolicy: Always
    securityContext: { privileged: true, runAsUser: 0, runAsNonRoot: false }
    resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
    command: ["/bin/sh", "-c"]
    args:
      - |
        own=$(sed -n 's/^0:://p' /proc/self/cgroup)
        case "$own" in
          /kubepods*/*.scope) ;;
          *) echo "cgroup-delegate: 自分の cgroup '$own' が Pod の slice の下の container の cgroup でない(host の cgroup の名前空間で起きていない)" >&2
             exit 1 ;;
        esac
        slice=/sys/fs/cgroup${own%/*}
        echo "cgroup-delegate: $slice の container の cgroup を uid 1000 へ委ねる" >&2
        while :; do
          for d in "$slice"/*.scope; do
            [ -d "$d" ] && [ "$d" != "/sys/fs/cgroup$own" ] || continue
            [ "$(cat "$d/memory.max" 2>/dev/null)" != max ] || continue
            [ "$(stat -c %u "$d")" != 1000 ] || continue
            chown 1000:1000 "$d" "$d/cgroup.procs" "$d/cgroup.subtree_control" "$d/cgroup.threads" &&
              echo "cgroup-delegate: $d を uid 1000 へ委ねた" >&2
          done
          sleep 2
        done
- { op: add, path: /spec/template/spec/volumes/-, value: { name: host-cgroup, hostPath: { path: /sys/fs/cgroup, type: Directory } } }
- { op: add, path: /spec/template/spec/containers/0/volumeMounts/-, value: { name: host-cgroup, mountPath: /host/cgroup } }
- { op: add, path: /spec/template/spec/containers/0/env/-, value: { name: WORKER_CGROUP_HOST, value: /host/cgroup } }
- { op: add, path: /spec/template/spec/containers/0/env/-, value: { name: DOEFF_WORKER_SERVICE_CGROUP, value: services } }
- { op: add, path: /spec/template/spec/containers/0/env/-, value: { name: DOEFF_WORKER_JOB_CGROUP, value: jobs } }
- { op: add, path: /spec/template/spec/containers/0/env/-, value: { name: WORKER_CGROUP_INIT_LAYER, value: exec } }
