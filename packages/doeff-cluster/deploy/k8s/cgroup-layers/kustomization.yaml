# 機体の仕事だけを受ける worker の cgroup の層の共通の部分(zeus でない機体の dir が components で読む)。この dir だけでは当てない。
# 層を作る訳・委ねる係・書ける見え・CPU の重みの訳は ../nodes/zeus/cgroup.yaml の頭の註(zeus は同じ宣言を自分の dir に持つ — test が
# 委ねる係を zeus と同じに保つ)。層の値(WORKER_CGROUP_LAYOUT)は機体ごとに違うので、機体の dir の cgroup.yaml が足す。
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # 委ねる係・host の cgroupfs の mount・層の名(JSON patch — 足す物は全部末尾へ)。
  - path: cgroup-layers.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
