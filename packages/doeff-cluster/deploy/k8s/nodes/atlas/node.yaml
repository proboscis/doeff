# atlas の差: 置く Node と資源の上限・取り分。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doeff-worker
  namespace: agent-worker
spec:
  template:
    spec:
      nodeSelector: { kubernetes.io/hostname: atlas }
      containers:
        - name: worker
          # atlas は CPU 16・memory 28Gi(Node の allocatable・2026-10-10 の実測)。coordinator と同じ機体。
          # 取り分は小さく(機体が他の Pod で埋まっていても置ける)、上限は最初の起動で doeff-vm の wheel を組む山と、上に載る系の日次の
          # 全体検証の task(:needs host-atlas・1 本の山は 12〜16Gi)を通す大きさ(2026-10-10 調整役 cisco-c8 の値 — 8Gi から 18Gi)。
          resources: { requests: { cpu: "500m", memory: 1Gi }, limits: { cpu: "8", memory: 18Gi } }
          env:
            # 受ける数: 機体の仕事 1 + 日次の全体検証の task に空けておく 2(host-only の既定 2・0 を置き換える — 同時に 2 本まで)。
            - { name: WORKER_CAPACITY, value: "3" }
            - { name: WORKER_TASK_RESERVE, value: "2" }
            # job の子へ渡す名に Rust の toolchain の置き場(image の env)を足す — task が Rust の部品を組む時に rustup が toolchain を選ぶ。
            # 雛形の値の後ろに足すだけ(道具の cache の置き場は task が WORK_DIR から自分で作る)。
            - name: WORKER_PASS_ENV
              value: "NODE_NAME,WORKER_HOST_SYSTEMD_ROOT,WORK_DIR,KUBERNETES_SERVICE_HOST,KUBERNETES_SERVICE_PORT,$(WORKER_PASS_ENV_EXTRA),RUSTUP_HOME"
