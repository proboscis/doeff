# atlas の差: 置く Node と資源の上限・取り分。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doeff-worker
  namespace: agent-worker
spec:
  template:
    spec:
      nodeSelector: { kubernetes.io/hostname: atlas }
      containers:
        - name: worker
          # atlas は CPU 16・memory の capacity 28.29 GiB(29662296Ki)・allocatable 19.79 GiB(20749400Ki = capacity − systemReserved 7Gi
          # − evictionHard 1.5Gi — 2026-11-01 の kubelet の configz と Node の status。28Gi は capacity で allocatable ではない)。coordinator と
          # 同じ機体。kubelet は Pod の全部の working set の和が allocatable を越えると、request を最も越えた Pod を丸ごと追い出す(request
          # 1Gi のこの worker が選ばれる — 10-30〜11-01 に 5 回)。ほかの Pod の working set の和は 7 日(10-26〜11-01・Prometheus の 30 秒
          # ごと)で中央 7.0・p99 11.0・最大 12.7 GiB なので、この worker が追い出されずに使えるのは中央 12.8・下の 10% 11.3・下の 1% 8.8・
          # 最小 7.1 GiB。
          # memory の取り分は cgroup の層の memory.min の和(worker 256M + services 256M — cgroup.yaml)。上限(下の 22Gi)は層の和(worker 256M +
          # services 256M + jobs 10752M + clis 2G + commands 2G = 14.75 GiB)と準備・task の山が入る大きさで、使える量より大きい。追い出しの手前で
          # 使いを止める線は上限でなく、worker が追い出しまでの空きから 5 秒ごとに掛け直す jobs の層の memory.max(cgroup.yaml の註)。
          # 上限は、最初の起動で doeff-vm の wheel を組む山と、上に載る系の日次の全体検証の task(:needs host-atlas・1 本の山は 12〜16Gi)を、
          # ほかの Pod の使いが小さい時に通す(2026-10-10 調整役 cisco-c8 の値 — 8Gi から 18Gi)。会話の CLI と命令の限る層(clis 2G・
          # commands 2G — cgroup.yaml)の分を足して 22Gi(予算は変えない)。
          resources: { requests: { cpu: "500m", memory: 512Mi }, limits: { cpu: "8", memory: 22Gi } }
          env:
            # job の子へ渡す名に Rust の toolchain の置き場(image の env)を足す — task が Rust の部品を組む時に rustup が toolchain を選ぶ。
            # 雛形の値の後ろに足すだけ(道具の cache の置き場は task が WORK_DIR から自分で作る)。
            - name: WORKER_PASS_ENV
              value: "NODE_NAME,WORKER_NAME,WORKER_HOST_SYSTEMD_ROOT,WORK_DIR,KUBERNETES_SERVICE_HOST,KUBERNETES_SERVICE_PORT,$(WORKER_PASS_ENV_EXTRA),RUSTUP_HOME"
            # job の cwd の根を根でない SSD(nvme1)へ出す(boot.sh の jobs_root_link)。atlas の worker の根の SSD(nvme0n1)への書きの大半は上に
            # 載る系の日次の全体検証の task の作業 dir で、次の版の準備や cache と違い走行の終わりに消える。
            - name: WORKER_JOBS_ROOT
              value: /work/job-scratch
          volumeMounts:
            # 作業の root は HostToContainer: nemo の作業場の daemon(DaemonSet nemo-workspace-atlas — 上に載る系の
            # deploy/nemo/workspace.yaml)が host の /var/lib/agent-worker/toolset/worktrees の下に付けた mount が、この container の同じ path に
            # 見える。この container から外へは広げない(特権が要らない)。
            - { name: work, mountPath: /work, mountPropagation: HostToContainer }
            # daemon の root(頼みの socket・層・view・Pod の使う binary)。atlas の根の disk は分け前が満ちているので、nvme1 の pool の dataset に
            # 在る。daemon と同じ path に見せる(作業場の .git の link と alternates がこの path を指す)。
            - { name: nemo-workspace, mountPath: /work/nemo-workspace, mountPropagation: HostToContainer }
            - { name: job-scratch, mountPath: /work/job-scratch }
      volumes:
        # nvme1 の pool hot_ssd_nvme の dataset hot_ssd_nvme/agent-worker-jobs(quota 100G・sync standard — 2026-11-05 16:45 JST に置き、
        # uid 1000 の持ち物にした)。2026-11-05 04:04〜の Garage の bay の HDD(g5 = sdh)の下では、小さな file の多い処理(npm の install・venv・
        # 型検査・build)が Garage と同じ disk を待ち、日次の全体検証の秒が 2〜3 倍(shellcheck の取り寄せ 29 倍・venv 70 倍)に伸びた。
        # type は Directory: pool が import されていない時は dir が無いので、黙って根の SSD へ書かず、新しい Pod が起動で止まる。atlas の
        # strategy は Recreate で旧い Pod は先に消えるので、その間は worker が止まる。
        - name: job-scratch
          hostPath: { path: /mnt/hot_ssd_nvme/agent-worker-jobs, type: Directory }
        # DirectoryOrCreate: pool が import されていない時も worker を起動で止めない(作業場だけが使えない — daemon の番人が止まる)。
        - name: nemo-workspace
          hostPath: { path: /mnt/hot_ssd_nvme/nemo-workspace, type: DirectoryOrCreate }
