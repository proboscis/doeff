# 導いた物 — ../../disk-share/derive.py が ../../disk-share/shares.yaml の atlas の分け前から書く(手で直さない)。
# 置き先 = 機体の /etc/rancher/k3s/kubelet.conf.d/60-disk-share-image-gc.conf(k3s の config.yaml の kubelet-arg に
# config-dir=/etc/rancher/k3s/kubelet.conf.d を置き、image-gc-high-threshold・image-gc-low-threshold の flag は置かない — flag は
# drop-in より強い)。効く時 = k3s を起動し直して kubelet が読んだ後。効いているかは derive.py --live が kubelet の configz と比べる。
# high 77% = 空き 48.36 GB で消し始める — worker が near を名乗る線
#   46.84 GB(空きの最低 25 GiB + near の幅)より上
# low 67% = 空き 69.38 GB まで消す — worker が ok へ戻る線 48.84 GB より上
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
imageGCHighThresholdPercent: 77
imageGCLowThresholdPercent: 67
