# atlas の worker の doeff の版(env WORKER_DOEFF_COMMIT — worker 自身の code の版・image は同じ)。定義元はこの 1 行だけ(雛形には置かない)。
# 変えると、この機体の worker だけが入れ替わる。行は雛形の env の WORK_DIR の直後へ足す — 場所が変わると Pod の template が変わり、版を
# 変えなくても Pod が作り直される。番号は ../../host-only が env の頭に 2 行を、node.yaml が 1 行(WORKER_PASS_ENV)を足した後の並び。
# 雛形の env の並びが変わったら、test の操作が組み立てを止める(黙って別の場所へ足さない)。
# 次に版を上げる時は、平常の大きさで動く常駐の job を機体の memory の見張りが止めない直し(card ki-649b1b2f5838 — memory_rules の
# victim-of と平常の大きさ)を含む版にする。29bba00f はこの直しも memory-kill-limit(523ffad35)も持たない。memory-kill-limit だけを
# 持ち、この直しを持たない版へ上げると、機体の空きを worker の外の Pod が食った時に、平常の大きさの常駐の job が 5 回止められて起こし
# 直しが止まる(10-24 は 2 時間に 11 回止められた)。この直しのためだけに Pod を作り直さない — 次の版上げに載せる。
- { op: test, path: /spec/template/spec/containers/0/env/4/name, value: WORK_DIR }
- { op: add, path: /spec/template/spec/containers/0/env/5, value: { name: WORKER_DOEFF_COMMIT, value: "29bba00f8c9a3850d0c4acec7f4c376410044d87" } }
