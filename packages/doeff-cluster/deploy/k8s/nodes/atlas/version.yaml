# atlas の worker の doeff の版(env WORKER_DOEFF_COMMIT — worker 自身の code の版・image は同じ)。定義元はこの 1 行だけ(雛形には置かない)。
# 変えると、この機体の worker だけが入れ替わる。行は雛形の env の WORK_DIR の直後へ足す — 場所が変わると Pod の template が変わり、版を
# 変えなくても Pod が作り直される。番号は node.yaml が env の頭に 1 行(WORKER_PASS_ENV)を足した後の並び。
# 雛形の env の並びが変わったら、test の操作が組み立てを止める(黙って別の場所へ足さない)。
# 871d9157c(枠を枠の file から読み直す移行の 1 回・card ki-6828eda880ce)は、平常の大きさで動く常駐の job を機体の memory の見張りが
# 止めない直し(card ki-649b1b2f5838・c18959da7)と memory-kill-limit(523ffad35)の両方を含む。
- { op: test, path: /spec/template/spec/containers/0/env/2/name, value: WORK_DIR }
- { op: add, path: /spec/template/spec/containers/0/env/3, value: { name: WORKER_DOEFF_COMMIT, value: "871d9157c8fd1c8bc78b321253cc62a7b564b19c" } }
