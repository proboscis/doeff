# atlas の worker(doeff-worker-atlas)= worker の雛形 + 上に載る系の仕事を余りの空きで受ける差(../../guest-work)+ 上に載る系の準備が落ちても
# 起動する差(../../guest-prepare-optional)+ cgroup の層の共通の部分
# (../../cgroup-layers)+ atlas の差(置く Node・資源の上限・入れ替えの形・cgroup の層の値)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../worker
components:
  - ../../guest-work
  - ../../guest-prepare-optional
  - ../../cgroup-layers
nameSuffix: -atlas
# 機体ごとの Deployment が互いの Pod を選ばないよう、selector と Pod の label に Node の名を足す。
labels:
  - pairs: { doeff.dev/node: atlas }
    includeSelectors: true
patches:
  # token の期限(JSON patch — 旧い Pod が猶予の間 Terminating のまま走っても token が切れない長さ)。node.yaml の組み込みは雛形の volume の
  # 後ろに atlas の volume を足すので、雛形の位置を確かめる操作を先に当てる。
  - path: token-lifetime.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  # drain の上限(JSON patch — 雛形の env の決まった場所を確かめて改める)。node.yaml の組み込みは atlas の env を足して雛形の env の
  # 位置をずらすので、先に当てる。
  - path: generation.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  - path: node.yaml
  # disk の分け前から導いた worker の env(空きの最低・roots の上限 — ../../disk-share/derive.py が書く)。
  - path: disk-share.yaml
  # cgroup の memory と CPU の層の値(JSON patch — 足す物は全部末尾へ)。
  - path: cgroup.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
