# helios の worker(doeff-worker-helios)= worker の雛形 + 機体の仕事だけを受ける差(../../host-only)+ helios の差(置く Node・資源の上限・
# cgroup の層)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../worker
components:
  - ../../host-only
nameSuffix: -helios
# 機体ごとの Deployment が互いの Pod を選ばないよう、selector と Pod の label に Node の名を足す。
labels:
  - pairs: { doeff.dev/node: helios }
    includeSelectors: true
patches:
  - path: node.yaml
  # cgroup の memory と CPU の層と、その委ねる係・host の cgroupfs の mount(JSON patch — 足す物は全部末尾へ)。
  - path: cgroup.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
