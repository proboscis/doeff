# helios の worker(doeff-worker-helios)= worker の雛形 + 上に載る系の仕事を余りの空きで受ける差(../../guest-work)+ 上に載る系の準備が落ちても
# 起動する差(../../guest-prepare-optional)+ cgroup の層の共通の部分
# (../../cgroup-layers)+ helios の差(置く Node・資源の上限・入れ替えの形・cgroup の層の値)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../worker
components:
  - ../../guest-work
  - ../../guest-prepare-optional
  - ../../cgroup-layers
nameSuffix: -helios
# 機体ごとの Deployment が互いの Pod を選ばないよう、selector と Pod の label に Node の名を足す。
labels:
  - pairs: { doeff.dev/node: helios }
    includeSelectors: true
patches:
  # token の期限(JSON patch — 旧い Pod が猶予の間 Terminating のまま走っても token が切れない長さ)。雛形の volume の位置を確かめるので
  # 先に当てる。
  - path: token-lifetime.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  - path: node.yaml
  # drain の上限(JSON patch — 雛形の env の決まった場所を確かめて改める)。
  - path: generation.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  # cgroup の memory と CPU の層の値(JSON patch — 足す物は全部末尾へ)。
  - path: cgroup.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
