# k3s-2 の worker(doeff-worker-k3s-2)= worker の雛形 + 機体の仕事だけを受ける差(../../host-only)+ k3s-2 の差(置く Node・資源の上限)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../worker
components:
  - ../../host-only
nameSuffix: -k3s-2
# 機体ごとの Deployment が互いの Pod を選ばないよう、selector と Pod の label に Node の名を足す。
labels:
  - pairs: { doeff.dev/node: k3s-2 }
    includeSelectors: true
patches:
  - path: node.yaml
  # 版の行(JSON patch — 雛形の env の決まった場所へ足す)。
  - path: version.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
