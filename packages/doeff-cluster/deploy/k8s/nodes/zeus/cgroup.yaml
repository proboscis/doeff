# zeus の worker の cgroup の memory の層(JSON patch)。
#
# 訳: worker の本体・常駐の job・task と、job の子が起こす命令が 1 つの cgroup(container の cgroup・memory.max 100Gi だけ)を分け合い、
# 1 本の task(10-24 06:03 JST の 48 GB)や命令(05:36 JST の 28 GiB)の memory が上限の手前で回収を詰まらせて、本体も常駐の job も
# 16.7 分止まった。container の cgroup の中に層を作り、守る層(memory.min)と限る層(memory.max)を分ける — 1 本が際限なく増えても、
# kernel は限る層の中だけで回収して OOM で止め、守る層は回収されない。
#
# 層(WORKER_CGROUP_LAYOUT — boot.sh の「cgroup の層」): worker = 起動の script・worker の本体・exec = init の tini だけ(と kubectl exec・
# readinessProbe・preStop — runc は init の cgroup へ入れる・WORKER_CGROUP_INIT_LAYER・boot.sh の「init の層」)・services =常駐の job の shim と子(DOEFF_WORKER_SERVICE_CGROUP)・jobs = task・待ちの子・
# 実行環境と木の準備・入口の検め(DOEFF_WORKER_JOB_CGROUP)・commands = job の子が自分の子を置く層(上に載る系の命令 — 書ける dir は
# worker が DOEFF_WORKER_CGROUP_DIR で job の子へ渡す)。守る層の memory.min の和と限る層の memory.max の和は container の上限 100Gi の内
# (限る層が上限まで使っても、container の上限の回収は守る層の min の分に掛からない)。限る層に memory.high は掛けない — 10-24 の試しで、
# high を max の際に掛けた子は止まるまで約 10 分這い、同じ層の他の子も遅くした(max だけでは 1.0 秒で止まった)。
# 値の出どころ(10-24 07:2x JST の zeus): container の memory.current 60.0GiB(anon 39.0)・RSS の和 常駐の job 24.2GiB・その子の CLI と hook
# 22.7GiB・task と待ちの子 12.0GiB・命令 1.9GiB・memory.peak 96.6GB。
#
# 書ける見え: Pod の /sys/fs/cgroup は container の cgroup を根とする読み取りだけの見え(containerd 2.0 は特権の無い container の cgroupfs
# を ro で置く)。host の cgroupfs を /host/cgroup に置き(WORKER_CGROUP_HOST)、boot.sh が名前空間の根と同じ inode の dir を引く。
# worker の container は特権を持たない(privileged の container は host の cgroup の名前空間で起き、/sys/fs/cgroup に host の木の全体が
# 見えて、container の cgroup を読む memory の見張りが壊れる — 10-24 の試し)。
#
# 委ねる係(cgroup-delegate — native sidecar): root・privileged の container は host の cgroup の名前空間で起き、/sys/fs/cgroup に host の
# 木が書ける形で見える。自分の cgroup の親(この Pod の slice)の下の container の cgroup のうち、memory の上限を持つ物(pause は持たない)
# の dir と cgroup.procs・cgroup.subtree_control・cgroup.threads を worker の uid へ渡す(cgroup v2 の委ね)。worker の container が
# 起こし直されると新しい cgroup ができるので、走り続けて渡し直す。
# ポーリングの訳: containerd が container の cgroup を作った事を、同じ Pod の別の container へ知らせる道が無い(cgroupfs の dir の
# 作成は inotify に出ない)。2 秒ごとに持ち主を見るだけで、渡し済みなら何もしない。
#
# CPU の重み: 子に cpu を掛け、遅れに敏感な層(worker・services)の cpu.weight を一括の仕事の層(clis・jobs・
# commands)の 10 倍に置く。訳: 子に cpu を掛けないと、zeus の CPU が埋まった時(Pod 26〜29 core・走れる thread 103 本 / 36 core)に
# 起きた常駐の service の thread が一括の仕事の thread と同じ重みで実行待ちに並び、画面の ws の ping の往復が最大 53〜140 ms に跳ねた。
# 層 clis = 常駐の job が起こす会話の CLI とその子(上に載る系が DOEFF_WORKER_CGROUP_DIR の下の clis へ自分を移す)。services に居た
# CLI を外へ出し、services の memory.min 24G を、測った PSS(10-29 23:1x JST — 常駐の job 14.5GiB・CLI とその子 14.9GiB)で
# services 13G と clis 11G に分けた(守る層の和は変えない)。値の出どころ(10-29 23:2x JST の zeus で手で掛けた試し — 同じ Pod から
# 画面の socket へ 20 ms おきの ws の ping、Pod 25 core 超の秒): 重み無し p99 9.4 ms・最大 53 ms → services と worker 1000 で
# p99 5.0 ms・最大 34 ms。cpu.idle は使わない(命令の層を何にでも譲らせると、会話の手番の命令が CPU の埋まった間ずっと止まる —
# CLI を SCHED_IDLE にした時に手番が 25〜32% 伸びたのと同じ形)。
# 層 deploy = 上に載る系の配備の宣言の CLI(1 回の起動が 1 本の process — 上に載る系の起動の入口が DOEFF_WORKER_CGROUP_DIR の下の
# deploy へ自分を移してから CLI を exec する)。一括の仕事ではなく遅れに敏感な 1 本なので、cpu.weight を常駐の層と同じ 1000 に置く(常駐の
# 層より上には置かない)。訳: commands(100)に居ると、load 100 以上の時に module の import の wall が CPU の秒の 2〜3 倍(19〜24 秒)に
# 伸びた。値の出どころ(11-02 11:45 JST の zeus で手で作った一時の cgroup の試し): 重み 1000 で wall が CPU の 1.03〜1.13 倍・重み 100 で
# 1.25〜1.52 倍。memory.max 4G = 測った RSS の峰(11-02 15:4x JST の zeus — 本番の回の宣言の process の VmHWM 0.6GB)に子の命令と
# 2 本の重なりの余りを足した値。限る層なので、和は container の上限の内。
#
# 常駐の job が別の機体へ移った後の値(11-03): 上に載る系のコアの常駐の job が helios の worker へ移り、zeus の常駐の job は 10 本(上に載る系
# の 4 本と別の系の 6 本)になった。services の memory.min を 13G → 4G に下げ、空いた 9G を会話の CLI の層 clis の memory.min(11G → 20G)
# へ回す(守る層の和 26G は変えない — node.yaml の取り分と同じ)。命令の層 commands の memory.max は、前から誰にも割り当てていなかった 6G
# のうち 4G で 28G → 32G に上げ、2G は誰にも割り当てない余りに残す(守る層 26G + 限る層 72G = 98G)。値の出どころ(11-03 13:2x JST の zeus):
# - services: 層の RSS の和 2.4GiB・anon 2.1GiB(memory.current 11.5GiB の残りは回収できる file と slab)。残る 10 本の宣言の settle の和
#   は CLI を起こす job の本体を除いて 2.5GiB、その本体の RSS 0.9GiB — 和 3.4GiB に shim の分を足して 4G。
# - clis: 層の RSS の和 14.5GiB・Pod の起動からの峰 27.1GiB。11G は今の使いより小さく、jobs と commands が上限まで使うと会話の CLI の
#   memory が回収に掛かる。20G は今の使いを全部守り、峰との差だけが回収に掛かる。
# - commands: Pod の起動からの 8.3 時間で memory.max に 4756 回当たり(OOM は 0 — 回収で止まる)、峰が上限の 28G に届いた。
# CPU は層ごとの取り置きを持たない(cpu.weight だけ — CPU が埋まった時の分け方)ので、宣言は変えない。services の層が使わなくなった CPU は
# そのまま他の層へ回る(11-03 の 60 秒の測り: services 1.7 core・clis 4.2・jobs 9.8・commands 0.5)。
#
# 層 exec(init の層・11-05): 11-04 12:59 UTC に kubectl exec の grep 2 本が init と同じ上限の無い worker の層で anon 69 GB を持ち、機体の
# 全体の OOM になった(見張りは木の外の process を止められず、jobs の層の上限を下げて無関係の 12 本を OOM kill した)。init の tini だけを
# exec の層へ置き、exec の命令は kernel がこの層の中だけで止める。memory.max 1G = 要る量(readinessProbe 15 MiB + preStop の drain 2 本 ×
# 54 MiB + 運用の読み 15 MiB = 138 MiB — 11-04 18:2x UTC にこの Pod で測った子の RSS の最大・値の決め方は ../../cgroup-layers の頭の註)に、
# 運用の hy の 1 本(worker の本体の VmHWM 463 MiB)と重なりの余りを足した値。誰にも割り当てていなかった 2G のうち 1G を使い、和は
# 守る層 26G + 限る層 73G = 99G。cpu.weight は前に居た worker の層と同じ 1000(配備の層と同じ扱い)。
# cargo の中間物を memory に置いた後の値(11-04): 命令の層 commands の memory.max を 32G → 48G に上げ、container の上限を 100Gi → 116Gi に上げる(守る層 26G +
# 限る層 89G = 115G — 誰にも割り当てない余り 1G は変えない)。足した 16G は tmpfs の上限と同じ(cargo-build-in-memory.yaml の頭の註)。
#
# 雛形の env の並び(WORK_DIR が 1 番・DRAIN_DEADLINE が 9 番)を動かさないよう、足す物は全部末尾へ足す。
- op: add
  path: /spec/template/spec/initContainers/-
  value:
    name: cgroup-delegate
    image: zeus:5000/agent-worker-exp:in-c17f84e4dcaa
    restartPolicy: Always
    securityContext: { privileged: true, runAsUser: 0, runAsNonRoot: false }
    resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
    command: ["/bin/sh", "-c"]
    args:
      - |
        own=$(sed -n 's/^0:://p' /proc/self/cgroup)
        case "$own" in
          /kubepods*/*.scope) ;;
          *) echo "cgroup-delegate: 自分の cgroup '$own' が Pod の slice の下の container の cgroup でない(host の cgroup の名前空間で起きていない)" >&2
             exit 1 ;;
        esac
        slice=/sys/fs/cgroup${own%/*}
        echo "cgroup-delegate: $slice の container の cgroup を uid 1000 へ委ねる" >&2
        while :; do
          for d in "$slice"/*.scope; do
            [ -d "$d" ] && [ "$d" != "/sys/fs/cgroup$own" ] || continue
            [ "$(cat "$d/memory.max" 2>/dev/null)" != max ] || continue
            [ "$(stat -c %u "$d")" != 1000 ] || continue
            chown 1000:1000 "$d" "$d/cgroup.procs" "$d/cgroup.subtree_control" "$d/cgroup.threads" &&
              echo "cgroup-delegate: $d を uid 1000 へ委ねた" >&2
          done
          sleep 2
        done
- { op: add, path: /spec/template/spec/volumes/-, value: { name: host-cgroup, hostPath: { path: /sys/fs/cgroup, type: Directory } } }
- { op: add, path: /spec/template/spec/containers/0/volumeMounts/-, value: { name: host-cgroup, mountPath: /host/cgroup } }
- { op: add, path: /spec/template/spec/containers/0/env/-, value: { name: WORKER_CGROUP_HOST, value: /host/cgroup } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value: { name: WORKER_CGROUP_LAYOUT, value: "worker:memory.min=2G,cpu.weight=1000 services:memory.min=4G,cpu.weight=1000 clis:memory.min=20G,cpu.weight=100 jobs:memory.max=36G,cpu.weight=100 commands:memory.max=48G,cpu.weight=100 deploy:memory.max=4G,cpu.weight=1000 exec:memory.max=1G,cpu.weight=1000" }
- { op: add, path: /spec/template/spec/containers/0/env/-, value: { name: DOEFF_WORKER_SERVICE_CGROUP, value: services } }
- { op: add, path: /spec/template/spec/containers/0/env/-, value: { name: DOEFF_WORKER_JOB_CGROUP, value: jobs } }
- { op: add, path: /spec/template/spec/containers/0/env/-, value: { name: WORKER_CGROUP_INIT_LAYER, value: exec } }
