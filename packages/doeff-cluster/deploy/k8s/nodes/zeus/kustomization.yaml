# zeus の worker(doeff-worker-zeus)= worker の雛形 + zeus の差(置く Node・資源の上限)。
# 機体を足す時は nodes/<Node の名>/ をこの dir と同じ形で作り(nameSuffix・label・node.yaml の Node の名と資源)、
# ../../workers/kustomization.yaml の resources に足す。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../worker
  - moneta-backup-pvc.yaml
nameSuffix: -zeus
# 機体ごとの Deployment が互いの Pod を選ばないよう、selector と Pod の label に Node の名を足す。
labels:
  - pairs: { doeff.dev/node: zeus }
    includeSelectors: true
patches:
  - path: node.yaml
  # drain の上限(JSON patch — 雛形の env の決まった場所を確かめて改める)。
  - path: generation.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  # cgroup の memory の層と、その委ねる係・host の cgroupfs の mount(JSON patch — 足す物は全部末尾へ)。
  - path: cgroup.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  # cargo の build の中間物を memory へ(JSON patch — env と sidecar は末尾へ)。
  - path: cargo-build-in-memory.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  # mount の係へ頼む dir の env(JSON patch — 末尾へ。係の宣言は node.yaml)。
  - path: workspace-mount.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  - path: tmp-in-memory.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  - path: dev-shm-in-memory.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
  # /scratch を kubelet の disk の外の Pod ごとの Longhorn の volume へ(頭の註に訳)。
  - path: scratch-on-longhorn.yaml
    target: { group: apps, version: v1, kind: Deployment, name: doeff-worker }
# 名の固定した ConfigMap(機体の接尾辞つき)— 掃除の係の script。中身の hash を名に付けないので、script を替えても Pod は作り直されない。
configMapGenerator:
  - name: cargo-build-keeper
    namespace: agent-worker
    files:
      - cargo-build-keeper.sh
    options:
      disableNameSuffixHash: true
