# 導いた物 — ../../disk-share/derive.py が ../../disk-share/shares.yaml の k3s-1 の分け前から書く(手で直さない)。
# 置き先 = 機体の /etc/rancher/k3s/kubelet.conf.d/60-disk-share-image-gc.conf(k3s の config.yaml の kubelet-arg に
# config-dir=/etc/rancher/k3s/kubelet.conf.d を置き、image-gc-high-threshold・image-gc-low-threshold の flag は置かない — flag は
# drop-in より強い)。効く時 = k3s を起動し直して kubelet が読んだ後。効いているかは derive.py --live が kubelet の configz と比べる。
# high 70% = 空き 31.65 GB で消し始める — worker が near を名乗る線
#   30.74 GB(空きの最低 10 GiB + near の幅)より上
# low 60% = 空き 42.20 GB まで消す — worker が ok へ戻る線 32.74 GB より上
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
imageGCHighThresholdPercent: 70
imageGCLowThresholdPercent: 60
