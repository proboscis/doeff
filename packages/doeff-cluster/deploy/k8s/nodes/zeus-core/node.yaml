# zeus-core の差: 置く Node・資源の上限と取り分・作業の root。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doeff-worker
  namespace: agent-worker
spec:
  template:
    spec:
      nodeSelector: { kubernetes.io/hostname: zeus }
      initContainers:
        # 作業の root を worker の uid へ渡す前に、内蔵の SATA の SSD が mount されている事を確かめる: mount の点 /mnt/hot_ssd_sata の下に
        # Longhorn の disk の dir(longhorn-zeus — Longhorn の Node zeus の disk の path)が在る時だけ渡す。mount されていない起動では
        # mount の点が root の disk の空の dir のまま進み、作業の root(DirectoryOrCreate)が root の disk に黙って作られるので、ここで止める。
        - name: own-work
          command: ["sh", "-c", "test -d /sata/longhorn-zeus || { echo 'own-work: /mnt/hot_ssd_sata/longhorn-zeus が無い — 内蔵の SATA の SSD が mount されていない' >&2; exit 1; }; chown 1000:1000 /work"]
          volumeMounts:
            - { mountPath: /sata, name: sata, readOnly: true }
      containers:
        - name: worker
          # 上に載る系の小さい常駐の job だけを受ける。取り分は小さく、上限は上に載る系の job の組み立ての山と
          # 最初の起動で doeff-vm の wheel を組む山を通す大きさ。CPU の重みは worker zeus(4)より小さくしない — 会話の山の中でも答える。
          resources: { requests: { cpu: "2", memory: 2Gi }, limits: { memory: 24Gi } }
      volumes:
        # 作業の root(volume work — WORK_DIR=/work)は内蔵の SATA の SSD の下。USB の SSD(/mnt/fast_ssd_usb)の下に置かない — USB の SSD が
        # bus から落ちても、ここに載る job の実行環境の root・venv・状態・log は残る(card ki-8335f47a1089)。
        - name: work
          hostPath: { path: /mnt/hot_ssd_sata/agent-worker-core, type: DirectoryOrCreate }
        - name: sata
          hostPath: { path: /mnt/hot_ssd_sata, type: Directory }
