# zeus-core の名と能力(JSON patch)。雛形は worker の名を Node の名(fieldRef spec.nodeName)にするが、同じ機体に worker zeus が在るので、
# 名を値 zeus-core に置き換える(同じ名だと coordinator の名簿の 1 行を 2 つが取り合う)。能力は host-only の component が置いた
# host-$(NODE_NAME)(= host-zeus)を host-zeus-core に置き換える — host-zeus を名乗ると worker zeus の job がここへ置かれ得る。
# 雛形の env の並びが変わったら、test の操作が組み立てを止める(黙って別の行を書き換えない)。
- { op: test, path: /spec/template/spec/containers/0/env/4/name, value: WORKER_NAME }
- { op: replace, path: /spec/template/spec/containers/0/env/4, value: { name: WORKER_NAME, value: zeus-core } }
- { op: test, path: /spec/template/spec/containers/0/env/5/name, value: WORKER_PROVIDES }
- { op: replace, path: /spec/template/spec/containers/0/env/5/value, value: "host-zeus-core,host-systemd-readable" }
