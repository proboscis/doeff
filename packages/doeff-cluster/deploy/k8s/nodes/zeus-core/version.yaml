# zeus-core の worker の doeff の版(env WORKER_DOEFF_COMMIT)。定義元はこの 1 行だけ。行は雛形の env の WORK_DIR の直後へ足す。
# 雛形の env の並びが変わったら、test の操作が組み立てを止める(黙って別の場所へ足さない)。
- { op: test, path: /spec/template/spec/containers/0/env/1/name, value: WORK_DIR }
- { op: add, path: /spec/template/spec/containers/0/env/2, value: { name: WORKER_DOEFF_COMMIT, value: "871d9157c8fd1c8bc78b321253cc62a7b564b19c" } }
