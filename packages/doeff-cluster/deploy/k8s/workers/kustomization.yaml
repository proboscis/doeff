# worker の組 — 全部の機体の worker が使う ServiceAccount(worker-account.yaml)とその権限(worker-cluster-admin.yaml)と、機体ごとの
# worker(../nodes/<Node の名>/)。Flux はこの dir を 1 つの Kustomization で当てる。機体を足す時は ../nodes/<Node の名>/ を作り、ここの
# resources に足す。会社でない機体の全部に 1 つずつ置く(会社の機体には置かない)。zeus の worker は上に載る系の仕事も受け、ほかの機体の
# worker は機体の仕事だけを受ける(../host-only)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - worker-account.yaml
  - worker-cluster-admin.yaml
  - ../nodes/atlas
  - ../nodes/eos
  - ../nodes/k3s-0
  - ../nodes/k3s-1
  - ../nodes/k3s-2
  - ../nodes/k3s-3
  - ../nodes/zeus
  # zeus の 2 つ目の worker — 作業の root を内蔵の SATA の SSD に置き、USB の SSD を失っても止めない上に載る系の job を受ける(card ki-8335f47a1089)。
  - ../nodes/zeus-core
  # 根の disk を worker と Longhorn が分け合う機体の Longhorn の disk の予約(worker の env と同じ宣言 ../disk-share/shares.yaml から導く)。
  - ../disk-share
# 機体ごとの worker の枠(card ki-6828eda880ce): 同時の job と task の上限 capacity と、そのうち task のために空けておく数 taskReserve を、
# 機体の名(= worker の名)ごとに worker-room.json に置く — 枠の定義元はこの 1 file。名の固定した ConfigMap worker-room にし(中身の hash を
# 名に付けない)、worker は volume で置いた file(subPath でない)を heartbeat の前に読み直して名乗る。中身を変えても Pod は作り直されず、
# kubelet が file を入れ替えた後(1 分前後)の heartbeat から coordinator の Worker の行が新しい値になる。枠を下げて今の数を下回っても、
# 置いた job と task は退かず、新しく置かないだけ。file を読めない・形が崩れた時は、worker は前に名乗った値のまま(heartbeat の roomFile
# で名乗り、coordinator は GET /resources/Worker の status に出す)。
configMapGenerator:
  - name: worker-room
    namespace: agent-worker
    files:
      - worker-room.json
    options:
      disableNameSuffixHash: true
  # 機体ごとの worker の doeff の版(card ki-6e83e03d146d): 機体の名 = worker の名ごとに 1 行の worker-version.env — 版の定義元はこの 1 file。
  # 名の固定した ConfigMap worker-version にし(中身の hash を名に付けない)、data の鍵 = 機体の名・値 = commit。雛形は volume で置いた
  # file(subPath でない)/etc/worker-version/<worker の名> を WORKER_VERSION_FILE で渡し、keeper が file の替わりで同じ container の
  # 中の worker の process を入れ替える。中身を変えても Pod は作り直されない(版は Pod の template に無い)。
  - name: worker-version
    namespace: agent-worker
    envs:
      - worker-version.env
    options:
      disableNameSuffixHash: true
