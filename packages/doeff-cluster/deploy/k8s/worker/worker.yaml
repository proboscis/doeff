# doeff-cluster の worker の雛形 — k8s の機体(Node)ごとに 1 つ。機体ごとの差(置く Node・資源の上限)は ../nodes/<Node の名>/ が足す
# (名は doeff-worker-<Node の名>)。
#
# 静的に保つ(doeff worker を頻繁に作り直さない — 利用者の決定 2026-10-09):
# Pod を作り直すのは、この dir の宣言か機体の dir の宣言(資源の上限など)が変わった時だけ。doeff の版は Pod の template に置かない —
# 名の固定した ConfigMap worker-version の file から読み、版を替えると同じ container の中で worker の process が入れ替わる(下の
# worker-version・card ki-6e83e03d146d)。上に載る系の値は名の固定した ConfigMap から受ける。ConfigMap の名に中身の hash を付けないので、
# 中身を変えても Pod は作り直されず、次の起動で効く。
#
# 上に載る系の repo が用意する物(名は固定 — この宣言は名で参照するだけで、上に載る系の名と値は書かない):
#   ConfigMap worker-env      envFrom で受ける env。WORKER_REPOS・CODE_REPO_URL など boot.sh と job の子が読む値。枠(WORKER_CAPACITY・
#                             WORKER_TASK_RESERVE)は置かない — 枠は下の worker-room。加えて次の 2 つを必ず置く(空の値でよい):
#                               WORKER_PROVIDES_EXTRA  能力の残り(`,` で並べる)— 下の WORKER_PROVIDES の後ろに付く
#                               WORKER_PASS_ENV_EXTRA  job の子へ渡す残りの env の名(`,` で並べる)— 下の WORKER_PASS_ENV の後ろに付く
#                             無いと $(名) が展開されずに残り、worker は能力の名か env の名の誤りを stderr に出して起動しない。
#                             下の env と同じ名を置いても効かない(k8s は env を envFrom より優先する)。
#                             WORKER_REPOS は /etc/worker-env の file でも受け(env WORKER_REPOS_FILE)、worker が準備の前ごとに読み直す
#                             — この値だけは中身を変えると Pod を作り直さずに次の準備から効く。
#   ConfigMap worker-prepare  起動の前に 1 度実行する script(キー prepare.sh・非 0 なら起動しない)。ConfigMap が無ければ実行しない。
#   ConfigMap worker-shell    job の子が使う shell の script(/opt/worker-shell に置く)。無くても起動する。
#
# この dir の組(../workers)が用意する物:
#   ConfigMap worker-room     機体ごとの枠(../workers/worker-room.json — 名 → capacity・taskReserve・card ki-6828eda880ce)。/etc/worker-room に
#                             置き(subPath でない — 中身を変えると kubelet が Pod を作り直さずに file を入れ替える)、WORKER_ROOM_FILE で
#                             渡す。worker は heartbeat の前に読み直して名乗るので、枠の変更で Pod を作り直さない。ConfigMap が無ければ
#                             Pod は起きない(optional でない — 既定の枠で起きない)。
#   ConfigMap worker-version  機体ごとの worker の doeff の版(../workers/worker-version.env — 鍵 = 機体の名・値 = commit・card
#                             ki-6e83e03d146d)。/etc/worker-version に置き(subPath でない)、WORKER_VERSION_FILE = その下の自分の名の
#                             file を渡す。起動の args と preStop は file の版を WORKER_DOEFF_COMMIT に入れて image の起動の script へ
#                             渡し(image の script は file を読まない)、その版の script は keeper として回る — file の版が替わると、
#                             同じ container の中で新しい版の worker の process を起こし、名乗れた後に前の版の process を drain してから
#                             止める(deploy/boot.sh の頭の註の「版の file と keeper」)。ConfigMap が無ければ Pod は起きない。
#   Secret worker-repos      WORKER_REPOS の deploy key と known_hosts(boot.sh が /etc/worker-repos から読む)。無くても起動する
#                             (WORKER_REPOS が要る key を欠けば boot.sh が理由を出して止まる)。
#   Namespace agent-worker    ここでは宣言しない(この宣言から外れた時に prune が Namespace ごと Secret を消すため)。
#
# 機体の事実: worker の名と NODE_NAME は Node の名(fieldRef spec.nodeName)。機体の /etc/systemd/system を読み取り専用で
# /host/etc/systemd/system に置き、その path を WORKER_HOST_SYSTEMD_ROOT で渡す。作業の root は WORK_DIR。この 3 つは job の子へも
# 渡る(WORKER_PASS_ENV)。
# ServiceAccount の token・cluster の CA・namespace は標準の path(/var/run/secrets/kubernetes.io/serviceaccount)に置き、
# API server の場所の env(KUBERNETES_SERVICE_HOST・KUBERNETES_SERVICE_PORT — kubelet が必ず置く)も job の子へ渡す。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doeff-worker
  namespace: agent-worker
  labels: { app: doeff-worker }
spec:
  replicas: 1
  # 同じ worker の名で 2 つが同時に申告しないよう、旧を止めてから新を起こす。
  strategy: { type: Recreate }
  selector: { matchLabels: { app: doeff-worker } }
  template:
    metadata:
      labels: { app: doeff-worker }
    spec:
      serviceAccountName: doeff-worker
      # token は下の投影の volume で worker の container にだけ置く(init container には置かない)。
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop の drain(上限 DRAIN_DEADLINE 秒)+ 子 process を止める猶予(stop-grace 10 秒 + KILL)。
      terminationGracePeriodSeconds: 120
      # 置く Node は機体の dir の nodeSelector で指定する。その Node の taint はどれも受ける。
      tolerations:
        - { operator: Exists }
      securityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, fsGroup: 1000 }
      initContainers:
        # hostPath は root の持ち物で作られるので、worker の uid へ渡す。
        - name: own-work
          image: zeus:5000/agent-worker-exp:in-c17f84e4dcaa
          command: ["chown", "1000:1000", "/work"]
          securityContext: { runAsUser: 0, runAsNonRoot: false }
          volumeMounts:
            - { mountPath: /work, name: work }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
      containers:
        - name: worker
          image: zeus:5000/agent-worker-exp:in-c17f84e4dcaa
          # pid 1 は image の ENTRYPOINT の tini。command は ENTRYPOINT を上書きするので args で渡す。準備の script が在れば実行し
          # (非 0 なら起動しない)、PATH の先頭に ~/.local/bin を置き、版の file(WORKER_VERSION_FILE — 頭の註の worker-version)の版を
          # WORKER_DOEFF_COMMIT に入れて起動の script(/opt/worker-boot.sh・ROLE=worker)へ — その版の script が keeper として回る。
          # file を読めなければ起動しない。`$$(` は k8s の $(名) の展開を避ける綴り(shell には `$(` で届く)。job の子は worker の PATH を継ぐ。
          args:
            - /bin/sh
            - -c
            - >-
              if [ -f /opt/worker-prepare/prepare.sh ]; then sh /opt/worker-prepare/prepare.sh; fi
              && export PATH="$HOME/.local/bin:$PATH" && WORKER_DOEFF_COMMIT="$$(cat "$WORKER_VERSION_FILE")"
              && export WORKER_DOEFF_COMMIT && exec /opt/worker-boot.sh
          envFrom:
            - configMapRef: { name: worker-env }
          env:
            - { name: ROLE, value: worker }
            - { name: WORK_DIR, value: /work }
            # worker 自身の code の版(doeff の commit — WORKER_DOEFF_COMMIT)は env に置かない(Pod の template に版を持たない)。版は
            # ConfigMap worker-version の file(下の WORKER_VERSION_FILE)から起動の args が読む — 機体ごとに 1 行・Pod を作り直さずに替わる。
            - { name: COORDINATOR_URL, value: "http://coordinator.agent-worker.svc.cluster.local:8080" }
            # 置かれた Node の名(coordinator が Node の label から能力を導く)。下の $(NODE_NAME) より前に置く — k8s は前の行で
            # 定義した env だけを展開する。
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # worker の名 = Node の名(機体ごとに 1 つなので、名は機体で決まる)。
            - name: WORKER_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # 提供する能力: 機体の名の能力と、機体の systemd の unit を読めること。残りは worker-env の WORKER_PROVIDES_EXTRA。
            - { name: WORKER_PROVIDES, value: "host-$(NODE_NAME),host-systemd-readable,$(WORKER_PROVIDES_EXTRA)" }
            # job の子へ渡す worker の env の名(実行環境の job の子は worker の env を許可表でしか継がない)。機体の事実・worker の名(子が自分の
            # 載る worker を名で知る — Node の名は同じ機体の別の worker と同じ値で、worker を分けられない)・API server の
            # 場所はここで渡し、残りは worker-env の WORKER_PASS_ENV_EXTRA。
            - name: WORKER_PASS_ENV
              value: "NODE_NAME,WORKER_NAME,WORKER_HOST_SYSTEMD_ROOT,WORK_DIR,KUBERNETES_SERVICE_HOST,KUBERNETES_SERVICE_PORT,$(WORKER_PASS_ENV_EXTRA)"
            - { name: WORKER_HOST_SYSTEMD_ROOT, value: /host/etc/systemd/system }
            # 機体の dir(/work)を使う worker を 1 つに限る(Deployment の名が変わる入れ替えで、旧と新の Pod が同じ dir に重ならない)。
            - { name: WORKER_DIR_LOCK, value: "1" }
            - { name: DRAIN_DEADLINE, value: "90" }
            # 枠の file(ConfigMap worker-room — 頭の註)。末尾に足す — 機体の dir の JSON patch が読む env の場所(1 番・9 番)を動かさない。
            - { name: WORKER_ROOM_FILE, value: /etc/worker-room/worker-room.json }
            # 版の file(ConfigMap worker-version の自分の名の鍵 — 頭の註)。$(WORKER_NAME) は前の行の env から展開される。
            - { name: WORKER_VERSION_FILE, value: "/etc/worker-version/$(WORKER_NAME)" }
            # 世代ごとの状態の dir(deploy/boot.sh の WORKER_GENERATION_DIRS): keeper は同じ container に 2 つの版の worker の process を
            # 並べるので、状態を $WORK_DIR/gen/<世代> に分ける(世代の名は Pod の uid と起こした刻)。
            - { name: POD_UID, valueFrom: { fieldRef: { fieldPath: metadata.uid } } }
            - { name: WORKER_GENERATION_DIRS, value: "1" }
            # 鍵の表(worker-env の WORKER_REPOS)を下の dir の mount の file でも受ける。kubelet が ConfigMap の更新を届けるので、worker は
            # 準備の前ごとに表を組み直し、表に足した行を起動し直さずに次の準備から読む(boot.sh の ROLE=access・card ki-2de748a0eac5)。
            # 末尾に置く — 機体の dir の JSON patch(zeus の generation.yaml)が DRAIN_DEADLINE を env の番号 9 で指すので、この行より前に挟まない。
            - { name: WORKER_REPOS_FILE, value: /etc/worker-env/WORKER_REPOS }
          lifecycle:
            # preStop の drain は、keeper が最後に起こした世代の版(keeper の状態の dir の commit — deploy/boot.sh の DOEFF_KEEPER_DIR の
            # 既定 /tmp/doeff-worker-keeper)の script で、生きている全部の世代を drain する。keeper が起きる前なら版の file の版。
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    WORKER_DOEFF_COMMIT="$$(cat /tmp/doeff-worker-keeper/commit 2>/dev/null || cat "$WORKER_VERSION_FILE")"
                    && export WORKER_DOEFF_COMMIT && ROLE=drain exec /opt/worker-boot.sh
          readinessProbe:
            exec: { command: ["/bin/sh", "-c", "ROLE=ready exec /opt/worker-boot.sh"] }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { mountPath: /work, name: work }
            - { mountPath: /scratch, name: scratch }
            - { mountPath: /memory-scratch, name: memory-scratch }
            - { mountPath: /host/etc/systemd/system, name: host-systemd, readOnly: true }
            - { mountPath: /var/run/secrets/kubernetes.io/serviceaccount, name: account-token, readOnly: true }
            - { mountPath: /etc/worker-repos, name: repos, readOnly: true }
            # subPath を使わない(subPath の mount には kubelet が更新を届けない)。
            - { mountPath: /etc/worker-env, name: repo-table, readOnly: true }
            - { mountPath: /opt/worker-prepare, name: prepare, readOnly: true }
            - { mountPath: /opt/worker-shell, name: shell, readOnly: true }
            - { mountPath: /etc/worker-room, name: room, readOnly: true }
            - { mountPath: /etc/worker-version, name: version, readOnly: true }
          # 資源の上限と取り分は機体ごとの値 — 機体の dir が足す。
      volumes:
        # 自己起動の root・実行環境の root・uv の cache と Python・crate・log。Pod の寿命の外(機体の dir)— 作り直しても残る。
        - { name: work, hostPath: { path: /var/lib/agent-worker, type: DirectoryOrCreate } }
        # 作業場所(disk)。Pod を作り直すと消える。
        - { name: scratch, emptyDir: {} }
        # 作業場所(memory — tmpfs)。小さく速い file の場所。中身は Pod の memory に数えられ、sizeLimit を越えると kubelet が Pod を
        # 追い出す。Pod を作り直すと消える。
        - { name: memory-scratch, emptyDir: { medium: Memory, sizeLimit: 1536Mi } }
        - { name: host-systemd, hostPath: { path: /etc/systemd/system, type: Directory } }
        # ServiceAccount doeff-worker の token と cluster の CA と namespace — 自動 mount と同じ中身を worker の container にだけ置く。
        - name: account-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
        - { name: repos, secret: { secretName: worker-repos, defaultMode: 0400, optional: true } }
        - name: repo-table
          configMap: { name: worker-env, optional: true, items: [{ key: WORKER_REPOS, path: WORKER_REPOS }] }
        - { name: prepare, configMap: { name: worker-prepare, defaultMode: 0555, optional: true } }
        - { name: shell, configMap: { name: worker-shell, defaultMode: 0555, optional: true } }
        - { name: room, configMap: { name: worker-room, defaultMode: 0444 } }
        - { name: version, configMap: { name: worker-version, defaultMode: 0444 } }
