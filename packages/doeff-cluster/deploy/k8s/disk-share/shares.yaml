# 根の disk 1 本を、doeff の worker の作業の dir(hostPath /var/lib/agent-worker = /work)と Longhorn の写し(/var/lib/longhorn の
# default-disk)が分け合う機体の、disk の分け前 — 定義元はこの file 1 つ(card ki-3dfe8e9d820a)。
#
# なぜ要るか: 2026-10-21 02:30 JST に k3s-1 の worker が near(空きが最低 + near の幅を割った)を名乗った。worker は roots を 20 GiB まで、
# Longhorn は写しを名目の合計 (disk − 予約 31.6 GB〔既定の 30%〕)× 200% まで受ける作りで、どちらも disk を独り占めする前提の上限を
# 別々に持っていた。だから、どちらも自分の上限の内のまま線を割った(引き金は trim の間の写しの育ち +5 GB と roots の育ち 3.7 GiB)。
#
# 分け前(byte・機体ごと)— 足すと disk の大きさになる:
#   filesystemReservedBytes  filesystem の予約(ext4 の root の予約 block — worker の読む空き〔avail〕に数えない)
#   systemBytes              OS・k3s・container の image・log
#   otherResidentsBytes      別の系の旧い state(/var/lib/merge-queue-* と旧い worker の state の dir — 10-08/09 から書かれていない)。
#                            持ち主が消せば、その分が Longhorn の分へ移る
#   worker の分              空きの最低(minFreeGiB)+ near の幅 + 戻りの幅(worker の env_upkeep の NEAR-MARGIN-BYTES・
#                            NEAR-RETURN-BYTES — 値はそこから読む)+ roots の上限(rootsGiB)+ roots の外の worker の state(stateBytes)
#   Longhorn の分            残り
#
# ここから導く物(derive.py が書く — 手で直さない。宣言を直したら `uv run python packages/doeff-cluster/deploy/k8s/disk-share/derive.py`):
#   ../nodes/<機体>/disk-share.yaml  worker の env WORKER_ENV_MIN_FREE_GIB = minFreeGiB・WORKER_ENV_ROOTS_GIB = rootsGiB
#   longhorn-nodes.yaml              Longhorn の disk の予約 storageReserved = disk − Longhorn の分 × 100 / overProvisioningPercent
# 予約をこう置くと、Longhorn が受ける写しの名目の合計の上限((disk − 予約)× overProvisioningPercent / 100 — Longhorn の置き方の判じ)が
# Longhorn の分に等しくなる。写しは名目の大きさまでしか育たないので、worker と Longhorn がそれぞれ許された大きさまで育っても、空きは
# 空きの最低 + near の幅 + 戻りの幅を割らない(worker は ok のまま)。
#
# 守りの外(この宣言が持たない物):
# - snapshot を重ねた写しは名目を越えて育つ。写しの snapshot の消化と filesystem-trim は、上に載る系の Longhorn の手入れの job が持つ。
# - systemBytes を越える image や log の育ちは、何も止めない。越えた時は worker の near(見回りの検査)が最後に知らせる。
# - 既に置かれた写しは、予約を上げても動かない。名目の合計が分を越えている機体は、写しを退かせて分の内へ戻す(volume の持ち主の可が要る)。
#
# overProvisioningPercent は Longhorn の設定 storage-over-provisioning-percentage(cluster 全体の値)の写し。設定を替える時はここも直す
# (替えると導く予約が変わる)。atlas・eos・zeus はこの宣言の外 — atlas と eos の根の disk の Longhorn の disk は写しを受けず
# (allowScheduling false)、zeus の worker は USB の SSD に在る(根の disk を分け合わない)。
overProvisioningPercent: 200

# 機体の形(shapes — 機体の行が `<<:` で受ける雛形。derive.py は nodes だけを読む)。
# k3s の VPS の根の disk(vda 100 GiB・ext4)。値の出所は 2026-10-21 の実測(node-exporter と du — card ki-9240301c9ed5 の発言):
#   diskBytes                / の大きさ(statfs — Longhorn の storageMaximum と同じ値)
#   systemBytes              実測 13.9〜20.6 GB(k3s-0 20.6・k3s-1 17.5・k3s-2 13.9・k3s-3 20.0 — container の image 6.0〜9.3 を含む)の上に余り
#   worker.stateBytes        実測 2.1〜2.5 GB(/var/lib/agent-worker から roots を引いた物 — uv の cache・crate・log)
#   worker.rootsGiB          機体の仕事だけを受ける worker の roots の実測は 4.0〜5.2 GB(29〜32 本)。8 GiB は root 約 40 本分
#   worker.minFreeGiB        準備を断る線(exhausted)。k3s の kubelet が Pod を追い出す線(空き 5%・5.3 GB)の上
shapes:
  k3s-vps: &k3s-vps
    longhornDisk: default-disk-e4ac800743aec705
    diskBytes: 105_490_411_520
    filesystemReservedBytes: 4_526_161_920
    systemBytes: 22_000_000_000
    worker:
      minFreeGiB: 10
      rootsGiB: 8
      stateBytes: 3_000_000_000

nodes:
  k3s-0:
    <<: *k3s-vps
    otherResidentsBytes: 0
  k3s-1:
    <<: *k3s-vps
    # merge-queue-land 0.53・merge-queue-ledger 0.56・旧い worker の state 1.20 GB
    otherResidentsBytes: 2_300_000_000
  k3s-2:
    <<: *k3s-vps
    # merge-queue-land 12.88・merge-queue-ledger 1.08・旧い worker の state 4.35 GB
    otherResidentsBytes: 18_400_000_000
  k3s-3:
    <<: *k3s-vps
    # merge-queue-land 7.57・merge-queue-ledger 0.59・旧い worker の state 2.64 GB
    otherResidentsBytes: 10_900_000_000
