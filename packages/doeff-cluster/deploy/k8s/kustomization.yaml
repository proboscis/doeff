# doeff-cluster の k8s の宣言 — coordinator 1 つ(coordinator/)と、機体ごとの worker 1 つ(workers/ = worker の ServiceAccount と機体の dir
# nodes/<Node の名>/ — 機体の dir は雛形 worker/ に機体の差を足す)。この dir は coordinator と worker を組み立てる(kubectl kustomize で
# 確かめる時の入口)。
# Flux は coordinator/ と workers/ を別々の Kustomization で当てる — 上に載る系が今の宣言から引き継ぐ時期を組ごとに決められるように。
# coordinator の版上げの前に上げ先の root を組む Job(coordinator-prepare/)も別の Kustomization で当て、coordinator/ の Kustomization は
# その終わりを待つ(dependsOn — 訳は coordinator-prepare/ の頭の註)。coordinator-prepare/ は版を写すために ../coordinator を読むので、
# ここには並べない(並べると coordinator の物を 2 度数えて組み立てが断る)— Job は coordinator-prepare/ を単独で組み立てて確かめる。
# Namespace・Secret の中身・上に載る系の値の ConfigMap・job が要る権限は、上に載る系の repo が持つ(名と形は各 file の頭の註)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - coordinator
  - workers
