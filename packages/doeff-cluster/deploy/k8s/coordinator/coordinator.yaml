# doeff-cluster の coordinator(cluster に 1 つ・atlas)と、その Service・ServiceAccount・Node を読む権限。
#
# 上に載る系の repo が用意する物(名は固定 — この宣言は名で参照するだけ):
#   ConfigMap coordinator-env   envFrom で受ける env。boot.sh が必ず要る NOTICE_BROKER(worker の生死の知らせの broker — redis://… か
#                               memory)。無いと boot.sh が理由を出して止まる。下の env と同じ名を置いても効かない(env が優先)。
#   Namespace agent-worker      ここでは宣言しない。
#
# この dir が持つ物: ConfigMap coord-wal-backup — 起動の前に記録(WAL と snapshot)の控えを取る script(キー backup.sh)。
# 中身は coord-wal-backup.sh で、kustomization.yaml の configMapGenerator が名を固定して組む。無ければ控えを飛ばして起動する。
#
# 名と selector は以前の宣言と同じ(Deployment の selector は変えられない — 持ち主が替わっても同じ物を引き継ぎ、coordinator が
# 2 つ同時に同じ状態の file を書く時間を作らない)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coordinator
  namespace: agent-worker
  labels: { app.kubernetes.io/part-of: agent-worker }
---
# coordinator は Node の label から能力(company-machine など)を導く。Node を名で 1 つずつ GET せず、名の fieldSelector で list した後に
# watch で見張るので、nodes の list と watch が要る。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-worker-coordinator-nodes
  labels: { app.kubernetes.io/part-of: agent-worker }
rules:
  - { apiGroups: [""], resources: [nodes], verbs: [list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-worker-coordinator-nodes
  labels: { app.kubernetes.io/part-of: agent-worker }
subjects:
  - { kind: ServiceAccount, name: coordinator, namespace: agent-worker }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: agent-worker-coordinator-nodes }
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: agent-worker
  labels: { app: agent-worker-coordinator }
spec:
  selector: { app: agent-worker-coordinator }
  ports: [ { name: http, port: 8080, targetPort: 8080 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: agent-worker
  labels: { app: agent-worker-coordinator }
spec:
  replicas: 1
  # 状態の file を 2 つが同時に書かないよう、旧を止めてから新を起こす。
  strategy: { type: Recreate }
  selector: { matchLabels: { app: agent-worker-coordinator } }
  template:
    metadata:
      labels: { app: agent-worker-coordinator }
    spec:
      # 既定の ServiceAccount に ClusterRole を足すだけでは token が Pod に載らない — 専用の ServiceAccount を指定し automount を true にする。
      serviceAccountName: coordinator
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector: { kubernetes.io/hostname: atlas }
      securityContext: { runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true, fsGroup: 1000 }
      initContainers:
        # hostPath は root の持ち物で作られるので、uid 1000 へ渡す。
        - name: own-state
          image: zeus:5000/doeff-cluster-base:in-52341c8f2d15
          command: ["chown", "1000:1000", "/work", "/work/coord"]
          securityContext: { runAsUser: 0, runAsNonRoot: false }
          volumeMounts:
            - { mountPath: /work, name: work }
            - { mountPath: /work/coord, name: coord-wal }
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { cpu: 100m, memory: 64Mi } }
        # 記録(WAL)の控え(直近 5 つ)。古い Pod が消えた後、coordinator の起動の前に 1 度。失敗しても起動は通す(script も外側の sh も
        # 0 で終わる・ConfigMap は optional)。控えた名か飛ばした理由は、この container の log の 1 行。
        - name: wal-backup
          image: zeus:5000/doeff-cluster-base:in-52341c8f2d15
          command: ["sh", "-c", "sh /opt/coord-wal-backup/backup.sh || echo 'coord-wal-backup: 控えを飛ばす — script が失敗した(coordinator の起動は通す)'"]
          env:
            - { name: WAL_DIR, value: /work/coord/wal }
            - { name: BACKUP_DIR, value: /work/coord/backups }
            - { name: BACKUP_KEEP, value: "5" }
            # 控えを取った後に残す空きの下限 = 16GiB。出どころ = atlas の kubelet の設定の evictionSoft nodefs.available 15Gi(猶予 5 分・
            # 2026-10-05 に Node の configz で確かめた値)に 1Gi を足した線。控えは coord-wal の volume(atlas の ZFS の dataset
            # hot_ssd_nvme/agent-worker-coord・Node の disk とは別)に置くので、この線は ZFS の pool の空きに掛かる。
            - { name: BACKUP_MIN_FREE_BYTES, value: "17179869184" }
          volumeMounts:
            - { mountPath: /work, name: work }
            - { mountPath: /work/coord, name: coord-wal }
            - { mountPath: /opt/coord-wal-backup, name: coord-wal-backup, readOnly: true }
          resources: { requests: { cpu: 200m, memory: 64Mi }, limits: { cpu: 200m, memory: 64Mi } }
      containers:
        - name: coordinator
          image: zeus:5000/doeff-cluster-base:in-52341c8f2d15
          envFrom:
            - configMapRef: { name: coordinator-env }
          env:
            - { name: ROLE, value: coordinator }
            - { name: WORK_DIR, value: /work }
            # coordinator の code の版(doeff の commit)。変える時はここを変えて入れ替える(image は同じ)。どの機体の worker の版も
            # この版と同じかその祖先に保つ — worker を上げる前にここを先に上げる(../../../README.md「配備の順」・宣言の検
            # tests/test_k8s_declarations.py の test_no_worker_is_newer_than_the_coordinator が断る)。この行は上げ先の root を先に組む Job
            # (../coordinator-prepare)の版の定義元でもある — Job の版と名は組み立ての時にこの行から写すので、版上げはこの 1 行だけを変える
            # (ADR-DOE-CLUSTER-003 R3)。

            # 43d055adc = 前の世代と重なる新しい世代は、前の世代の job を全部受け取れるまで Ready にならず、recreate の job は前の世代の
            # Pod の preStop の drain が来てから一度に移す版(AL-D2k 43d055adc)と、実行環境の root を 2 つの世代で分け合う版(AL-D2g
            # 2ceb078fa)。10-11 18:42 JST の zeus の worker の入れ替えで、前の世代の Pod が Service の振り先から外れた後も job が前の世代に
            # 残り、API が 2〜7 分届かなかった事の直し。
            # ae47d60a2 = 旧い Pod の preStop の drain の問いに、旧い世代が lease の窓より長く黙っていても『Pod が消えた』と読んで
            # drained を返さない版(AL-D2l — 10-11 18:58 JST に負荷で heartbeat が途絶えた拍に preStop が終わり、ターンが 15 本切れた事の
            # 直し)。前の版 43d055adc(L2043)は ae47d60a2 の祖先。
            # bca4c2f9a = 止まりの始まった退いた世代への返事で、今の世代の process が Ready と数えられていない拍にも handoff の job に
            # 印 supersededBy を付け、退いた世代に新しい試行を起こさせない版(AL-D2n — 10-11 21:29 JST に退いた世代が新しい試行を起こし、
            # 今の世代から受付を取った事の直し)。前の版 ae47d60a2(L2046)は bca4c2f9a の祖先。
            # fb32909f3 = 準備と計器の報告の表が、置き先の process の報告を他の世代の送り手の報告に押し出させない版(AL-D2o — 退いた世代の
            # process が 4 つを越えて報告すると置き先の Ready が押し出され、入れ替えの合図 supersededBy が外れて退いた世代が起こし直しを
            # 増やした事の直し)。前の版 bca4c2f9a(L2060)は fb32909f3 の祖先。
            # 74ebb50b6 = 組の同時数の上限の値を系の宣言(資源 GroupLimit)から持ち、task は組の名だけを名乗る版(card ki-b0e8028c8c8d・
            # L2139)。上に載る系の送り手は既に組の名だけを名乗り(card ki-ab95a4b49e16)、fb32909f3 の受け口は値と範囲の欄の無い名乗りを
            # 断るので、この版が先。入れ替えたら続けて、組を :task-limits で宣言する系を宣言し直す(上に載る系の配備の順の表が、
            # coordinatorCommit がこの版を含むまで断る)。この版は、保存に残った旧い形の行(上限の値と範囲を名乗る limits)のうち
            # 終わっていない行を failed にするので、入れ替えは組を名乗る task が queued・走っていない刻に当てる。前の版 fb32909f3(L2067)は
            # 74ebb50b6 の祖先。
            # 475ee1e5d = 組の上限を宣言する系を 1 つに保ち、system の無い GroupLimit を持ち主の無い組として受け、系を繋ぐ時に system-of の
            # 名を保つ版(card ki-b0e8028c8c8d・L2184・L2189 fdf1fbe47 — 上に載る系の doeff の版を上げる前にこの版が要る)に、機体の worker が
            # 自分の行を job の log へ送る worker の入口の差(card ki-35923a5895b2・L2173・L2193)を足した版。coordinator の code の差は
            # ki-b0e8 の分だけで、機体の worker(zeus-native・mac-native)を 475ee1e5d へ上げるために、ki-b0e8 の入れ替えと 1 回に合わせる
            # (配り役の指示 2026-10-12 14:39 JST)。前の版 74ebb50b6(L2139)は 475ee1e5d の祖先。
            # a1d17b0dd = coordinator の process 自身の行を job の log と同じ送り先へ送る版(card ki-0b0ab40048b9・L2214 — Pod の log は版上げの
            # Pod の入れ替えで消え、10-12 08:12・08:45〜09:05 JST に全部の worker が届かなかった窓の coordinator の側を後から読めなかった)。
            # 送り先は上に載る系の ConfigMap coordinator-env(DOEFF_JOB_LOG_OTLP・DOEFF_JOB_LOG_ATTRIBUTES)、名乗りは下の POD_NAME・
            # POD_NAMESPACE。間の差の他の 3 つ(ac512fc1a・bca5f8ada・811234f1d)は worker の側の code。前の版 475ee1e5d(L2189)は
            # a1d17b0dd の祖先。
            # 3fcba1939 = 止まる時に残りの行を送る上限を coordinator の入口が 10 秒で渡し、送り先が遅くても止まりの行まで送ってから終わる版
            # (card ki-0b0ab40048b9・L2226 d03f0910d — 設計検証 lt-D8Y7NDS3A1XHEP1DQJ323D6CHB の盲検 A: 既定の 0.5 秒では POST の答えを待つ間に
            # 止まると、入れ替えの後に一番要る止まりの行が消えた)。間の doeff-cluster の code の差はこの分だけ。前の版 a1d17b0dd(L2214)は
            # 3fcba1939 の祖先。
            # 434f9789f = 負の優先の task(背景の仕事 — 会話の long-command)が task-reserve の半分(切り捨て)までは使える版(card ki-f6d3da302cf0・
            # L2312 — 10-14 17:05 JST に zeus の常駐の job が capacity − task-reserve = 27 に達し、予約を使えない long-command 8 本が 76〜230 分
            # queued のまま走らなかった事の直し)。間の doeff-cluster の code の差は他に 10-12〜10-13 の main の 17 本(時計を単調な時計で計る・
            # 報告の表の移し・型の名乗り・準備の木の hardlink 等)。前の版 3fcba1939(L2226)は 434f9789f の祖先。
            # e8d948145 = coordinator が自分の止まり(前の歩の予定の外の長さが lease を越えた時)を検出し、止まりの直後は止まっていた長さを
            # worker の最後の連絡と task の lease の経過に数えない版(card ki-d033e5f969cf・L2333 — 10-13 に atlas が 3 分止まり、起きた最初の
            # 歩で全部の worker を lease 切れに数え、配る担当へ消えと戻りが 33 回届いた事の直し・親 ki-b4d94c618094)。間の doeff-cluster の
            # code の差は他に、退きの保ち(ki-e3531030eb37)・退いた process の空き待ちの文・ReadDetachedQueue の返事の欄(task の limits)
            # — どれも返事に欄を足すだけで、欄を読まない古い worker は今どおり動く。前の版 434f9789f(L2312)は e8d948145 の祖先。
            # e1f9303ce = worker に機体の memory の見張りを足した版(card ki-7b934e2538f9・L2356)。atlas の worker を同じ版へ上げるため、
            # 版の向き(worker は coordinator と同じかその祖先)に合わせて先に上げる。間の coordinator の code の差は、止まりの判断を
            # stall-of の 1 つに縛る 8e9a0d3e2(ki-d033e5f969cf の続き)だけ。前の版 e8d948145(L2333)は e1f9303ce の祖先。
            # 29bba00f = e1f9303ce に、機体の memory が逼迫の間は task の起こしを見送る変更を足した版(card ki-7b934e2538f9・L2361)。間の差は
            # worker の内部だけ(coordinator との契約は変えない)。前の版 e1f9303ce(L2360)は 29bba00f の祖先。
            # 5ab25a28f = macOS の worker が空きを Opportunistic の volume の空きで読む版(card ki-4ee952807ce0・L2496)。Mac の機体の worker
            # mac-native を同じ版へ上げるため、版の向きに合わせて先に上げる。間の coordinator の code の差は、ClusterState の欄を Table にする
            # 作り替え(T1〜T7・G — ki-a47c2ba2e4fb ほか)・cluster_policy の走査を task-split の対象に絞る変更(ki-7a6a60dc516e)・tasks の
            # 書き手を変わった行だけの書きにする変更(ki-c9fb4d5d2408)。前の版 29bba00f(L2361)は 5ab25a28f の祖先。
            # 9fe8c330b = 実行環境の root の木を os.link で写し、.pyc を保存先の 1 つの file への hardlink で置く版(card ki-d51b7baa38bc・
            # L2515)。Mac の機体の worker mac-native を同じ版へ上げるため、版の向きに合わせて先に上げる。間の差で coordinator の process に
            # 効く物は、line_stamp の log の write を読みの thread の外へ出す変更(ki-2742a2af90b6)・scheduler の Task と Future の共変
            # (Gather・Race)・pidfd-of の libc を 1 度だけ読む変更・doeff.result の型(doeff-vm の result.rs を含む — 準備で wheel を
            # 組み直す)。worker の準備の変更(L2515)は worker の内部だけ(coordinator との契約は変えない)。前の版 5ab25a28f(L2496)は
            # 9fe8c330b の祖先。
            # d5ebd138d = 切り離した task の終わりを、終わりを決める coordinator の 1 か所から出口(outbox — GET /outbox・DELETE /outbox/<id>)へ
            # 1 度だけ積み、task の行に知らせ先 notify を持たせる版(card ki-e7945a2b2d00・L2644)。上に載る系の腕がこの出口を読み、task を
            # 置いた側へ結末を届ける。間の差で coordinator の process に効く物は、scheduled() の既定の scheduler を Rust の版にする変更
            # (ec5b91d99 — 上に載る系の job は 4de77f941 から既にこの版)・止められた常駐の job の起こし直しの上限(523ffad35・2a117cd53)・
            # worker の disk の名乗りの戻りの幅・handler は @handler の def だけ。前の版 9fe8c330b は d5ebd138d の祖先。
            # 69c3dc8d1 = worker が起こす子を、機体の配備が名を渡した兄弟の cgroup へ置く版(card ki-ed9dca403f58・L2651)。zeus の機体の
            # worker zeus-native を同じ版へ上げるため、版の向きに合わせて先に上げる。間の doeff-cluster の code の差は worker の入口と
            # worker/core・protocol の job_cgroup だけ(環境変数 DOEFF_WORKER_JOB_CGROUP が無い worker と coordinator は今のまま)で、
            # coordinator の process に効く差は無い(他は k3s の disk の分け前の宣言・claude-code の package・記事)。前の版 d5ebd138d は
            # 69c3dc8d1 の祖先。
            - { name: WORKER_DOEFF_COMMIT, value: 69c3dc8d1053c34dc1f2f99b0f5c0d4a76460452 }
            # coordinator の process 自身の行の名乗り(coordinator/entry/main の process-lines — job の名 coordinator/<namespace>・worker の
            # 名の欄 = Pod の名)。送り先(ConfigMap coordinator-env の DOEFF_JOB_LOG_OTLP)が無ければ読まない。
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            # 知らせの broker が Redis の時の、繋ぐ・送るの答えを待つ上限と、戻りを待つ間に繋がるかを試す間隔(秒)。
            - { name: NOTICE_TIMEOUT_SECONDS, value: "2" }
            - { name: NOTICE_RETRY_SECONDS, value: "2" }
          ports: [ { containerPort: 8080, name: http } ]
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 10
          volumeMounts:
            - { mountPath: /work, name: work }
            - { mountPath: /work/coord, name: coord-wal }
          # requests = limits(Guaranteed — oom_score_adj -997)。Burstable(512Mi / 4Gi)の頃は oom_score_adj が 983 で、atlas の memory が
          # 尽きた時に kernel が worker の job と同じく殺す側に居た(card ki-7b934e2538f9 の thrash・ki-b3c8a5cc7b9a)。Guaranteed は Pod の
          # 全部の container(init を含む)で cpu と memory の requests = limits が要るので、init の 2 つも揃える。memory 1536Mi = 2026-10-09〜16
          # の working set の山 489MiB(10-11 の入れ替えの続いた日・prometheus の 1 分ごと)の約 3 倍 — 1 分の間の短い山(Pod の
          # memory.peak は prometheus の山より約 70MiB 高い)と起動の時の記録の読み込みを入れ、自分の limit で殺されない幅を取る。cpu 2 = 前の
          # limit と同じ(7 日の 1 分の山 1.98 core)— requests を 2 にするので、atlas が CPU で混んだ時の取り分も上がる。
          resources: { requests: { cpu: "2", memory: 1536Mi }, limits: { cpu: "2", memory: 1536Mi } }
      volumes:
        - { name: work, hostPath: { path: /var/lib/agent-worker-coord, type: DirectoryOrCreate } }
        # 記録(WAL)と控えの dir だけを atlas の ZFS の dataset hot_ssd_nvme/agent-worker-coord(sync=standard・logbias=latency)へ置く
        # (root の ext4 の drive は FLUSH が 0.1〜1 秒かかり、WAL の fsync が詰まった)。boot/(root)と state/ は work のまま。
        # type は Directory(作らない)— dataset が mount されていない時は coord が無いので Pod は起きず、空の記録で起動しない。
        - { name: coord-wal, hostPath: { path: /mnt/hot_ssd_nvme/agent-worker-coord/coord, type: Directory } }
        - { name: coord-wal-backup, configMap: { name: coord-wal-backup, optional: true } }
