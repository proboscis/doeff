[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doeff-validation"
version = "0.1.0"
description = "doeff validation that runs every independent check item, collects all failures of the failed items, and returns them as a ValidationException (a thin layer on top of doeff-traverse) (the Hy validate / check macros are provided by doeff-hy)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "doeff>=0.2.0",
    "doeff-traverse",
    "doeff-core-effects",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_validation"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-traverse = { workspace = true }
doeff-core-effects = { workspace = true }
