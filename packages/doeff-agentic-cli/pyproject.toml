[project]
name = "doeff-agentic-cli"
version = "0.1.0"
description = "Fast Rust CLI for doeff-agentic workflow management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
keywords = ["doeff", "agentic", "workflow", "cli", "rust"]

# This is a Rust CLI - no Python dependencies
dependencies = []

[build-system]
requires = ["maturin>=1.4,<2.0"]
# maturin を包み、cargo の target を作業木の外の一時の dir に置く(tools/doeff_cargo_backend.py・agora-redesign #1493)
build-backend = "doeff_cargo_backend"
backend-path = ["."]

[tool.maturin]
# Build as a pure Rust binary, not a Python extension
bindings = "bin"
# The binary will be named doeff-agentic (from Cargo.toml [[bin]] name)
strip = true
