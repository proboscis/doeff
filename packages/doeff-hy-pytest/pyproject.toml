[build-system]
# Writing the license SPDX expression and license-files (PEP 639) to core metadata by default starts with hatchling 1.27 (default version 2.4).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doeff-hy-pytest"
version = "0.8.0"
description = "Algebraic effects for Python: the pytest plugin for doeff-hy tests, with a Python 3.14 fix for Hy and optional per-test time limits"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "hy", "pytest", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
]
# No dependency is declared: this plugin is pulled in by doeff-hy (only the direction doeff-hy -> doeff-hy-pytest).
# The patch itself lives in doeff_hy._ast_unparse; the plugin only imports it and applies it.
dependencies = []

[project.urls]
Homepage = "https://github.com/proboscis/doeff/tree/main/packages/doeff-hy-pytest"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

# pytest marks **every module** of a distribution that has a pytest11 entry point for assert rewriting. If doeff-hy itself had this
# entry point, it would try to rewrite doeff_hy's .hy files (macros.hy etc.) as Python and the import would fail (only in repos
# installed from a wheel; editable installs do not get the mark). So the plugin lives in this distribution, which has no .hy.
[project.entry-points.pytest11]
doeff_hy = "doeff_hy_pytest"

[tool.hatch.build.targets.wheel]
packages = ["src/doeff_hy_pytest"]
