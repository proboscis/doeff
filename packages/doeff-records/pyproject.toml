[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doeff-records"
version = "0.1.0"
description = "記録の仕組み: 版つきの行・変更の列・追記の列の effect と、memory / PostgreSQL の handler と適合の筋書き"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "doeff>=0.2.0",
    # 記録の service の待ち受け(http_server.hy)は doeff の汎用の HTTP の待ち受けの本物の答え手 aiohttp-http-server を使う(#880 U7)。
    "doeff-core-effects[http-server]",
    # 記録の変化を出来事の合図として発する源(event_source.hy)は、doeff-events の Publish で合図を発する(待ちは購読者の列が答える・#3077)。
    "doeff-events",
    "doeff-hy",
    "doeff-time",
    "hy>=1.3",
    # どの module も pydantic を import しない(typed.hy は doeff_hy.wire_codec の行の解き手 — tests/test_imports_no_pydantic.py)。
    # 依存から外すのは、pydantic を test の依存へ移す card ki-5ddadb736f62(消費者の uv.lock と一緒に)。
    "pydantic>=2.6",
]

[project.optional-dependencies]
# PostgreSQL の handler は接続を composition root から受ける。接続を開く側だけが psycopg を持つ。
pg = ["psycopg>=3.1"]

[tool.hatch.build.targets.wheel]
# import 名 doeff_records は Hy の module だけの namespace package(__init__ を持たない — hy を読み込んだ process が import する)。
packages = ["src/doeff_records"]
# editable の install は .py の無い dir を sys.path に載せない — src を明示して載せる。
dev-mode-dirs = ["src"]

[tool.uv.sources]
doeff = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-events = { workspace = true }
doeff-hy = { workspace = true }
doeff-time = { workspace = true }
