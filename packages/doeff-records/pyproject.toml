[build-system]
# The build hook (hatch_build.py, a link to tools/doeff_hy_stub_hook.py) makes the .pyi of the .hy from the .hy at build time; these are the
# third-party modules the expansion imports (doeff, doeff-hy and doeff-core-effects are read from the checkout's sources, not required here).
requires = ["hatchling>=1.27", "hy>=1.3.0,<=1.3.1", "frozendict>=2.4.0", "doeff-vm"]
build-backend = "hatchling.build"

[project]
name = "doeff-records"
version = "0.1.0"
description = "記録の仕組み: 版つきの行・変更の列・追記の列の effect と、memory / PostgreSQL の handler と適合の筋書き"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "doeff>=0.2.0",
    # 記録の service の待ち受け(_http_server.hy)は doeff の汎用の HTTP の待ち受けの本物の答え手 aiohttp-http-server を使う(#880 U7)。
    "doeff-core-effects[http-server]",
    # 記録の変化を出来事の合図として発する源(_event_source.hy)は、doeff-events の Publish で合図を発する(待ちは購読者の列が答える・#3077)。
    "doeff-events",
    "doeff-hy",
    "doeff-time",
    "hy>=1.3",
    # pydantic は依存に置かない— どの module も pydantic を import しない(_typed.hy は doeff_hy._wire_codec の
    # 行の解き手 — tests/test_imports_no_pydantic.py)。
]

[project.optional-dependencies]
# PostgreSQL の handler は接続を composition root から受ける。接続を開く側だけが psycopg を持つ。
pg = ["psycopg>=3.1"]

[tool.hatch.build.targets.wheel]
# import 名 doeff_records の入口(__init__.py)は effect・handler とその型を遅延の名で出し、名を読む時に hy を読み込んで Hy の
# module(名に _ の付いた子 — ADR-DOE-API-001 R5)を読む。
packages = ["src/doeff_records"]
# editable の install は .py の無い dir を sys.path に載せない — src を明示して載せる。
dev-mode-dirs = ["src"]

[tool.hatch.build]
# The .pyi made by the build hook are git-ignored, and hatchling leaves ignored files out of the wheel and the sdist — the key below puts them back in.
artifacts = ["*.pyi"]

[tool.hatch.build.hooks.custom]
# Make the .pyi of every .hy under stub-dirs, with module names taken from stub-root (tools/doeff_hy_stub_hook.py). The .pyi are not committed.
stub-root = "src"
stub-dirs = ["src/doeff_records"]

[tool.uv]
# uv builds a path install again (and so runs the build hook) only when a file listed here changes: the .hy, the hook, and the tool and macros of
# doeff-hy that make the .pyi. Listing keys replaces uv's default keys, so pyproject.toml is listed too.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "src/**/*.hy" },
    { file = "../doeff-hy/src/**/*.hy" },
    { file = "../doeff-hy/src/**/*.py" },
]

[tool.uv.sources]
doeff-vm = { workspace = true }
doeff = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-events = { workspace = true }
doeff-hy = { workspace = true }
doeff-time = { workspace = true }
