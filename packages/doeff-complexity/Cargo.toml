[package]
name = "doeff-complexity"
version = "0.1.0"
edition = "2021"
description = "Measures cyclomatic complexity of Hy functions, types, and modules on doeff-indexer's Hy reader, and gates changes that grow complexity"
license = "MIT"
publish = false

[lib]
name = "doeff_complexity"
path = "src/lib.rs"

[[bin]]
name = "doeff-complexity"
path = "src/main.rs"

[dependencies]
doeff-indexer = { path = "../doeff-indexer", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
