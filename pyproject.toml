[dependency-groups]
dev = [
    # make sync builds the Rust VM with maturin — declared here so every machine gets it
    # from the lock, not from a tool installed by hand (agora-redesign#645 item 7).
    "maturin>=1.5,<2",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "pillow>=11.3.0",
    "beartype>=0.19.0",
    "httpx>=0.25.0",
    "doeff-conductor",
    "doeff-agents",
    "doeff-llm",
    "doeff-gemini",
    "doeff-openai",
    "doeff-openrouter",
    "doeff-vm",
    "doeff-traverse",
    "doeff-time",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3.1",
    # 実 PostgreSQL の検(doeff-core-effects の extra postgres・doeff-records の extra pg と同じ psycopg)を、日次と手元の dev の環境でも
    # 走らせる — 検が使い捨ての PostgreSQL を自分で立てても、psycopg が無いと skip か import の失敗になる(agora-redesign #2830)。
    "psycopg>=3.1",
    # 実 Redis の検(doeff-events の extra redis と同じ client)を、日次と手元の dev の環境でも走らせる — client が無いと、redis-server の
    # 実行 file が在っても本物を相手にする検が import で落ちる(agora-redesign #3850)。
    "redis>=5.0",
    # OS のファイル監視の検(doeff-events の extra files と同じ library — #3977)を、日次と手元の dev の環境でも走らせる。
    "watchfiles>=1.0",
    "hy>=1.2.0",
    "doeff-hy",
    # 自前の defwire の解き手を pydantic と照らす test(packages/doeff-hy/tests/test_wire_parity.py)が読む pydantic(card ki-5ddadb736f62)。
    "doeff-hy[parity]",
    "doeff-adr",
    "doeff-domain[dogfood]",
    "doeff-system-one",
    "doeff-jev",
    "doeff-claude-judge",
    "doeff-cluster",
    "doeff-validation",
    "doeff-claude-code",
    "doeff-codex",
    "doeff-records",
    "doeff-docker",
    "doeff-secret",
    "doeff-ml-nexus",
    "cloudpickle>=3.0",
    "semgrep>=1.161.0,<2",
    "pre-commit>=4,<5",
    # 書いた後の linter(hook doeff-lint-after-write)は書いた file の repo の .venv/bin/doeff-linter を引く。agora の Pod の会話には
    # 開発版の置き場も PATH の binary も無いので、dev の依存に置いて make sync で入れる — 無いと doeff の Hy の file が検査されない。
    "doeff-linter",
    # 公開の API の目録(tools/public_api_inventory.py)は doeff-indexer の入口を import で読み(Rust の拡張を持つ package は字面では
    # 拡張の名を数えられない)、doeff run の discovery の検は effect FindSymbols に Rust の索引器で答える(card ki-1e51e218527e)。
    "doeff-indexer",
    # 公開の API の型が pyright だけでなく mypy でも効く事を確かめる検(tests/test_handler_installer_typing.py — 使う人は
    # どちらの道具でも check する・card ki-68c54e9064e5)。
    "mypy>=2.4.0",
]
