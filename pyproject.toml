[project]
name = "doeff"
version = "0.4.1"
description = "Pragmatic do-notation and effects system for Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kento Masui", email = "nameissoap@gmail.com"}
]
keywords = ["monad", "effects", "functional", "do-notation", "free-monad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "doeff-vm>=0.2.0",
    "doeff-core-effects>=0.1.0",
]

[project.optional-dependencies]
viz = ["phart>=1.1.4"]

[project.scripts]
doeff = "doeff.__main__:main"

[project.urls]
Homepage = "https://github.com/proboscis/doeff"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["doeff/", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["doeff"]


[tool.uv]
# Semgrep works with ruamel.yaml's pure-Python implementation. Its pinned C accelerator does not
# build on the repository's default free-threaded Python 3.14, so exclude only that optional path.
exclude-dependencies = [
    "ruamel-yaml-clib",
]

[tool.uv.workspace]
members = ["packages/*"]
# doeff-agentd is a retired Rust crate (efe41e35, #575): git no longer tracks it,
# but checkouts that ever built it keep untracked残骸 (Cargo.lock / target/) in
# packages/doeff-agentd/, which the members glob then picks up as a workspace
# member with no pyproject.toml — breaking resolution for every consumer that
# references this repo as an editable/path dependency (observed fleet-wide
# 2026-08-07: dotfiles agentcli "Workspace member doeff-agentd is missing a
# pyproject.toml"). Excluding it here fixes all such checkouts at once.
exclude = ["packages/doeff-agentd"]

[tool.uv.sources]
doeff-indexer = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-flow = { workspace = true }
doeff-agents = { workspace = true }
doeff-agentic = { workspace = true }
doeff-conductor = { workspace = true }
doeff-git = { workspace = true }
doeff-vm = { workspace = true }
doeff-llm = { workspace = true }
doeff-gemini = { workspace = true }
doeff-openai = { workspace = true }
doeff-openrouter = { workspace = true }
doeff-time = { workspace = true }
doeff-events = { workspace = true }
doeff-traverse = { workspace = true }
doeff-docker = { workspace = true }
doeff-ml-nexus = { workspace = true }
doeff-hy = { workspace = true }
doeff-adr = { workspace = true }
doeff-domain = { workspace = true }
# ADR-DOE-ENFORCE-001 R8: 既定の走行が集める木は、既定の env で import できなければ
# 収集エラーにしかならない。testpaths に載せた packages/*/tests の package は
# workspace source を宣言し、下の dev 群で必ず .venv に入れる。
doeff-google-secret-manager = { workspace = true }
doeff-image = { workspace = true }
doeff-notify = { workspace = true }
doeff-secret = { workspace = true }
doeff-seedream = { workspace = true }
doeff-test-target = { workspace = true }

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
timeout_func_only = false
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
    "docs/adr",
    "packages/doeff-adr/tests",
    "packages/doeff-agentic/tests",
    "packages/doeff-agents/conformance",
    "packages/doeff-agents/tests",
    "packages/doeff-conductor/tests",
    "packages/doeff-docker/tests",
    "packages/doeff-domain/tests",
    "packages/doeff-events/tests",
    "packages/doeff-flow/tests",
    "packages/doeff-gemini/tests",
    "packages/doeff-git/tests",
    "packages/doeff-google-secret-manager/tests",
    "packages/doeff-hy/tests",
    "packages/doeff-image/tests",
    "packages/doeff-ml-nexus/tests",
    "packages/doeff-notify/tests",
    "packages/doeff-openai/tests",
    "packages/doeff-openrouter/tests",
    "packages/doeff-secret/tests",
    "packages/doeff-seedream/tests",
    "packages/doeff-test-target/tests",
    "packages/doeff-time/tests",
    "packages/doeff-traverse/tests",
    "packages/doeff-vm/tests",
    "packages/doeff-vm-core/tests",
]
# ADR-DOE-ENFORCE-001 R8: 取り込み方式は importlib。既定の走行が packages 配下の
# 27 木を集めると、prepend 方式では同名 file(test_effect_handlers.py が 9 本など)が
# 同じ module 名に畳まれて "import file mismatch" になる(2026-09-19 実測 14 件)。
# file を 14 本改名するより、方式を 1 行宣言する方が小さい。
addopts = ["--import-mode=importlib"]
# importlib 方式は test file の dir を sys.path へ入れない。隣の helper module を
# import する木(conformance の harness.py・doeff-domain の fixture 群)は、その
# dir をここで名指す。⚠ これは「集める木の宣言」ではない(それは testpaths)。
pythonpath = [
    "packages/doeff-agents/conformance",
    # 既定の走行では test_agent_launch_invariants.py が(名前順で先に import され
    # るので)この dir を sys.path へ押し込み、fake_io_support が偶然引ける。
    # 順序に頼るのをやめて宣言する — file を名指した走行では現に落ちる。
    "packages/doeff-agents/tests",
    "packages/doeff-domain/tests",
]
# ADR-DOE-ENFORCE-001 R8 の唯一の逃げ口(law every-python-test-file-is-collected の
# 「宣言された暗がり」)。ここに 1 行足すと **2 つのことが同時に**起きる:
#   ① 門(doeff-adr の配線検査)がその path を「集められるべき」から外す
#   ② root conftest.py がこの同じ表を collect_ignore_glob へ渡し、pytest も集めない
# 第 2 の表を作らないこと — 片方だけ書いた日から「集めないのに門が赤い」か
# 「門は緑なのに収集が落ちる」のどちらかになる。
# ⚠ 1 行ごとに理由を書く。理由の無い行は門を黙らせる装置でしかない。
doeff_adr_wiring_exclude = [
    # ── 集めてはいけない側(他の道具の入力・import で走る script)──────────
    # Rust の linter / indexer が cargo test で食わせる見本。わざと違反を含むので
    # pytest が走らせてはいけない(doeff-linter は自分の conftest でも守っている)。
    "packages/doeff-linter/tests/fixtures/*",
    "packages/doeff-indexer/tests/fixtures/*",
    # `uv run python examples/...` で走らせる見本。module 直下に実行文が在るので、
    # 収集した瞬間に workflow が走る。
    "packages/doeff-agentic/examples/*",
    # doeff-test-target の production module。package 名が "test-target" なので
    # src の中の effects/test_effects.py が python_files にたまたま当たるだけ。
    "packages/doeff-test-target/src/*",
    # 複数の interpreter へ `uv run` を撃つ CLI script(pytest の検体ではない)。
    "tools/test_python_versions.py",
    # PyCharm plugin の gutter icon の見本(型註だけで検体を持たない)。
    "ide-plugins/pycharm/test_program_detection.py",
    # ── 腐っている側(#467 が開けて見つけた・直すのは別便)────────────────
    # doeff-flow は package 本体が壊れている: run_workflow が削除済みの
    # default_handlers() を呼び、trace.py が消えた doeff_vm.RunResult を import する。
    # 2026-07-13 の slog 意味論の計画に既知として登記済み(docs/doeff-2026-07-13-
    # slog-semantics-architecture-plan.md:123)で、この repo の誰も import していない。
    # 直すのは package の API 移行(1,110 行)で、木を配線する #467 の射程の外。
    "packages/doeff-flow/tests/*",
    # 対象の doeff_agentic.handlers.production が、doeff-agents から消えた Sleep を
    # import する(26db24dd)。同 module は TmuxAgentHandler を直に握っており
    # CLAUDE.md の agent 認証境界にも触れるので、直しは設計の判断を伴う。
    "packages/doeff-agentic/tests/test_handlers_module.py",
    # 旧 `run(program, handlers=..., env=...)` 時代の検体(29 箇所が is_ok()/.value)。
    # 隣の test_effect_handlers.py と同じ移行が要る。
    "packages/doeff-openrouter/tests/unit/test_structured_llm.py",
]
markers = [
    "e2e: tests that exercise external integrations and may require real API keys",
    "requires_opencode: tests that require a running OpenCode server",
    "slow: tests that take a long time to run",
    "cli: tests for CLI functionality",
    "semgrep: tests that invoke semgrep subprocess",
    "stress: stress tests with high concurrency or iteration count",
    "pre_kleisli_behavior: characterization tests for pre-Kleisli handler behavior",
    "phase3_baseline: characterization tests for VM Kleisli Phase 3 behavior",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "B", "A", "COM", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PLE", "PLR", "PLW", "RUF"]
# ×, ❯, › are legitimate recurring characters, not typos: × is used as a
# typographic multiplication/repeat-count mark in prose comments (e.g.
# "Down×2"), while ❯ / › are VERBATIM terminal prompt-cursor glyphs captured
# from real Claude Code / Codex CLI output in conformance test fixtures
# (packages/doeff-agents/conformance/conformance_agent.py FRAMES) — they must
# stay byte-identical to the real terminal glyphs, never normalized to `>`.
allowed-confusables = ["×", "❯", "›"]
ignore = [
    "E501",  # line too long - handled by formatter
    "COM812",  # trailing comma
    "RET504",  # unnecessary assignment before return
    "PLR2004",  # magic value comparison
    "PLR0913",  # too many arguments
    "PT019",  # fixture without value - pre-existing in tests
    "E701",  # multiple statements on one line - pre-existing in tests
    "RUF005",  # list concatenation style - pre-existing in tests
    "ARG001",  # unused function argument - pre-existing in tests
    "ARG002",  # unused method argument - pre-existing in tests
]
external = ["PINJ"]

[tool.doeff-linter]
disable = ["DOEFF013"]  # Prefer Maybe Monad - intentionally using Optional/None patterns

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "pillow>=11.3.0",
    "beartype>=0.19.0",
    "httpx>=0.25.0",
    "doeff-conductor",
    "doeff-agents",
    "doeff-llm",
    "doeff-gemini",
    "doeff-openai",
    "doeff-openrouter",
    "doeff-vm",
    "doeff-traverse",
    "doeff-time",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3.1",
    "hy>=1.2.0",
    "doeff-hy",
    "doeff-adr",
    "doeff-domain[dogfood]",
    "cloudpickle>=3.0",
    "semgrep>=1.161.0,<2",
    "pre-commit>=4,<5",
    # ADR-DOE-ENFORCE-001 R8: testpaths に載る packages/*/tests が import する
    # workspace package は、1 つ残らず dev 群に居ること。居ない package の木は
    # 「収集はされるが毎回 ImportError」という最悪の形(赤いのに誰も直せない)になる。
    "doeff-docker",
    "doeff-events",
    "doeff-google-secret-manager",
    "doeff-image",
    "doeff-ml-nexus",
    "doeff-notify",
    "doeff-secret",
    "doeff-seedream",
    "doeff-test-target",
]
