[project]
name = "doeff"
version = "0.8.0"
description = "Algebraic effects for Python: code yields effects, and handlers decide what they mean by resuming, throwing into or dropping the continuation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "concurrency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 核の 5 個は 1 つの番号で出し、互いの依存はその 2 桁の系に限る(tests/test_core_packages_version.py)。
dependencies = [
    "doeff-vm>=0.8.0,<0.9",
    "doeff-core-effects>=0.8.0,<0.9",
]

[project.optional-dependencies]
viz = ["phart>=1.1.4"]
# 既定は核の 4 個(doeff・doeff-vm・doeff-core-effects・frozendict)だけ。Hy で書いた effect と handler・cache・CLI の doeff run は
# hy、HTTP の client の handler は http、0.5 までの既定と同じ組は all で足す。中身は doeff-core-effects の同じ名の extra が持つ
# (tests/test_core_install_extras.py・card ki-006338b48f4b)。
hy = ["doeff-core-effects[hy]>=0.8.0,<0.9"]
http = ["doeff-core-effects[http]>=0.8.0,<0.9"]
all = ["doeff-core-effects[all]>=0.8.0,<0.9"]

[project.scripts]
doeff = "doeff.__main__:main"
doeff-effectful-check = "doeff.cli.effectful_check:main"

[project.urls]
Homepage = "https://github.com/proboscis/doeff"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

[build-system]
# license の SPDX の式と license-files(PEP 639)を既定で core metadata に書くのは hatchling 1.27 から(既定の版 2.4)。
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# 頭の / で repo の根に縛る — 縛らない "LICENSE"・"README.md"・"doeff/" は gitignore の形でどの深さの同じ名にも当たり、
# 他の部品の test の data の LICENSE・docs の README・IDE の plugin の source まで sdist に入っていた。
include = ["/doeff", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["doeff"]


[tool.uv]
# Semgrep works with ruamel.yaml's pure-Python implementation. Its pinned C accelerator does not
# build on the repository's default free-threaded Python 3.14, so exclude only that optional path.
exclude-dependencies = [
    "ruamel-yaml-clib",
]

[tool.uv.workspace]
members = ["packages/*"]
# doeff-agentd is a retired Rust crate (efe41e35, #575): git no longer tracks it,
# but checkouts that ever built it keep untracked残骸 (Cargo.lock / target/) in
# packages/doeff-agentd/, which the members glob then picks up as a workspace
# member with no pyproject.toml — breaking resolution for every consumer that
# references this repo as an editable/path dependency (observed fleet-wide
# 2026-08-07: dotfiles agentcli "Workspace member doeff-agentd is missing a
# pyproject.toml"). Excluding it here fixes all such checkouts at once.
exclude = ["packages/doeff-agentd"]

[tool.uv.sources]
doeff-indexer = { workspace = true }
doeff-linter = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-flow = { workspace = true }
doeff-agents = { workspace = true }
doeff-agentic = { workspace = true }
doeff-conductor = { workspace = true }
doeff-git = { workspace = true }
doeff-vm = { workspace = true }
doeff-llm = { workspace = true }
doeff-gemini = { workspace = true }
doeff-openai = { workspace = true }
doeff-openrouter = { workspace = true }
doeff-time = { workspace = true }
doeff-events = { workspace = true }
doeff-traverse = { workspace = true }
doeff-docker = { workspace = true }
doeff-secret = { workspace = true }
doeff-ml-nexus = { workspace = true }
doeff-hy = { workspace = true }
doeff-hy-pytest = { workspace = true }
doeff-adr = { workspace = true }
doeff-domain = { workspace = true }
doeff-system-one = { workspace = true }
doeff-jev = { workspace = true }
doeff-claude-judge = { workspace = true }
doeff-cluster = { workspace = true }
doeff-validation = { workspace = true }
doeff-claude-code = { workspace = true }
doeff-codex = { workspace = true }
doeff-records = { workspace = true }
# Hy は PyPI の版(uv.lock が 1.3.1 に固定)を使い、フォークしない(ADR-DOE-HY-008・agora-redesign #1290)。フォークが持っていた
# 3 つの機能は doeff の側に置いた: テストの索引(doeff-adr item_cache)・macro の変更で古い bytecode を使わない判定
# (doeff_hy_bytecode_guard)・require の呼び出し元の取り方(doeff_hy._light_stack)。

[tool.pytest.ini_options]
timeout = 60
timeout_method = "signal"
timeout_func_only = false
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
    "docs/adr",
    "packages/doeff-adr/tests",
    "packages/doeff-domain/tests",
    "packages/doeff-effect-analyzer/tests/python",
    "packages/doeff-time/tests",
    "packages/doeff-vm/tests",
    "packages/doeff-vm-core/tests",
]
# Hy の検の file の集め手の 1 点(doeff-adr の pytest plugin が rootdir の下のどこでも集める・agora-redesign #2591)。
# test を定義する file は関数ごとの item、定義しない「上から順に実行する script」は file ごと 1 つの item になる。
# 日次の母集団の検(tests/test_daily_test_population.py)も同じこの値を読む — package ごとの conftest.py に条件を写さない。
doeff_hy_test_files = ["test_*.hy"]
# 外す一覧の 1 点: 今 緑でない Hy の検の file を、import せずに理由つきの skip として報告する(日次を赤にしない・
# 外した数は走行の要約の skipped に毎回出る)。形は '<rootdir からの path> | <理由>'。直したら行を消す。
doeff_hy_test_skips = []
markers = [
    "e2e: tests that exercise external integrations and may require real API keys",
    "requires_opencode: tests that require a running OpenCode server",
    "slow: tests that take a long time to run",
    "cli: tests for CLI functionality",
    "semgrep: tests that invoke semgrep subprocess",
    "stress: stress tests with high concurrency or iteration count",
    "pre_kleisli_behavior: characterization tests for pre-Kleisli handler behavior",
    "phase3_baseline: characterization tests for VM Kleisli Phase 3 behavior",
    "realtime: tests whose subject is real time (real threads, a real asyncio loop, a real external process); the semgrep rule doeff-no-sleep-in-tests does not fire inside them and tests/realtime_tests.toml lists each with its reason (agora-redesign #2882)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "B", "A", "COM", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PLE", "PLR", "PLW", "RUF"]
# ×, ❯, › are legitimate recurring characters, not typos: × is used as a
# typographic multiplication/repeat-count mark in prose comments (e.g.
# "Down×2"), while ❯ / › are VERBATIM terminal prompt-cursor glyphs captured
# from real Claude Code / Codex CLI output in conformance test fixtures
# (packages/doeff-agents/conformance/conformance_agent.py FRAMES) — they must
# stay byte-identical to the real terminal glyphs, never normalized to `>`.
allowed-confusables = ["×", "❯", "›"]
ignore = [
    "E501",  # line too long - handled by formatter
    "COM812",  # trailing comma
    "RET504",  # unnecessary assignment before return
    "PLR2004",  # magic value comparison
    "PLR0913",  # too many arguments
    "PT019",  # fixture without value - pre-existing in tests
    "E701",  # multiple statements on one line - pre-existing in tests
    "RUF005",  # list concatenation style - pre-existing in tests
    "ARG001",  # unused function argument - pre-existing in tests
    "ARG002",  # unused method argument - pre-existing in tests
]
external = ["PINJ", "DOEFF"]  # doeff-linter codes in `# noqa: DOEFFnnn`

[tool.ruff.lint.per-file-ignores]
# 型の probe(tools/verify_type_probes.py が核だけの venv で pyright と mypy にかける)は、行の末の印で行ごとに型の道具の結末を
# 照らす。import を 1 つの文にまとめると行の印が混ざり(I001)、誤りが出る事を見る代入は値を使わない(F841)。
"tests/type_probes/*" = ["I001", "F841"]

[tool.doeff-linter]
# DOEFF013: Prefer Maybe Monad - intentionally using Optional/None patterns。
# DOEFF110・119・123・125: 下の定義の書き方の規則の母集団(#2909 で足した)で当たりの在る規則 — #2877 の子(#2912 class・#2922
# doeff-records の defn・#2923 doeff-core-effects の defn・#2913 doeff-hy)が数を 0 にした変更で 1 つずつ外す(先に効かせて main を
# 赤にしない・登録簿に載せて通さない)。minor(123・125)は今は扱わない。
disable = ["DOEFF013", "DOEFF110", "DOEFF119", "DOEFF123", "DOEFF125"]
# 規則の対象の外(agora-redesign #3012 の doeff の分・全部の規則の外 — 業務の code ではない):
#   fixtures = 名が fixtures の dir の全部。道具の検が読む見本の入力(doeff-linter の規則の見本・semgrep の規則の検体・doeff-indexer の
#   検出の見本)と空の __init__.py だけ(2026-10-02 に追跡中の file を見た)。当たりを持つのが役目で、直すと検の見本が壊れる。
# build の道具の環境変数の読み(DOEFF004 だけ)は、ここで file ごと外さず、名指しの module に限って外す — tools/architecture.hy・
#   packages/doeff-indexer/architecture.hy。
#   design・design-checks = 設計の記録の dir(下の [tool.doeff] record-dirs の末尾の名 — docs/design/・docs/design-checks/)。
#   その時点の証拠(測りの script・盲検の A・B が書いた物の写し)で、書き直すと記録が変わる。業務の code でも検でもないので、
#   規則の対象にしない。記録の dir を足したら末尾の名をここへ足す(tests/test_linter_excludes_record_dirs.py が赤にする)。
# linter の exclude は path の部品 1 つ(dir の名か file の名)と一致する時だけ外す — 名に語を含むだけでは外さない(doeff-linter の
# should_exclude・以前は部分一致で、名に build・dist を含む file が黙って判定の外だった)。file を名指して測る入口
# (scripts/hook_finding_baseline.py)は --force-exclude を付けて、名指した file にも当てる。
exclude = ["fixtures", "design", "design-checks"]

# 定義の書き方の規則(DOEFF110 defn・111 deff の理由・112 タグ・119 class・126 素の defk 呼び ほか)の母集団(agora-redesign #2909・
# #2877)。以前はこの節が無く、doeff の package の src に defn・class・素の defk 呼びを足しても鳴らなかった。今効くのは
# DOEFF112(頭の MODULE-TAGS で補う)・DOEFF126(critical)と当たり 0 の規則。
# DOEFF175(critical・登録簿で下げない — 宣言を切り替えた effect の古い分岐。ADR-DOE-CORE-EFFECTS-003 R14 (4))もこの母集団に当たる。
# ADR(docs/adr)と doeff-core-effects の probe の検は、この paths の外(全部の Hy に広げても今は当たり 0 — 2026-10-23 の測り)。本番の code の
# 0 件は packages/doeff-linter/tests/stale_outcome_branch.rs(cargo test)が見る。
[tool.doeff-linter.definitions]
paths = ["packages/doeff-records/src/doeff_records", "packages/doeff-core-effects/doeff_core_effects", "packages/doeff-hy/src/doeff_hy"]

# Hy の program(defk・defp)は壁の時計で眠らない(DOEFF210・ADR-DOE-TIME-001 R1・R2・card ki-3c3d85253c2c)の母集団 = 本体の Hy の
# program の置き場。Python の同じ決まりは semgrep の doeff-no-sleep-in-programs(.semgrep.yaml)が持ち、範囲もそれに合わせる:
# doeff/ と packages/ の本体で、検(tests/)と例(examples/)は外す — Hy の検の眠りは下の DOEFF211(test_sleep の節)が持つ・例は親 card の別の子。
# 上の definitions(定義の書き方の規則群)とは別の節: その規則群をまだ当てていない package(doeff-agents ほか)の program にも、
# この規則だけを当てる。効いている事と当たり 0 件は packages/doeff-linter/tests/program_sleep.rs(cargo test)が見る — この節を消す・
# DOEFF210 を disable に足すと、その検が赤になる。
[tool.doeff-linter.program_sleep]
paths = ["doeff", "packages"]
exclude_parts = ["tests", "examples"]

# Hy の検は、実時間が対象だと名乗らない限り壁の時計で眠らない(DOEFF211・ADR-DOE-TIME-001 R3・card ki-bb3ee40d0af2)の母集団 = 検の
# 置き場。Python の同じ決まりは semgrep の doeff-no-sleep-in-tests(.semgrep.yaml)が持ち、範囲もそれに合わせる: 名が tests の dir の
# 下の Hy の file(検・道具・子の process に渡す job の本体)と、どこに在っても検の名の Hy の file。
# 名乗りは 3 つの形: deftest の meta の `{:marks ["realtime"]}`・素の関数の検の decorator `(defn [pytest.mark.realtime] 名 [] …)`・
# module の最上位の `(val pytestmark pytest.mark.realtime)`。名乗った検は
# 名簿 tests/realtime_tests.toml に理由と一緒に載せる — 名乗りと名簿の [tests]、下の exclude と名簿の [suites] が 1 対 1 である事は
# tests/semgrep/test_realtime_tests_registry.py が見る(この節を読む)。
# exclude の dir の行 = 規則の検体の dir(当たりを持つのが役目・実行しない — 名簿の検の HY_RULE_SAMPLES と同じ 2 行)と、名簿の
# [suites] の dir。file の行 = 検が別の process として起こす独立の script(pytest を import しないので印を名乗れない)— file の行が
# 名乗りの代わりで、名簿の [tests] に同じ path の行を理由と一緒に持つ。
# 効いている事と当たり 0 件は packages/doeff-linter/tests/test_sleep.rs(cargo test)が見る — この節を消す・DOEFF211 を disable に足すと、
# その検が赤になる。
[tool.doeff-linter.test_sleep]
parts = ["tests"]
names = ["test_*.hy", "*_test.hy"]
exclude = [
    "packages/doeff-linter/tests/fixtures",
    "tests/semgrep/fixtures",
    "packages/doeff-agents/conformance",
    "packages/doeff-claude-code/tests/stub_cli/claude.hy",
    "packages/doeff-cluster/tests/fixtures/sleeper.hy",
]

# 設計の記録の dir(その時点の証拠 — 模型・測りの script・検の写しを置く。検の名の file が在っても検ではない)。定義はこの 1 点で、
# 読み手は 2 つ: make test-changed の選び(scripts/run_changed_tests.py の collector_patterns)は、この下の file を名の規則に当たっても
# 検として選ばない / 日次の母集団の検(tests/test_daily_test_population.py)は逆に、この下の検の名の file を赤にして `.py.txt` への
# 改名を求める(除外の行で dir ごと外すと、本物の検を記録にだけ置いても緑になる — 設計検証 lt-9R40Q1PM496VA4HVD1FMXVYW8Z の盲検 A・B)。
# dir は `/` で終える。新しい種類の記録の dir を作る時は、ここへ足す。
[tool.doeff]
record-dirs = ["docs/design/", "docs/design-checks/"]

# 契約の検の固定の組(agora-redesign #2605): 登記の前の入口 `make test-changed`(scripts/run_changed_tests.py)は、変えた file が
# 接頭辞に当たる行の検を、変えた検の file より先に必ず走らせる。stub の突き合わせ・dogfood の登録・母集団の検は module を文字列で
# 持つか木を歩くので、import の逆依存では選べない(t135 の 5 commit は、これが無いと登記の前に赤にならなかった)。
# 読み手は scripts/run_changed_tests.py の read_contract_table の 1 か所 — 書いた検の file が木に無いと止める。
# 行は 2 種類: 契約の組 = prefix と tests・組の要らない package の除外 = prefix と reason(agora-redesign #2658)。
# prefix = 接頭辞(dir は `/` で終える・"" は repo 全体)。tests = path か `path::検の名`(冊の検は 1 本に絞る)。
# package(上の [tool.uv.workspace] の member の dir — `packages/<名>/`)は、どれも組か除外のどちらかを持つ。どちらも無い package は
# tests/test_contract_table_follows_packages.py が名指して赤にする(日次と、下の repo 全体の行の両方で走る)。除外の reason には
# 「その package の公開の形を全体で確かめる検(stub の突き合わせ・公開の名・木を歩く母集団の検)が無い」根拠を書く — 理由の無い除外・
# package でない接頭辞の除外は読み手が止める。そういう検を足した時は除外の行を組の行に書き換える。
# 註の秒は 1 file ずつ走らせた壁時計(起動を含む・2026-10-02 zeus・合計の上限は 60 秒)。行を足す時も 1 file ずつ測って書く。
[[tool.doeff.contract-tests]]
prefix = "packages/doeff-core-effects/"
tests = [
    "packages/doeff-core-effects/tests/test_hy_module_stubs.py",  # 2.4 秒 — .hy と隣の .pyi の名・欄・引数
    "packages/doeff-domain/tests/test_domain_dogfood.py",  # 2.8 秒 — core-effects の語彙の domain 宣言と孤児の走査
    "docs/adr/defadr_doeff_domain_001_vocabulary_cohesion.hy::test_adr_doe_domain_001_dogfood_core_effects_green",  # 2.2 秒
    # README の例(多くは core-effects の handler の使い方)を子の interpreter で走らせる — 例は file に書いて走らせるので、import の
    # 逆依存では選ばれない(並行の例は writer が state を要るようになった後も落ちたままだった・card ki-68cd4c8effcd)
    "tests/test_readme_examples.py::test_readme_example_runs_and_prints_what_it_states",  # 4 本の call で 1.6 秒(load 約 70 の下)
    "tests/test_public_api_known_violations.py::test_public_api_outside_effects_and_handlers_is_in_the_known_table[doeff-core-effects]",  # 3.3 秒 — 公開名のうち effect と handler の外の物が既知の表と同じ
]

# README の囲みを書き換えた便は、例を走らせて印字を注記と比べる検と、囲みの言葉・入口の例の節の検を払う(card ki-68cd4c8effcd)。
# 頭の GIF の画像の行を消す・指す先を変える便も、GIF の検が名指す。
[[tool.doeff.contract-tests]]
prefix = "README.md"
tests = [
    "tests/test_readme_examples.py",  # 9.7 秒(10 本・子 7 本・pytest の計・枠の待ちを除く・load 約 70 の下)
    "tests/test_readme_demo.py",  # 0.6 秒(4 本・子なし・pytest の計・枠の待ちを除く・load 約 40 の下)
    # README の link が木で解ける事(下の docs/ の行と同じ検)。7.1 秒(1 本・子なし・pytest の計・load 約 86 の下)
    "tests/test_check_links.py::test_repo_links_resolve_in_the_tree",
    # 節 Type checking の型を書いた例が pyright の strict と mypy --strict で error 0 である事(card ki-92c3133da46d — 下の
    # 01 章の行と同じ検)。16 秒(4 本・子 2 本・pytest の計・2026-10-17 会話の Pod)
    "tests/test_docs_typed_examples.py",
    # 核だけの venv の道具が確かめる LLM の agent の例を、README が指したままでいる事(下の docs/index.md の行と同じ検)
    "tests/test_verify_core_install.py::test_the_pages_that_say_the_llm_example_needs_only_doeff_link_to_it",
    # README が handler を古い handler(fn)(program) で書かない事(下の docs/ の行と同じ検・card ki-6dcc457d8917)
    "tests/test_docs_current_handler_style.py",
]

# docs の page を書き換えた便(改名・消す・見出しを書き換える)は、README・docs・packages/*/README.md の repo の中の link が
