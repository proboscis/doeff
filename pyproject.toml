[dependency-groups]
dev = [
    # make sync builds the Rust VM with maturin — declared here so every machine gets it
    # from the lock, not from a tool installed by hand.
    "maturin>=1.5,<2",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "pillow>=11.3.0",
    "beartype>=0.19.0",
    "httpx>=0.25.0",
    "doeff-llm",
    "doeff-gemini",
    "doeff-openai",
    "doeff-openrouter",
    "doeff-vm",
    "doeff-traverse",
    # Listed directly so their tests run in the dev environment (no other dev dependency pulls them in).
    "doeff-flow",
    "doeff-git",
    "doeff-time",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3.1",
    # Runs the real PostgreSQL checks (the same psycopg as doeff-core-effects' postgres extra and doeff-records' pg extra) in the daily run and local dev
    # environments too — even if a check starts its own throwaway PostgreSQL, without psycopg it skips or fails to import.
    "psycopg>=3.1",
    # Runs the real Redis checks (the same client as doeff-events' redis extra) in the daily run and local dev environments too — without the client,
    # checks against the real server fail at import even when the redis-server executable exists.
    "redis>=5.0",
    # Runs the OS file-watching checks (the same library as doeff-events' files extra — #3977) in the daily run and local dev environments too.
    "watchfiles>=1.0",
    # Evaluates the CEL of doeff-cluster's ValidatingAdmissionPolicy declarations without an API server
    # (packages/doeff-cluster/tests/test_worker_account_pod_admission.py — ADR-DOE-CLUSTER-005). Held below 0.4: from 0.4 it needs
    # google-re2, which has no wheel for the free-threaded 3.14t of .python-version and does not build without abseil.
    "cel-python>=0.3.0,<0.4",
    "hy>=1.2.0",
    "doeff-hy",
    # pydantic, read by the test comparing the in-house defwire decoder with pydantic (packages/doeff-hy/tests/test_wire_parity.py).
    "doeff-hy[parity]",
    "doeff-adr",
    "doeff-domain[dogfood]",
    "doeff-system-one",
    "doeff-jev",
    "doeff-cluster",
    "doeff-validation",
    "doeff-records",
    "doeff-stream",
    "doeff-docker",
    "doeff-secret",
    "doeff-ml-nexus",
    "cloudpickle>=3.0",
    "semgrep>=1.161.0,<2",
    "pre-commit>=4,<5",
    # The after-write linter (hook doeff-lint-after-write) uses .venv/bin/doeff-linter of the written file's repo. Conversations in agora Pods have
    # neither a dev build location nor a binary on PATH, so it is a dev dependency installed by make sync — without it doeff's Hy files go unchecked.
    "doeff-linter",
    # The public API inventory (tools/public_api_inventory.py) reads doeff-indexer's entry point by import (for packages with a Rust extension, the
    # extension's names cannot be counted textually), and the doeff run discovery checks answer the FindSymbols effect with the Rust indexer.
    "doeff-indexer",
    # The check that public API types work under mypy as well as pyright (tests/test_handler_installer_typing.py — users
    # check with either tool).
    "mypy>=2.4.0",
]
