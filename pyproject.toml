reason = "他の検の的(fixture)の package で、自分の公開の形を確かめる検は無い — 的を写して解析する使い手は doeff-effect-analyzer の Rust の検(cargo の範囲・この表に載せられない)"

[[tool.doeff.contract-tests]]
prefix = "packages/doeff-time/"
reason = "stub も __all__ も無く、公開の名を確かめる検も無い — 3 つの時計が同じ deftest を通る test_time_contract.hy は振る舞いの検で、doeff_time を import するので逆依存が選ぶ"

[[tool.doeff.contract-tests]]
prefix = "packages/doeff-validation/"
reason = "stub も __all__ も無く、公開の名を確かめる検も無い — 検は Python の API と Hy の macro の展開の誤りの単体だけ"

[dependency-groups]
dev = [
    # make sync builds the Rust VM with maturin — declared here so every machine gets it
    # from the lock, not from a tool installed by hand (agora-redesign#645 item 7).
    "maturin>=1.5,<2",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "pillow>=11.3.0",
    "beartype>=0.19.0",
    "httpx>=0.25.0",
    "doeff-conductor",
    "doeff-agents",
    "doeff-llm",
    "doeff-gemini",
    "doeff-openai",
    "doeff-openrouter",
    "doeff-vm",
    "doeff-traverse",
    "doeff-time",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3.1",
    # 実 PostgreSQL の検(doeff-core-effects の extra postgres・doeff-records の extra pg と同じ psycopg)を、日次と手元の dev の環境でも
    # 走らせる — 検が使い捨ての PostgreSQL を自分で立てても、psycopg が無いと skip か import の失敗になる(agora-redesign #2830)。
    "psycopg>=3.1",
    # 実 Redis の検(doeff-events の extra redis と同じ client)を、日次と手元の dev の環境でも走らせる — client が無いと、redis-server の
    # 実行 file が在っても本物を相手にする検が import で落ちる(agora-redesign #3850)。
    "redis>=5.0",
    # OS のファイル監視の検(doeff-events の extra files と同じ library — #3977)を、日次と手元の dev の環境でも走らせる。
    "watchfiles>=1.0",
    "hy>=1.2.0",
    "doeff-hy",
    "doeff-adr",
    "doeff-domain[dogfood]",
    "doeff-system-one",
    "doeff-jev",
    "doeff-cluster",
    "doeff-validation",
    "doeff-claude-code",
    "doeff-codex",
    "doeff-records",
    "doeff-docker",
    "doeff-ml-nexus",
    "cloudpickle>=3.0",
    "semgrep>=1.161.0,<2",
    "pre-commit>=4,<5",
    # 書いた後の linter(hook doeff-lint-after-write)は書いた file の repo の .venv/bin/doeff-linter を引く。agora の Pod の会話には
    # 開発版の置き場も PATH の binary も無いので、dev の依存に置いて make sync で入れる — 無いと doeff の Hy の file が検査されない。
    "doeff-linter",
]
