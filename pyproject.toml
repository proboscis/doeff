[project]
name = "doeff"
version = "0.8.0"
description = "Algebraic effects for Python: code yields effects, and handlers decide what they mean by resuming, throwing into or dropping the continuation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Proboscis", email = "3684241+proboscis@users.noreply.github.com"}
]
keywords = ["algebraic-effects", "effects", "effect-handlers", "handlers", "continuations", "concurrency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# The 5 core packages ship under one version number, and their mutual dependencies stay within that 2-digit series (tests/test_core_packages_version.py).
dependencies = [
    "doeff-vm>=0.8.0,<0.9",
    "doeff-core-effects>=0.8.0,<0.9",
]

[project.optional-dependencies]
viz = ["phart>=1.1.4"]
# The default installs only the 4 core packages (doeff, doeff-vm, doeff-core-effects, frozendict). Add `hy` for effects and handlers
# written in Hy, the cache and the `doeff run` CLI; `http` for the HTTP client handler; `all` for the same set as the default up to 0.5.
# The contents are held by the extras of the same name in doeff-core-effects (tests/test_core_install_extras.py).
hy = ["doeff-core-effects[hy]>=0.8.0,<0.9"]
http = ["doeff-core-effects[http]>=0.8.0,<0.9"]
all = ["doeff-core-effects[all]>=0.8.0,<0.9"]

[project.scripts]
doeff = "doeff.__main__:main"
doeff-effectful-check = "doeff.cli.effectful_check:main"

[project.urls]
Homepage = "https://github.com/proboscis/doeff"
Repository = "https://github.com/proboscis/doeff"
Issues = "https://github.com/proboscis/doeff/issues"
Documentation = "https://github.com/proboscis/doeff/blob/main/docs/index.md"
Changelog = "https://github.com/proboscis/doeff/blob/main/CHANGELOG.md"

[build-system]
# hatchling writes the SPDX license expression and license-files (PEP 639) into core metadata by default from 1.27 on (default metadata version 2.4).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The leading / anchors each entry at the repo root — unanchored "LICENSE", "README.md" and "doeff/" match the same name at any depth
# (gitignore style), which pulled other packages' test-data LICENSE files, docs READMEs and IDE plugin sources into the sdist.
include = ["/doeff", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["doeff"]


[tool.uv]
# Semgrep works with ruamel.yaml's pure-Python implementation. Its pinned C accelerator does not
# build on the repository's default free-threaded Python 3.14, so exclude only that optional path.
exclude-dependencies = [
    "ruamel-yaml-clib",
]

[tool.uv.workspace]
members = ["packages/*"]
# doeff-agentd is a retired Rust crate (efe41e35, #575): git no longer tracks it,
# but checkouts that ever built it keep untracked leftovers (Cargo.lock / target/) in
# packages/doeff-agentd/, which the members glob then picks up as a workspace
# member with no pyproject.toml — breaking resolution for every consumer that
# references this repo as an editable/path dependency (observed fleet-wide
# 2026-08-07: dotfiles agentcli "Workspace member doeff-agentd is missing a
# pyproject.toml"). Excluding it here fixes all such checkouts at once.
exclude = ["packages/doeff-agentd"]

[tool.uv.sources]
doeff-indexer = { workspace = true }
doeff-linter = { workspace = true }
doeff-core-effects = { workspace = true }
doeff-flow = { workspace = true }
doeff-git = { workspace = true }
doeff-vm = { workspace = true }
doeff-llm = { workspace = true }
doeff-gemini = { workspace = true }
doeff-openai = { workspace = true }
doeff-openrouter = { workspace = true }
doeff-time = { workspace = true }
doeff-events = { workspace = true }
doeff-stream = { workspace = true }
doeff-traverse = { workspace = true }
doeff-docker = { workspace = true }
doeff-secret = { workspace = true }
doeff-ml-nexus = { workspace = true }
doeff-hy = { workspace = true }
doeff-hy-pytest = { workspace = true }
doeff-adr = { workspace = true }
doeff-domain = { workspace = true }
doeff-system-one = { workspace = true }
doeff-jev = { workspace = true }
doeff-cluster = { workspace = true }
doeff-validation = { workspace = true }
doeff-records = { workspace = true }
# Hy comes from PyPI (pinned to 1.3.1 by uv.lock) and is not forked (ADR-DOE-HY-008). The 3 features the fork had
# live on the doeff side: the test index (doeff-adr item_cache), the check that refuses stale bytecode after a macro change
# (doeff_hy_bytecode_guard), and the lookup of a require's caller (doeff_hy._light_stack).

[tool.pytest.ini_options]
timeout = 60
timeout_method = "signal"
timeout_func_only = false
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
    "docs/adr",
    "packages/doeff-adr/tests",
    "packages/doeff-domain/tests",
    "packages/doeff-effect-analyzer/tests/python",
    "packages/doeff-time/tests",
    "packages/doeff-vm/tests",
    "packages/doeff-vm-core/tests",
]
# The single place that defines which Hy test files are collected (the doeff-adr pytest plugin collects them anywhere under rootdir).
# A file that defines tests yields one item per function; a file that defines none (a "top-to-bottom script") yields one item for the file.
# The daily population check (tests/test_daily_test_population.py) reads this same value — do not copy the condition into per-package conftest.py files.
doeff_hy_test_files = ["test_*.hy"]
# The single skip list: Hy test files that are not green now are reported as skips with a reason, without importing them (keeps the daily run
# from going red; the skipped count appears in every run summary). Format: '<path from rootdir> | <reason>'. Remove the line once fixed.
doeff_hy_test_skips = []
markers = [
    "e2e: tests that exercise external integrations and may require real API keys",
    "requires_opencode: tests that require a running OpenCode server",
    "slow: tests that take a long time to run",
    "cli: tests for CLI functionality",
    "semgrep: tests that invoke semgrep subprocess",
    "stress: stress tests with high concurrency or iteration count",
    "pre_kleisli_behavior: characterization tests for pre-Kleisli handler behavior",
    "phase3_baseline: characterization tests for VM Kleisli Phase 3 behavior",
    "realtime: tests whose subject is real time (real threads, a real asyncio loop, a real external process); the semgrep rule doeff-no-sleep-in-tests does not fire inside them and tests/realtime_tests.toml lists each with its reason",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "B", "A", "COM", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PLE", "PLR", "PLW", "RUF"]
# × is a legitimate recurring character, not a typo: it is used as a
# typographic multiplication/repeat-count mark in prose comments (e.g. "Down×2").
allowed-confusables = ["×"]
ignore = [
    "E501",  # line too long - handled by formatter
    "COM812",  # trailing comma
    "RET504",  # unnecessary assignment before return
    "PLR2004",  # magic value comparison
    "PLR0913",  # too many arguments
    "PT019",  # fixture without value - pre-existing in tests
    "E701",  # multiple statements on one line - pre-existing in tests
    "RUF005",  # list concatenation style - pre-existing in tests
    "ARG001",  # unused function argument - pre-existing in tests
    "ARG002",  # unused method argument - pre-existing in tests
]
external = ["PINJ", "DOEFF"]  # doeff-linter codes in `# noqa: DOEFFnnn`

[tool.ruff.lint.per-file-ignores]
# Type probes (tools/verify_type_probes.py runs pyright and mypy on them in a core-only venv) check each line's type-tool outcome against a
# marker at the end of the line. Merging imports into one statement mixes up the markers (I001), and assignments that exist to provoke an error don't use the value (F841).
"tests/type_probes/*" = ["I001", "F841"]

[tool.doeff-linter]
# DOEFF013: Prefer Maybe Monad - intentionally using Optional/None patterns.
# DOEFF110, 119, 123, 125: rules with hits in the definition-style rule population below (added in #2909) — each is removed from this list by the
# child of #2877 that brings its count to 0 (#2912 class, #2922 doeff-records defn, #2923 doeff-core-effects defn, #2913 doeff-hy). Enabling them first
# would turn main red, and they are not passed by listing them in the registry. The minor rules (123, 125) are out of scope for now.
disable = ["DOEFF013", "DOEFF110", "DOEFF119", "DOEFF123", "DOEFF125"]
# Outside every rule (doeff's own entries — outside all rules; not application code):
#   fixtures = every dir named fixtures. Only sample inputs read by tool checks (doeff-linter rule samples, semgrep rule test cases, doeff-indexer
#   detection samples) and empty __init__.py files (tracked files inspected 2026-10-02). Having hits is their job; fixing them breaks the samples.
# Reads of build-tool environment variables (DOEFF004 only) are not excluded per file here, only for named modules — tools/architecture.hy,
#   packages/doeff-indexer/architecture.hy.
# When you create a design-record dir ([tool.doeff] record-dirs below), add its last path part here too (tests/test_linter_excludes_record_dirs.py fails otherwise).
# A linter exclude only matches when it equals one path part (a dir or file name) — a name merely containing the word is not excluded (doeff-linter
# should_exclude; it used to match substrings, silently skipping files whose names contained build or dist). Entry points that check named files
# (scripts/hook_finding_baseline.py) pass --force-exclude so the excludes apply to named files too.
exclude = ["fixtures"]

# Population for the definition-style rules (DOEFF110 defn, 111 deff reason, 112 tags, 119 class, 126 bare defk call, and others).
# This section used to be missing, so adding defn, class or bare defk calls to doeff package src raised nothing. Currently in effect:
# DOEFF112 (filled by the MODULE-TAGS header), DOEFF126 (critical), and the rules with 0 hits.
# DOEFF175 (critical; not lowered through the registry — stale branches for effects whose declaration was switched, ADR-DOE-CORE-EFFECTS-003 R14 (4)) also applies to this population.
# ADRs (docs/adr) and the doeff-core-effects probe checks are outside these paths (0 hits even across all Hy — measured 2026-10-23). Zero hits in production
# code are checked by packages/doeff-linter/tests/stale_outcome_branch.rs (cargo test).
[tool.doeff-linter.definitions]
paths = ["packages/doeff-records/src/doeff_records", "packages/doeff-core-effects/doeff_core_effects", "packages/doeff-hy/src/doeff_hy"]

# Hy programs (defk, defp) do not sleep on the wall clock (DOEFF210, ADR-DOE-TIME-001 R1, R2); the population = where the main Hy
# programs live. The same rule for Python is the semgrep rule doeff-no-sleep-in-programs (.semgrep.yaml), and the scope matches it:
# the main code under doeff/ and packages/, excluding tests (tests/) and examples (examples/) — sleeps in Hy tests are DOEFF211 (the test_sleep section below); examples are another child of the parent card.
# A separate section from definitions above (the definition-style rules): this rule alone also applies to programs in packages that do not yet
# get those rules. That it is in effect with 0 hits is checked by packages/doeff-linter/tests/program_sleep.rs (cargo test) — deleting this section
# or adding DOEFF210 to disable turns that check red.
[tool.doeff-linter.program_sleep]
paths = ["doeff", "packages"]
exclude_parts = ["tests", "examples"]

# Hy tests do not sleep on the wall clock unless they declare real time as their subject (DOEFF211, ADR-DOE-TIME-001 R3); the population = where tests
# live. The same rule for Python is the semgrep rule doeff-no-sleep-in-tests (.semgrep.yaml), and the scope matches it: Hy files under a dir named
# tests (tests, tools, and job bodies passed to child processes), and Hy files with a test name anywhere.
# Three forms of declaration: deftest meta `{:marks ["realtime"]}`, the decorator of a plain function test `(defn [pytest.mark.realtime] name [] …)`,
# and module-level `(val pytestmark pytest.mark.realtime)`. A declaring test is listed with its reason in the registry
# tests/realtime_tests.toml — that the declarations match the registry's [tests], and the exclude below matches the registry's [suites], one to one, is
# checked by tests/semgrep/test_realtime_tests_registry.py (it reads this section).
# Dir lines in exclude = rule sample dirs (having hits is their job; never executed — the same 2 lines as HY_RULE_SAMPLES in the registry check) and the
# registry's [suites] dirs. File lines = standalone scripts that a check starts as a separate process (they do not import pytest, so cannot declare the
# mark) — the file line stands in for the declaration, and the registry's [tests] has a line with the same path and a reason.
# That it is in effect with 0 hits is checked by packages/doeff-linter/tests/test_sleep.rs (cargo test) — deleting this section or adding DOEFF211 to
# disable turns that check red.
[tool.doeff-linter.test_sleep]
parts = ["tests"]
names = ["test_*.hy", "*_test.hy"]
exclude = [
    "packages/doeff-linter/tests/fixtures",
    "tests/semgrep/fixtures",
    "packages/doeff-cluster/tests/fixtures/sleeper.hy",
]

# Design-record dirs (evidence at a point in time — models, measurement scripts, copies of checks; a test-named file here is not a test). Defined only here;
# 2 readers: make test-changed's selection (collector_patterns in scripts/run_changed_tests.py) never selects files under these as tests even if names match,
# while the daily population check (tests/test_daily_test_population.py) conversely fails on test-named files under them and asks for a rename to `.py.txt`
# (excluding the whole dir would let a real test placed only in a record stay green — blind design-validation cases A and B).
# End each dir with `/`. Add new kinds of record dirs here. The tree currently has no record dirs.
[tool.doeff]
record-dirs = []

# Fixed sets of contract checks: the pre-registration entry `make test-changed` (scripts/run_changed_tests.py) always runs the checks of every line
# whose prefix matches a changed file, before the changed test files. Stub matching, dogfood registration and population checks hold modules as strings
# or walk the tree, so import reverse-dependencies cannot select them (without this, the 5 commits of t135 would not have gone red before registration).
# The only reader is read_contract_table in scripts/run_changed_tests.py — it stops if a listed test file is missing from the tree.
# Two kinds of lines: a contract set = prefix and tests; an exclusion for a package that needs no set = prefix and reason.
# prefix = path prefix (dirs end with `/`; "" is the whole repo). tests = a path or `path::test name` (narrow a parametrized check to one case).
# Every package (a member dir of [tool.uv.workspace] above — `packages/<name>/`) has either a set or an exclusion. A package with neither is
# named and failed by tests/test_contract_table_follows_packages.py (run both daily and by the whole-repo line below). An exclusion's reason must
# state why there is "no check that verifies the package's public shape as a whole (stub matching, public names, tree-walking population checks)" —
# the reader stops exclusions without a reason and exclusions of prefixes that are not packages. When such a check is added, rewrite the exclusion as a set.
# Seconds in comments are wall clock running one file at a time (including startup; 2026-10-02 on zeus; total budget 60 s). Measure each file the same way when adding lines.
[[tool.doeff.contract-tests]]
prefix = "packages/doeff-core-effects/"
tests = [
    "packages/doeff-core-effects/tests/test_hy_module_stubs.py",  # 2.4 s — names, fields and arguments of each .hy and its sibling .pyi
    "packages/doeff-domain/tests/test_domain_dogfood.py",  # 2.8 s — domain declarations of the core-effects vocabulary and the orphan scan
    "docs/adr/defadr_doeff_domain_001_vocabulary_cohesion.hy::test_adr_doe_domain_001_dogfood_core_effects_green",  # 2.2 s
    # Runs the README examples (mostly core-effects handler usage) in a child interpreter — the examples are written to files and run, so import
    # reverse-dependencies do not select them (the concurrency example stayed broken after writer came to need state)
    "tests/test_readme_examples.py::test_readme_example_runs_and_prints_what_it_states",  # 1.6 s for 4 calls (load about 70)
    "tests/test_public_api_known_violations.py::test_public_api_outside_effects_and_handlers_is_in_the_known_table[doeff-core-effects]",  # 3.3 s — the public names other than effects and handlers match the known table
]

# Changes that rewrite README code blocks pay for the check that runs the examples and compares output with the annotations, and the checks on block wording and the entry-example section.
# Changes that delete the header GIF image line or change its target are also named by the GIF check.
[[tool.doeff.contract-tests]]
prefix = "README.md"
tests = [
    "tests/test_readme_examples.py",  # 9.7 s (10 tests, 7 children, pytest time, excluding slot wait, load about 70)
    "tests/test_readme_demo.py",  # 0.6 s (4 tests, no children, pytest time, excluding slot wait, load about 40)
    # README links resolve in the tree (same check as the docs/ line below). 7.1 s (1 test, no children, pytest time, load about 86)
    "tests/test_check_links.py::test_repo_links_resolve_in_the_tree",
    # The typed examples of the Type checking section give 0 errors under pyright strict and mypy --strict (same check as the
    # chapter 01 line below). 16 s (4 tests, 2 children, pytest time, 2026-10-17 conversation Pod)
    "tests/test_docs_typed_examples.py",
    # README keeps pointing at the LLM agent example that the core-only venv tool verifies (same check as the docs/index.md line below)
    "tests/test_verify_core_install.py::test_the_pages_that_say_the_llm_example_needs_only_doeff_link_to_it",
    # README does not write handlers in the old handler(fn)(program) form (same check as the docs/ line below)
    "tests/test_docs_current_handler_style.py",
]

# Changes to docs pages (rename, delete, rewrite headings) pay for the check that in-repo links of README, docs and packages/*/README.md
# resolve in the tree. It reads markdown by path, so import reverse-dependencies do not select it. The per-page docs lines (below) each
# pay for that page's example checks; this line covers all pages. 7.1 s (1 test, no children, pytest time; wall clock including startup 22 s;
# load about 86; 2026-10-17 conversation Pod). Changes to packages/*/README.md are named by this check in main's CI (the Python Compatibility job runs the
# root tests).
[[tool.doeff.contract-tests]]
prefix = "docs/"
tests = [
    "tests/test_check_links.py::test_repo_links_resolve_in_the_tree",
    # docs pages write handlers only in the current style (a def with @handler applied to a program), with 0 uses of the old
    # handler(fn)(program). Reads markdown by path.
    "tests/test_docs_current_handler_style.py",
]

# Changes to the link-check tool (tools/check_links.py — standard library only, runs outside the workspace too) pay for all of the tool's checks.
# The checks read the tool by path, so import reverse-dependencies do not select them.
[[tool.doeff.contract-tests]]
prefix = "tools/check_links.py"
tests = ["tests/test_check_links.py"]

# Changes to the subpackage public API inventory tool (tools/public_api_inventory.py — imports each package in a child process and tags names with kinds)
# pay for all of the tool's checks. The checks read the tool by path, so import reverse-dependencies do not select them.
[[tool.doeff.contract-tests]]
prefix = "tools/public_api_inventory.py"
tests = [
    "tests/test_public_api_inventory.py",
    # Failure cases where matching against the known table, as the tool reads it, returns red or green (3 tests reading throwaway packages in child
    # processes). The 39 per-package cases take over 1 minute in total, so they are not selected — if the tool's reading drifts from the table, the daily run names it
    "tests/test_public_api_known_violations.py::test_an_added_outlier_turns_red_and_removing_it_turns_green",
    "tests/test_public_api_known_violations.py::test_a_fixed_name_left_in_the_table_turns_red",
    "tests/test_public_api_known_violations.py::test_an_outlier_added_with_a_reason_line_is_green",
]

# Changes to the known table of public-API deviations (tests/data/public_api_known_violations.json) pay for the checks on the table's shape and that it only shrinks.
# The checks read the table by path, so import reverse-dependencies do not select them. The one case for a package changed together with the table is selected
# by that package's line.
[[tool.doeff.contract-tests]]
prefix = "tests/data/public_api_known_violations.json"
tests = [
    "tests/test_public_api_known_violations.py::test_the_known_table_has_one_well_formed_entry_per_package_dir",
    "tests/test_public_api_known_violations.py::test_the_known_table_only_shrinks_from_its_first_version",
]

# Changes to the README header GIF and the example files shown in it (tools/readme_demo/digest.py and handlers.py) pay for checks that the example runs on current doeff,
# that the GIF's 4 lines give the same answer as `python -m doeff demo`, and that the GIF stays within the target size. The examples are read by path, so import
# reverse-dependencies do not select them (changes to doeff/cli/demo.py are selected by reverse-dependency, since the check imports demo).
[[tool.doeff.contract-tests]]
prefix = "tools/readme_demo/"
tests = ["tests/test_readme_demo.py"]

[[tool.doeff.contract-tests]]
prefix = "images/readme-demo.gif"
tests = ["tests/test_readme_demo.py"]

# Changes to the LLM agent example that README and docs/index.md say runs with just `pip install doeff`, and to its example pytest check, pay for: the check that the
# example runs and prints its answer; the check that the example test passes in a dir with only the example's 2 files copied; and the check of how the core-only
# venv tool judges that example. All read the example by path, so import reverse-dependencies do not select them. Checks of other examples under examples/
# (llm_multi_provider_stacking, marked slow — the openai SDK import takes about 25 s) are not selected. 14 s (64 tests, 2 children, pytest time;
# wall clock including startup 76 s; load about 100; 2026-10-17 conversation Pod).
[[tool.doeff.contract-tests]]
prefix = "examples/llm_agent.py"
tests = [
    "tests/test_examples_run.py::test_example_runs_and_prints_its_results[llm_agent.py]",
    "tests/test_examples_run.py::test_example_tests_pass_with_only_the_example_files",
    "tests/test_verify_core_install.py",
]

[[tool.doeff.contract-tests]]
prefix = "examples/test_llm_agent.py"
tests = [
    "tests/test_examples_run.py::test_example_tests_pass_with_only_the_example_files",
    "tests/test_verify_core_install.py",
]

# Changes to the HTTP API example README points to (examples/github_repo/ — a program calling GitHub through doeff[http] handlers, and an example pytest check
# with fake handlers) pay for the check that runs the script's production handler set against a local fake API in a child, and the check that runs README's
# command `pytest examples/github_repo` in a child outside pytest without plugins. Both run the example by path, so import reverse-dependencies do not
# select them. Checks of other examples under examples/ are not selected.
[[tool.doeff.contract-tests]]
prefix = "examples/github_repo/"
tests = [
    "tests/test_examples_run.py::test_github_repo_example_runs_its_live_handlers_against_a_local_api",
    "tests/test_examples_run.py::test_github_repo_example_tests_run_with_pytest_alone",
]

# Changes to the getting-started docs pages (the index and chapters 01–05) pay for the check that runs their examples and compares output with the annotations,
# and the check of the code-block conventions. The examples are written to files and run, so import reverse-dependencies do not select them. When adding a page,
# add it both to the check's ENTRY_PATH and here (if only one, test_contract_table_selects_this_check_for_each_entry_page names it).
# 38 s (79 tests, 64 children, wall clock including startup, 2026-10-17 conversation Pod).
[[tool.doeff.contract-tests]]
prefix = "docs/index.md"
tests = [
    "tests/test_docs_entry_path_examples.py",
    # The index keeps pointing at the LLM agent example that the core-only venv tool verifies (same check as the README line above)
    "tests/test_verify_core_install.py::test_the_pages_that_say_the_llm_example_needs_only_doeff_link_to_it",
]

# Chapter 01, besides the getting-started checks, pays for the check that the typed examples in the Adding Types section give 0 errors under type checking
# (same check as the README line above).
[[tool.doeff.contract-tests]]
prefix = "docs/01-getting-started.md"
tests = ["tests/test_docs_entry_path_examples.py", "tests/test_docs_typed_examples.py"]

# Chapter 02, besides the getting-started checks, pays for the check that the Handler Contract section's examples of a return without Resume and a handler
# without Pass stay covered (same check as the chapter 13 line below).
[[tool.doeff.contract-tests]]
prefix = "docs/02-core-concepts.md"
tests = ["tests/test_docs_entry_path_examples.py", "tests/test_docs_handler_endings.py"]

[[tool.doeff.contract-tests]]
prefix = "docs/03-basic-effects.md"
tests = ["tests/test_docs_entry_path_examples.py"]

[[tool.doeff.contract-tests]]
prefix = "docs/04-async-effects.md"
tests = ["tests/test_docs_entry_path_examples.py"]

[[tool.doeff.contract-tests]]
