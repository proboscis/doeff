# Builds only the 4 core packages (doeff, doeff-vm, doeff-core-effects, frozendict) from main into a fresh venv, runs pyright and
# mypy on the type probes (tests/type_probes/) and the README Python examples, and checks that the lines with errors match the
# probes' markers (initiative doeff-publish, milestone 12). The work is done by tools/verify_type_probes.py — fixed gaps in type
# reporting must not come back under the install users do, and markers must be updated when an open gap gets filled. Type tool
# versions are those in uv.lock. Python is 3.11 and 3.14, the two ends of requires-python (plain 3.14, like the macOS and Windows
# job). doeff-vm is built from source, not taken as a PyPI wheel (build backend tools/doeff_cargo_backend.py — needs Rust).
name: Type probes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-probes:
    name: type probes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Like the core-only install check (core-only-install in python-compatibility.yml), use only the uv-managed Python.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check the type probes and the README examples in a fresh core-only venv
        run: uv run --no-project python tools/verify_type_probes.py --python ${{ matrix.python }}
