# doeff の Rust の package の wheel を、機体の外の置き場(公開の release rust-wheels)へ上げる — 置き場の書き手は この workflow だけ
# (ADR-DOE-BUILD-001 R5 の追補・設計 docs/design/rust-wheel-distribution)。読み手は build の口
# tools/doeff_cargo_backend.py(手元の保存先に無い鍵の wheel を、組む前に取る)。組むのは使う側の venv と同じ Python 3.14t・Linux x86_64・
# ubuntu-24.04(glibc 2.39 — 鍵に libc の版が入るので、違う glibc の機体は取らずに手元で組む)。
name: Rust wheels to the build store

on:
  push:
    branches: [main]
    paths:
      - "packages/doeff-vm/**"
      - "packages/doeff-linter/**"
      - "packages/doeff-indexer/**"
      - "packages/doeff-effect-analyzer/**"
      - "tools/doeff_cargo_backend.py"
      - "tools/rust_wheel_release.py"
      - ".github/workflows/rust-wheels.yml"
  workflow_dispatch:

permissions:
  contents: write

# 同じ鍵を 2 つの走りが同時に上げない(後の走りは前の走りが上げた asset を取って終わる)。
concurrency:
  group: rust-wheels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build through the build entry and upload what it built
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.14t python tools/rust_wheel_release.py --tag rust-wheels --python 3.14t
          packages/doeff-vm packages/doeff-linter packages/doeff-indexer packages/doeff-effect-analyzer
