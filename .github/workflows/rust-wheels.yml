# Uploads wheels of doeff's Rust packages to off-machine storage (the public release rust-wheels) — this workflow is the only writer
# of that storage (addendum to ADR-DOE-BUILD-001 R5; design docs/design/rust-wheel-distribution). The reader is the build backend
# tools/doeff_cargo_backend.py (before building, it fetches wheels whose key is not in the local cache). Builds target the same
# Python 3.14t as the consuming venv, Linux x86_64, ubuntu-24.04 (glibc 2.39 — the key includes the libc version, so machines with a
# different glibc do not fetch and build locally instead).
name: Rust wheels to the build store

on:
  push:
    branches: [main]
    paths:
      - "packages/doeff-vm/**"
      - "packages/doeff-linter/**"
      - "packages/doeff-indexer/**"
      - "packages/doeff-effect-analyzer/**"
      - "tools/doeff_cargo_backend.py"
      - "tools/rust_wheel_release.py"
      - ".github/workflows/rust-wheels.yml"
  workflow_dispatch:

permissions:
  contents: write

# Two runs do not upload the same key at once (the later run fetches the asset the earlier run uploaded and finishes).
concurrency:
  group: rust-wheels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Build through the build entry and upload what it built
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.14t python tools/rust_wheel_release.py --tag rust-wheels --python 3.14t
          packages/doeff-vm packages/doeff-linter packages/doeff-indexer packages/doeff-effect-analyzer
