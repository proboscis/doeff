name: Build doeff-vm

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "doeff-vm-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # The upload uses skip-existing, so a doeff-vm-v* tag without a version bump would upload
  # nothing and still pass; the publish job needs this check (tools/check_pypi_unpublished.py).
  check-version-unpublished:
    name: Fail if this doeff-vm version is already on PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check doeff-vm against PyPI
        run: uv run --no-project python tools/check_pypi_unpublished.py packages/doeff-vm

  # aarch64 builds natively on an arm runner. Cross-compiling it on an x86_64 runner uses
  # rust-cross/manylinux2014-cross, whose GCC 4.8 rejects the -Wno-error=date-time flag that
  # libmimalloc-sys passes; the native manylinux2014_aarch64 image keeps the same wheel tags.
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.11 python3.12 python3.13 python3.14 python3.15
          working-directory: packages/doeff-vm
          manylinux: auto

      # Every job uploads only its own ABI's wheels (cp311-cp315 or cp313t/cp314t): publish.yml
      # downloads all doeff-vm-* artifacts into one dir, and --find-interpreter in the free-threaded
      # jobs also builds the runner's GIL interpreters, so a same-named wheel would overwrite another.
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-vm-wheels-linux-${{ matrix.target }}
          path: packages/doeff-vm/dist/*-cp31[1-5]-cp31[1-5]-*.whl
          if-no-files-found: error

  build-linux-freethreaded:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      # Only 3.14t: maturin 1.15 refuses a named 3.13t interpreter in the manylinux images
      # ("Free-threaded Python interpreter is only supported on 3.14 and later").
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.14t
          working-directory: packages/doeff-vm
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-vm-wheels-linux-freethreaded-${{ matrix.target }}
          path: packages/doeff-vm/dist/*-cp31[34]-cp31[34]t-*.whl
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin

      - name: Setup Python versions
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          working-directory: packages/doeff-vm

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-vm-wheels-macos-${{ matrix.target }}
          path: packages/doeff-vm/dist/*-cp31[1-5]-cp31[1-5]-*.whl
          if-no-files-found: error

  build-macos-freethreaded:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin
      - name: Setup free-threaded Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          working-directory: packages/doeff-vm
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-vm-wheels-macos-freethreaded-${{ matrix.target }}
          path: packages/doeff-vm/dist/*-cp31[34]-cp31[34]t-*.whl
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python versions
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter
          working-directory: packages/doeff-vm

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-vm-wheels-windows
          path: packages/doeff-vm/dist/*-cp31[1-5]-cp31[1-5]-*.whl
          if-no-files-found: error

  build-windows-freethreaded:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup free-threaded Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter
          working-directory: packages/doeff-vm
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-vm-wheels-windows-freethreaded
          path: packages/doeff-vm/dist/*-cp31[34]-cp31[34]t-*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: packages/doeff-vm

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: doeff-vm-sdist
          path: packages/doeff-vm/dist/*.tar.gz

  # Uploads only from this workflow's own doeff-vm-v* tag or dispatch: PyPI rejects Trusted
  # Publishing from a reusable workflow, so publish.yml calls this one with publish: false.
  publish:
    name: Publish to PyPI
    needs: [check-version-unpublished, build-linux, build-linux-freethreaded, build-macos, build-macos-freethreaded, build-windows, build-windows-freethreaded, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/doeff-vm-v') || inputs.publish
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download doeff-vm artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: doeff-vm-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
