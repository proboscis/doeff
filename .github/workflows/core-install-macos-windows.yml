# On macOS and Windows, build the 4 core packages of `pip install doeff` (doeff, doeff-vm, doeff-core-effects, frozendict) from main,
# install them into a fresh venv, and check that the README Python examples print what their annotations say (initiative
# doeff-publish, milestone 9). The work is done by tools/verify_core_install.py (the same tool as on local Linux): the installed set is
# exactly the 4 core packages, the README Python examples of doeff and doeff-vm pass, and uses that need the Hy or HTTP extras name
# the extra to add. Python is 3.11 and 3.14, the two ends of requires-python. 3.14 is requested as plain 3.14: on newer runners the
# uv-managed Python installs a GIL build (the tool prints the interpreter build), and uv 0.13.1 has no download matching 3.14+gil
# (the 2026-10-17 run failed with No interpreter found). doeff-vm is built from source, not taken as a PyPI wheel, just as when no
# wheel matches a user's machine (build backend tools/doeff_cargo_backend.py — needs the Rust toolchain).
name: Core install on macOS and Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-install:
    name: core install (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Like the same check on Linux (core-only-install in python-compatibility.yml), use only the uv-managed Python — runners differ
    # in the Python version and build they ship.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.11", "3.14"]

    steps:
      # packages/doeff-vm/doeff_cargo_backend.py is a symlink to tools/doeff_cargo_backend.py (one source of truth for the build backend).
      # Git on Windows defaults to core.symlinks=false, which turns the symlink into a file holding the target path; the build backend
      # then cannot be read and doeff-vm cannot be built.
      - name: Check out symlinks as symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install the core four into a fresh venv and run the README examples
        run: uv run --no-project --python ${{ matrix.python }} python tools/verify_core_install.py --python ${{ matrix.python }}
