# Every day, like a first-time user, install doeff from PyPI with no extras into fresh venvs on Linux, macOS and Windows, and check
# that the README Python examples print what their annotations say (initiative doeff-publish, milestone 16). The work is done by
# tools/verify_core_install.py --pypi latest: the installed set is exactly the 4 core packages, with the 3 doeff packages from PyPI;
# the README Python examples of doeff and doeff-vm pass (the README is the installed wheel's metadata, so it matches the installed
# version); the type checker reads the examples' imports as public names; and the README examples of main from the checkout pass
# (this is what newcomers read, so this fails when the README gets ahead of the released version).
# Unlike the checks that build from the checkout (core-install-macos-windows.yml, core-only-install in python-compatibility.yml),
# no Rust toolchain is installed and doeff-vm comes only as a PyPI wheel — if PyPI has no wheel for the machine and Python, the
# install step fails. 3.14 is requested as plain 3.14 (reason in the header of core-install-macos-windows.yml). Also runs on
# pushes to main that change the tool, the workflow, or the READMEs whose examples it runs (doeff and doeff-vm).
name: Core install from PyPI

on:
  schedule:
    # Every day at 06:17 JST
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/core-install-from-pypi.yml
      - tools/verify_core_install.py
      - tools/verify_release_install.py
      - tools/readme_examples.py
      - README.md
      - packages/doeff-vm/README.md

permissions:
  contents: read

jobs:
  core-install-from-pypi:
    name: core install from PyPI (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Runners differ in the Python version and build they ship, so use only the uv-managed Python (same as the other core checks).
    env:
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install doeff from PyPI into a fresh venv and run the README examples
        run: uv run --no-project --python ${{ matrix.python }} python tools/verify_core_install.py --pypi latest --python ${{ matrix.python }}
