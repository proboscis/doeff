# Checks that the docs site (mkdocs.yml) builds — only the user-facing pages reachable from the table of contents in docs/index.md,
# built with --strict using pinned mkdocs and Material (tools/docs_site/requirements.txt). A missing link target file or anchor, or a
# mismatch between nav and the exclude_docs allow list, becomes a warning and --strict fails the run. Locally, make docs-site runs the
# same command. The built site is uploaded as the artifact docs-site (download it and open index.html).
#
# The site is not published yet (initiative doeff-publish, milestone 11 — whether and where to publish depends on the answer to the
# request). To publish, add one job after the build to this workflow (for GitHub Pages: upload the built site/ with
# actions/upload-pages-artifact and publish with actions/deploy-pages).
name: Docs site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build the docs site (strict)
        run: make docs-site

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 14
