# No dated, verbatim quotes of the maintainer's chat words in the public repo.
#
# The tree check stops a tracked file that quotes the maintainer's own words together with the time
# they were said; the commit check does the same for the messages of the pushed commits. Design
# records keep the decision and its reason; provenance is a short dated decision mark or a
# pointer to the internal tracker. Past history is not rewritten, so the commit check only reads the
# commits a push or pull request adds. The same check runs at commit time (the no-chat-quotes hook).
name: No chat quotes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tracked files carry no dated quote
        run: python3 scripts/check_no_operator_quotes.py

      - name: New commit messages carry no dated quote
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            base="$BEFORE"
          else
            # a branch push (or a new branch): the commits the branch adds on top of main
            base="$(git merge-base origin/main HEAD)"
          fi
          python3 scripts/check_no_operator_quotes.py --commits "$base..HEAD"
