# Checks that links in the README, the docs, and the README shown on the PyPI page are not broken (initiative doeff-publish, milestone 11).
# The work is done by tools/check_links.py (standard library only — does not sync the workspace). Two jobs:
# - in-repo: reads relative links, GitHub links pointing at main, `#heading` anchors, and the relative paths of READMEs that become
#   PyPI pages, against the checkout tree. It needs no network, so it runs on every push and pull request (naming links broken by
#   file renames or heading edits). The same check also runs as tests/test_check_links.py::test_repo_links_resolve_in_the_tree
#   (root tests of Python Compatibility); this job lists the broken links under one job name.
# - external: sends requests to external links. Results vary with the remote sites, so it does not run on push; it runs weekly
#   (Mondays 03:17 UTC) and on manual dispatch. Only 404, 410 and unresolvable hosts are red; 429, 5xx, 403 and timeouts are
#   printed as "could not verify".
name: Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  in-repo:
    name: In-repo links (relative, main, anchors, PyPI pages)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Check links against the tree
        run: uv run --no-project python tools/check_links.py

  external:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Ask every external link for an answer
        run: uv run --no-project python tools/check_links.py --external
