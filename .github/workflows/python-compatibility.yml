# Python の版ごとの検 — 公開する核の 5 個(doeff・doeff-vm・doeff-core-effects・doeff-hy・doeff-hy-pytest)が、宣言した
# requires-python の版(3.11〜3.14)で入り、検が通る事を確かめる。3.10 は 2026-10-01 に保守を終え、核は 3.11 からの
# enum.StrEnum・ast.TryStar を使うので、核の requires-python は >=3.11(3.10 の利用者には PyPI の 0.4.1 が残る)。
#
# workspace(uv sync)では走らせない: workspace の requires-python は全 member の交わりで、doeff-docker・doeff-ml-nexus の >=3.12 が
# 3.11 の sync を断る(2026-04 に 3.10・3.11 で 5 回続けて落ち、手で止めた訳)。版ごとに素の venv を作り、
# 核の 5 個を checkout から入れる — PyPI から入れた利用者と同じく、依存は uv.lock でなく各 package の宣言から解く。
# 検は package ごとに別の pytest の session で走らせる(Makefile の test-packages と同じ境目 — 同じ名の検の file がぶつからない)。
# free-threaded の 3.14t は実験の扱い(落ちても run を赤にしない)。3.13t は置かない: PyO3 が 3.14 より前の free-threaded の
# CPython を支えず、doeff-hy が依る pydantic-core を組めない。
name: Python Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest-matrix:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    # 検が子の process で呼ぶ `uv run`(CLI の検ほか)を、sync せずにこの venv で走らせる — workspace の sync は 3.11 を断り、3.12 から
    # でも workspace の全部を組み直して検の時間切れになる。
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.14t"
            experimental: true

    steps:
      # 履歴と tag を全部取る(検が git の履歴と tag を読む — tests/test_agentd_retirement.py の rollback の tag)。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 核の 5 個に足す検の道具: pytest の plugin・Hy の検の file(test_*.hy)を集める doeff-adr の plugin・根の検が import する部品
      # (doeff-time・doeff-traverse・cloudpickle・pyyaml)・build の口と型の検が子の process で呼ぶ maturin と pyright(版は uv.lock の
      # dev の物)。doeff-core-effects は答え手の stub の検が aiohttp を読むので extra の http-server ごと入れる。venv の bin を PATH に
      # 置き、検が呼ぶ python・hy・doeff をこの venv の物にする。
      - name: Install the core packages into a fresh venv
        id: install
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
          uv export --frozen --no-hashes --no-emit-workspace --only-group dev | grep -E '^(maturin|pyright)==' > .venv-ci/tool-pins.txt
          uv pip install --python .venv-ci/bin/python -c .venv-ci/tool-pins.txt \
            ./packages/doeff-vm "./packages/doeff-core-effects[http-server]" ./packages/doeff-hy ./packages/doeff-hy-pytest . \
            ./packages/doeff-adr ./packages/doeff-time ./packages/doeff-traverse \
            pytest pytest-asyncio pytest-timeout pytest-xdist cloudpickle pyyaml maturin pyright

      - name: Verify doeff-vm import
        run: .venv-ci/bin/python -c "import doeff_vm; import doeff_vm.doeff_vm"

      # 印 semgrep の検(repo の規則を semgrep で検める)は外す — 版の違いではなく repo の規則を見る検で、日次の検が持つ。外す file =
      # 核の外の重い部品(doeff-gemini・doeff-agents)か、開発の道具(semgrep・pre-commit・doeff-linter)を要る検。足す時は訳と一緒にここへ書く。
      - name: Run tests (doeff and doeff-vm)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          .venv-ci/bin/python -m pytest -q -n auto -m "not e2e and not semgrep" \
            tests packages/doeff-vm/tests packages/doeff-vm-core/tests \
            --ignore=tests/test_llm_multi_provider_handlers.py \
            --ignore=tests/test_mcp_json_type_table.py \
            --ignore=tests/test_lint_entrypoint_wiring.py

      - name: Run tests (doeff-core-effects)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv-ci/bin/python -m pytest -q -n auto -m "not e2e and not semgrep" packages/doeff-core-effects/tests

      - name: Run tests (doeff-hy)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv-ci/bin/python -m pytest -q -n auto -m "not e2e and not semgrep" packages/doeff-hy/tests

      - name: Run tests (doeff-hy-pytest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv-ci/bin/python -m pytest -q -n auto -m "not e2e and not semgrep" packages/doeff-hy-pytest/tests

      # cargo bench の検の binary は CPython を埋め込むので、venv の Python と、その libpython の dir を渡す(Makefile の test-rust と同じ)。
      - name: Run benchmark smoke checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.python-version == '3.12' }}
        run: |
          .venv-ci/bin/python benchmarks/benchmark_runner.py --smoke --no-output
          export PYO3_PYTHON="$PWD/.venv-ci/bin/python"
          export LD_LIBRARY_PATH="$("$PYO3_PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd packages/doeff-vm-core
          cargo bench --features python_bridge --bench dispatch -- --test
