# Per-Python-version tests — checks that the 5 published core packages (doeff, doeff-vm, doeff-core-effects, doeff-hy,
# doeff-hy-pytest) install and pass their tests on the declared requires-python versions (3.11–3.15). 3.10 reached end of life on
# 2026-10-01 and the core uses enum.StrEnum and ast.TryStar from 3.11, so the core requires-python is >=3.11 (users on 3.10 keep
# 0.4.1 on PyPI).
#
# Not run in the workspace (uv sync): the workspace requires-python is the intersection over all members, and the >=3.12 of
# doeff-docker and doeff-ml-nexus rejects a 3.11 sync (in 2026-04 it failed 5 times in a row on 3.10 and 3.11 and was stopped by
# hand). Instead, a plain venv is created per version and the 5 core packages are installed from the checkout — as for users
# installing from PyPI, dependencies are resolved from each package's declarations, not from uv.lock.
# Tests run in a separate pytest session per package (same boundaries as test-packages in the Makefile — test files with the same
# name do not collide). Free-threaded 3.14t is experimental (failures do not turn the run red). No 3.13t: PyO3 does not support
# free-threaded CPython before 3.14, so pydantic-core, which doeff-hy depends on, cannot be built.
name: Python Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest-matrix:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    # Make `uv run` calls from test subprocesses (CLI tests and others) run in this venv without syncing — a workspace sync rejects
    # 3.11, and even from 3.12 it rebuilds the whole workspace and the tests time out. Use only the latest patch of each uv-managed
    # Python — with the runner's Python 3.12.3, Hy 1.3.1's runpy patch breaks running Hy scripts (`hy file.hy`, runpy).
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-ci
      UV_NO_SYNC: "1"
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          - python-version: "3.14t"
            experimental: true

    steps:
      # Fetch the full history and all tags (tests read git history and tags — the rollback tag in tests/test_agentd_retirement.py).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Test tooling added to the 5 core packages: pytest plugins, the doeff-adr plugin that collects Hy test files (test_*.hy), parts
      # the tests import (doeff-time, doeff-traverse, doeff-validation, cloudpickle, pyyaml — validate and check of the doeff-hy macros
      # read doeff-validation), and maturin and pyright, which the build backend and type tests call in subprocesses (versions are the dev
      # ones in uv.lock). doeff-core-effects is installed with the http, http-server and postgres extras because the handler tests read
      # httpx, aiohttp and psycopg (httpx is in the http extra, not a default dependency).
      # The examples in docs chapter 19 (agent guide) yield doeff-agents effects, so doeff-agents and its dependencies not on PyPI,
      # doeff-claude-code and doeff-codex, are also installed from the checkout (tests/test_docs_page_examples.py runs the examples).
      # Put the venv bin on PATH so the python, hy and doeff the tests call are this venv's.
      - name: Install the core packages into a fresh venv
        id: install
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
          uv export --frozen --no-hashes --no-emit-workspace --only-group dev | grep -E '^(maturin|pyright)==' > .venv-ci/tool-pins.txt
          uv pip install --python .venv-ci/bin/python -c .venv-ci/tool-pins.txt \
            ./packages/doeff-vm "./packages/doeff-core-effects[http,http-server,postgres]" ./packages/doeff-hy ./packages/doeff-hy-pytest . \
            ./packages/doeff-adr ./packages/doeff-time ./packages/doeff-traverse ./packages/doeff-validation \
            ./packages/doeff-agents ./packages/doeff-claude-code ./packages/doeff-codex \
            pytest pytest-asyncio pytest-timeout pytest-xdist cloudpickle pyyaml maturin pyright

      - name: Verify doeff-vm import
        run: .venv-ci/bin/python -c "import doeff_vm; import doeff_vm.doeff_vm"

      # Tests marked semgrep (checking the repo rules with semgrep) are excluded — they check repo rules, not version differences, and
      # the daily check owns them. Excluded tests = those needing heavy non-core parts (doeff-gemini, doeff-conductor, doeff-cluster, and
      # the doeff-agents MCP server tests) or development tools (semgrep, pre-commit, doeff-linter), and timing-ratio tests that are
      # flaky on shared runners. When adding one, write the reason here with it.
      # tests/test_public_api_known_violations.py imports all 39 packages under packages/ and compares their public names with a known
      # table — in a venv with only the 5 core packages the non-core dependencies are missing, modules fail to import and names are read
      # textually, so it diverges from the table (the daily and pre-landing checks own it).
      - name: Run tests (doeff and doeff-vm)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          .venv-ci/bin/python -m pytest -q -n auto -m "not e2e and not semgrep" \
            tests packages/doeff-vm/tests packages/doeff-vm-core/tests \
            --ignore=tests/test_llm_multi_provider_handlers.py \
            --ignore=tests/test_public_api_known_violations.py \
            --ignore=tests/test_mcp_json_type_table.py \
            --ignore=tests/test_lint_entrypoint_wiring.py \
            --ignore=tests/test_nested_definition_scope.py \
            --deselect=tests/test_machine_premise.py::test_real_codex_worker_test_is_outside_the_daily_population \
            --deselect=tests/test_machine_premise.py::test_real_codex_worker_test_names_a_codex_that_does_not_start

      - name: Run tests (doeff-core-effects)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: .venv-ci/bin/python -m pytest -q -n auto -m "not e2e and not semgrep" packages/doeff-core-effects/tests

      - name: Run tests (doeff-hy)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          .venv-ci/bin/python -m pytest -q -n auto -m "not e2e and not semgrep" packages/doeff-hy/tests \
            --ignore=packages/doeff-hy/tests/test_system_static_types.py \
            --ignore=packages/doeff-hy/tests/test_conductor_dsl.py

      - name: Run tests (doeff-hy-pytest)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          .venv-ci/bin/python -m pytest -q -n auto -m "not e2e and not semgrep" packages/doeff-hy-pytest/tests \
            --deselect=packages/doeff-hy-pytest/tests/test_budget.py::test_an_outlier_changes_neither_the_outcomes_nor_the_exit_code_nor_the_warnings

      # The cargo bench test binary embeds CPython, so pass the venv's Python and its libpython dir (same as test-rust in the Makefile).
      - name: Run benchmark smoke checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.python-version == '3.12' }}
        run: |
          .venv-ci/bin/python benchmarks/benchmark_runner.py --smoke --no-output
          export PYO3_PYTHON="$PWD/.venv-ci/bin/python"
          export LD_LIBRARY_PATH="$("$PYO3_PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd packages/doeff-vm-core
          cargo bench --features python_bridge --bench dispatch -- --test

  # Core-only install check — in a fresh venv installed with no extras, like pip install doeff, checks that the installed set is
  # exactly the 4 core packages (doeff, doeff-vm, doeff-core-effects, frozendict), the README Python examples pass, and uses that need
  # the Hy or HTTP extras name the extra to add (tools/verify_core_install.py). The venv of the job above also has Hy and the test
  # tooling and reads 3 packages as editable, so it would not notice a broken core-only install. Version handling is the same as the
  # job above (3.14t is experimental; Python is uv-managed).
  core-only-install:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    env:
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        experimental: [false]
        include:
          - python-version: "3.14t"
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Build doeff-vm (the PyO3 extension) from the checkout.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check the core-only install
        run: uv run --no-project python tools/verify_core_install.py --python ${{ matrix.python-version }}
