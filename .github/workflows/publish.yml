name: Publish doeff

# One-off release branch for doeff-agents 0.1.2 (cut from tag v0.4.1). It publishes doeff-agents
# only: 0.1.1 declares `doeff>=0.1.0` with no upper bound, so an unpinned install pairs it with
# doeff 0.5, which removed the public WithHandler its handlers import. 0.1.2 is the same code
# with `doeff<0.5`. Dispatch it on this branch; main's publish.yml stays the core-five release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish doeff-agents 0.1.2 to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-doeff-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Fail unless the release is doeff-agents 0.1.2 and it is not on PyPI yet
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/doeff-agents/pyproject.toml)
          test "$version" = "0.1.2"
          status=$(python3 -c 'import urllib.request, urllib.error
          try:
              urllib.request.urlopen("https://pypi.org/pypi/doeff-agents/0.1.2/json"); print(200)
          except urllib.error.HTTPError as e:
              print(e.code)')
          test "$status" = "404"

      - name: Build doeff-agents wheel and sdist
        run: uv build --package doeff-agents --wheel --sdist --out-dir dist-doeff-agents

      - name: Verify built metadata
        run: uv run --no-project python tools/verify_dist_metadata.py dist-doeff-agents/*.whl dist-doeff-agents/*.tar.gz

      - name: Upload doeff-agents distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doeff-agents-dist
          path: dist-doeff-agents/*
          if-no-files-found: error

  publish-doeff-agents:
    name: Publish doeff-agents to PyPI
    needs: [build-doeff-agents]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download doeff-agents dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: doeff-agents-dist
          path: dist-doeff-agents

      - name: List doeff-agents artifacts
        run: ls -la dist-doeff-agents/

      - name: Publish doeff-agents to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-doeff-agents/
          password: ${{ secrets.PYPI_API_TOKEN }}
