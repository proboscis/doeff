name: Publish doeff

# One-off release branch for doeff-time 0.1.0 (cut from tag v0.8.0's commit). doeff-time is released
# on its own (docs/release-publish-runbook.md, "packages released on their own"), not with the core
# five, and needs doeff 0.8.0 on PyPI first. Dispatch it on this branch; main's publish.yml stays the
# core-five release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish doeff-time 0.1.0 to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-doeff-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Fail unless the release is doeff-time 0.1.0, it is not on PyPI yet, and doeff 0.8.0 is
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/doeff-time/pyproject.toml)
          test "$version" = "0.1.0"
          uv run --no-project python tools/check_pypi_unpublished.py packages/doeff-time
          status=$(uv run --no-project python -c 'import urllib.request, urllib.error
          try:
              urllib.request.urlopen("https://pypi.org/pypi/doeff/0.8.0/json"); print(200)
          except urllib.error.HTTPError as e:
              print(e.code)')
          test "$status" = "200"

      - name: Build doeff-time wheel and sdist
        run: uv build --package doeff-time --wheel --sdist --out-dir dist-doeff-time

      - name: Verify built metadata
        run: uv run --no-project python tools/verify_dist_metadata.py dist-doeff-time/*.whl dist-doeff-time/*.tar.gz

      - name: Upload doeff-time distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doeff-time-dist
          path: dist-doeff-time/*
          if-no-files-found: error

  publish-doeff-time:
    name: Publish doeff-time to PyPI
    needs: [build-doeff-time]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download doeff-time dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: doeff-time-dist
          path: dist-doeff-time

      - name: List doeff-time artifacts
        run: ls -la dist-doeff-time/

      - name: Publish doeff-time to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-doeff-time/
          password: ${{ secrets.PYPI_API_TOKEN }}
