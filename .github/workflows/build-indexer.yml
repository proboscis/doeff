name: Build doeff-indexer

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'doeff-indexer-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # The upload uses skip-existing, so a doeff-indexer-v* tag without a version bump would upload
  # nothing and still pass; the publish job needs this check (tools/check_pypi_unpublished.py).
  check-version-unpublished:
    name: Fail if this doeff-indexer version is already on PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check doeff-indexer against PyPI
        run: uv run --no-project python tools/check_pypi_unpublished.py packages/doeff-indexer

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: packages/doeff-indexer
          manylinux: auto
          before-script-linux: |
            # Build the native binary first (without Python feature)
            # For cross-compilation, binary goes to target/<arch>/release/
            if [ "${{ matrix.target }}" = "aarch64" ]; then
              rustup target add aarch64-unknown-linux-gnu
              cargo build --release --no-default-features --target aarch64-unknown-linux-gnu
              mkdir -p python/doeff_indexer/bin
              cp target/aarch64-unknown-linux-gnu/release/doeff-indexer python/doeff_indexer/bin/
            else
              cargo build --release --no-default-features
              mkdir -p python/doeff_indexer/bin
              cp target/release/doeff-indexer python/doeff_indexer/bin/
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-indexer-wheels-linux-${{ matrix.target }}
          path: packages/doeff-indexer/dist/*.whl

  build-linux-freethreaded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          # maturin 1.14 and later reject `-i python3.13t` ("only supported on 3.14 and later"); 1.13.1 accepts it.
          # Only the free-threaded jobs use 1.13.1; the layout fix (an `include`d file under the python source)
          # is in 1.13.0 and later, and verify-wheels checks that all 15 wheels exist.
          maturin-version: v1.13.1
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.13t python3.14t
          working-directory: packages/doeff-indexer
          manylinux: auto
          before-script-linux: |
            if [ "${{ matrix.target }}" = "aarch64" ]; then
              rustup target add aarch64-unknown-linux-gnu
              cargo build --release --no-default-features --target aarch64-unknown-linux-gnu
              mkdir -p python/doeff_indexer/bin
              cp target/aarch64-unknown-linux-gnu/release/doeff-indexer python/doeff_indexer/bin/
            else
              cargo build --release --no-default-features
              mkdir -p python/doeff_indexer/bin
              cp target/release/doeff-indexer python/doeff_indexer/bin/
            fi
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-indexer-wheels-linux-freethreaded-${{ matrix.target }}
          path: packages/doeff-indexer/dist/*.whl

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin

      - name: Build native binary
        working-directory: packages/doeff-indexer
        run: |
          cargo build --release --no-default-features --target ${{ matrix.target }}-apple-darwin
          mkdir -p python/doeff_indexer/bin
          cp target/${{ matrix.target }}-apple-darwin/release/doeff-indexer python/doeff_indexer/bin/

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: packages/doeff-indexer

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-indexer-wheels-macos-${{ matrix.target }}
          path: packages/doeff-indexer/dist/*.whl

  build-macos-freethreaded:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}-apple-darwin
      - name: Setup free-threaded Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Build native binary
        working-directory: packages/doeff-indexer
        run: |
          cargo build --release --no-default-features --target ${{ matrix.target }}-apple-darwin
          mkdir -p python/doeff_indexer/bin
          cp target/${{ matrix.target }}-apple-darwin/release/doeff-indexer python/doeff_indexer/bin/
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          # See build-linux-freethreaded: 1.13.1 accepts python3.13t, 1.14 and later do not. 1.13.x does not find
          # free-threaded interpreters with --find-interpreter, and --find-interpreter would also find the runner's
          # regular Pythons and build the abi3 wheel again, so both interpreters are named.
          maturin-version: v1.13.1
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.13t python3.14t
          working-directory: packages/doeff-indexer
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-indexer-wheels-macos-freethreaded-${{ matrix.target }}
          path: packages/doeff-indexer/dist/*.whl

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # requires-python is >=3.11 (doeff-indexer 0.2.0), so maturin only accepts a 3.11+ interpreter here;
      # with only 3.10 on the runner it stops with "Need a Python interpreter to compile for Windows".
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native binary
        working-directory: packages/doeff-indexer
        shell: bash
        run: |
          cargo build --release --no-default-features
          mkdir -p python/doeff_indexer/bin
          cp target/release/doeff-indexer.exe python/doeff_indexer/bin/

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          args: --release --out dist
          working-directory: packages/doeff-indexer

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-indexer-wheels-windows
          path: packages/doeff-indexer/dist/*.whl

  build-windows-freethreaded:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup free-threaded Python
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.13t
            3.14t
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build native binary
        working-directory: packages/doeff-indexer
        shell: bash
        run: |
          cargo build --release --no-default-features
          mkdir -p python/doeff_indexer/bin
          cp target/release/doeff-indexer.exe python/doeff_indexer/bin/
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          # See build-macos-freethreaded.
          maturin-version: v1.13.1
          args: --release --out dist -i python3.13t python3.14t
          working-directory: packages/doeff-indexer
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: doeff-indexer-wheels-windows-freethreaded
          path: packages/doeff-indexer/dist/*.whl

  # Build source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
          working-directory: packages/doeff-indexer

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: doeff-indexer-sdist
          path: packages/doeff-indexer/dist/*.tar.gz

  # The 0.1.3 wheels on PyPI shipped the doeff-indexer binary under python/doeff_indexer/bin/, where
  # the doeff-indexer command never looks, so `doeff-indexer --help` printed "binary not found".
  # maturin 1.12 (what maturin-action pulled that day) puts an `include`d file at its path from the
  # project root; 1.13 and later put it under the python source. The maturin-version pins above keep
  # the layout from changing with the day's "latest"; this job checks the layout of every wheel and
  # installs the Linux x86_64 one to run the command, so a wrong wheel stops here, before the upload.
  # --expect-all also fails when any of the 15 wheels (abi3, free-threaded 3.13 and 3.14, each for Linux
  # x86_64 and aarch64, macOS x86_64 and arm64, and Windows) is missing; the first 0.2.0 dry run built only
  # 10 and every check still passed.
  verify-wheels:
    name: Check the wheels install and run
    needs: [build-linux, build-linux-freethreaded, build-macos, build-macos-freethreaded, build-windows, build-windows-freethreaded]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download doeff-indexer wheels
        uses: actions/download-artifact@v4
        with:
          pattern: doeff-indexer-wheels-*
          path: dist
          merge-multiple: true

      - name: Check every wheel and run the command from the Linux x86_64 one
        run: >-
          python3 tools/verify_indexer_wheel.py
          --expect-all
          --smoke dist/doeff_indexer-*-cp310-abi3-manylinux*_x86_64*.whl
          dist/*.whl

  # Uploads only from this workflow's own doeff-indexer-v* tag or dispatch: PyPI rejects Trusted
  # Publishing from a reusable workflow, so publish.yml calls this one with publish: false.
  publish:
    name: Publish to PyPI
    needs: [check-version-unpublished, verify-wheels, build-linux, build-linux-freethreaded, build-macos, build-macos-freethreaded, build-windows, build-windows-freethreaded, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/doeff-indexer-v') || inputs.publish
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download doeff-indexer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: doeff-indexer-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
