# land-queue 宣言(dotfiles ADR-DOTFILES-017 の機構、repo-local 方策)。
# 敷設 2026-08-09(land-queue-all-repos-rollout 便 — operator 指示「全部の repo で
# 利用したい」+ operator 決裁 sha d54350a8)。mixed repo(proboscis/doeff* は
# company-mixed-repos.txt 登載)— 編集は任意席・著述は個人系。
#
# upstream repo 規約の機械化(発注 (4)): 「検証済みでしか main を進めない」は
# 2026-08-17 の operator 裁定で**着地の門から事後検証へ移った**(下の mode = "focus"
# の頭注)。テストは減らさない — 走る場所が変わる(日次全量検査 + stable 昇格)。
# battery 実測 2026-08-09: uv run pytest -m "not e2e" = 1294 passed / 78 skipped /
# 8 deselected(11m45s)。e2e marker は実 API キー依存につき gate 外(席実測の
# 分担)。make sync 前置は AGENTS.md 明文(uv sync は Rust VM を確実に再 build
# しない — stale binary の phantom failure 防止)。
# 敷設時に main の実赤 1 本(enforcement-ledger semgrep_rules 246≠247 の記帳漏れ)
# を bootstrap 便で是正済み(テスト自身の処方 = 増加は台帳を上げる)。

[land-queue]
enabled = true
base = "main"

[gate]
# full = 日次検証便(ai land verify)と full_paths 便だけが使う(mode = "focus" の間、
# 窓末では走らない)。
full = "make sync && PYTHONUNBUFFERED=1 uv run pytest -q -m 'not e2e'"
# 門の走行の持ち時間 2700→7200(2026-08-17)。実測 = L32 が 2713.4s で時間切れ
# (4 連敗・Mac 飽和帯)。ADR-DOE-ENFORCE-001 R6 の第 3 の締切の宣言先行便。
timeout_s = 7200

# R-7a95702d focus mode(operator 直接指示 2026-08-17「merge queue は 10 分以内・
# 2700 秒の門は許容範囲外」— 先例 = herdr-hud D568 出荷 B / ACP 同日切替)。
# operator 裁定 2026-08-17 逐語「mergeにテストは必須じゃない」: 着地の門は merge の
# 力学(rebase 成立・patch-id 突合・受入検定)のみ。テストは全部事後 =
# ① 日次全量検査(gate.full を ai land verify が使う — launchd 便は別途敷設)
# ② 全走が緑の断面だけが stable ブランチ(policy.stable_branch)へ昇格
# ③ 赤の復旧は fix-forward(容疑名指しの修理便の自動起票)— revert 自動化は不採。
# 実測根拠: Mac 飽和帯で make sync だけが 23 分・全量が門 2700s に収まらず同一便が
# 4 連敗(L29〜L32)。恒久解 = 全量検査の zeus/k3s 移設(remote_check 経由・
# 2026-08-17 実測 = zeus 全量 36s〔-n 8〕。semgrep 執行層 69 検体の機体依存根治が
# 前提 — route-doeff-semgrep-zeus-181256 起票済み)。
mode = "focus"
# focus の恒常部は宣言しない(doeff に横断走査 script なし — 門は力学のみ)。
# 方策宣言そのものへの変更だけは常時 full battery(自己参照の fail-closed)
# ⚠ 2026-08-17 operator 逐語「全量検査を無効にしてくれ」: full_paths を空に —
# 着地の窓はいかなる path でも全量検査(gate.full)を走らせない。gate.full の
# 唯一の消費者 = 日次検証便(ai land verify・launchd)。方策 toml の変更も
# 窓では力学のみで着地する(検分は事後 + fix-forward)。復活は operator 裁定で。
full_paths = []

# R-94ede4bc 投機列車(operator 直接指示 2026-08-17「merge queue の投機テストを
# 全 repo で適用」— 連邦の機構 = dotfiles land.py・先例 = dotfiles 裁定 2026-08-16
# decision-land-speculation-enable / herdr-hud D568)。窓は確定 train(消費済み
# 緑の先端・公開対象)と投機 tip を分け、gate の実行だけを backend へ並列に
# 発注する(判定の消費は直列同値・赤 1 便で窓ごと abort する形の根治)。厳密 bool。
# 戻し方 = この行を外す便を着地させる(既定 off・law opt-in-inert)。
speculation = true
# 検査 backend(law policy-in-toml)。mode = "focus" で gate 実体が軽くなったため
# local のままで足りる。恒久解 = k3s self-hosted runner(external backend 段 2)。
[gate.backend]
kind = "local"
max_parallel = 1
join_s = 60

[gate.tiers]
# ⚠ mode = "focus" の間、この表は着地の解決に使われない(mode 未宣言への戻しだけが
# 読む — herdr-hud / ACP と同じ移行残置。撤去は日次 verify 連続緑の再訪条件で別便)。
"docs/adr/" = "make sync && PYTHONUNBUFFERED=1 uv run pytest -q docs/adr"
"docs/" = "true"
"notes/" = "true"
"README.md" = "true"
"CHANGELOG.md" = "true"
".agents/land-queue.toml" = "true"

[policy]
run_executors = ["landrun-doeff", "landrun-rollout", "machine"]
auto_run = true
urgent_slots = 1
push = "origin"
base_move_follow_retries = 2
# 日次検証の全走が緑の断面だけが昇格する(R-7a95702d)
stable_branch = "stable"
