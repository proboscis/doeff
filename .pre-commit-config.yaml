repos:
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep architectural rules
        entry: &semgrep-entry semgrep --metrics=off --disable-version-check --config .semgrep.yaml --error
        language: system
        types: [python]
        # 変更fileだけを検査する。全体走査は既存の日次lint/pytest側が担う。
        pass_filenames: true
        # 規則の検体(違反をわざと書いた file)は tests/semgrep の検体の検が極性つきで
        # 検める。ここで検めると、発火すべき検体を足す commit が毎回止まる(2026-09-26)。
        exclude: &semgrep-fixtures '^tests/semgrep/fixtures/'

      # identifyにHyのtype tagは無い。Python専用linterへ渡さず、既存generic規則で検査する。
      - id: semgrep-hy
        name: semgrep Hy architectural rules
        entry: *semgrep-entry
        language: system
        types: [file]
        files: '\.hy[pk]?$'
        pass_filenames: true
        exclude: *semgrep-fixtures

      # ADR-DOE-RUNNER-001 R2 / R3: 読む面(doeff-runner の src/read/)の TypeScript も同じ規則の file で検める。
      # 規則の paths.include が src/read/ だけに当たるので、ほかの TypeScript は渡さない。
      - id: semgrep-reading-plane
        name: semgrep reading plane rules
        entry: *semgrep-entry
        language: system
        files: '^ide-plugins/vscode/doeff-runner/src/read/.*\.ts$'
        pass_filenames: true

      - id: doeff-linter
        name: doeff-linter
        entry: doeff-linter --no-log
        language: system
        types: [python]
        pass_filenames: true

      # packages/doeff-cluster は自分の設定(pyproject.toml の [tool.doeff-linter])と service・不変条件の宣言(architecture.hy)を
      # 持つ。根で走る上の doeff-linter はそれを読まないので、package の dir に入って当てる(Hy の file も渡す)。script が
      # architecture.hy を必ず足すので、:invariants を消す commit は DOEFF163 で止まる(agora-redesign #2031)。
      - id: doeff-linter-doeff-cluster
        name: doeff-linter (packages/doeff-cluster の設定と宣言で)
        entry: sh scripts/lint-doeff-cluster.sh
        language: system
        files: '^packages/doeff-cluster/(architecture\.hy|pyproject\.toml|src/.*\.(hy|py))$'
        pass_filenames: true

      # ADR-DOE-ENFORCE-001 R5/R7/R9: enforcement 資産と台帳は同じ commit で動く。
      # 勘定の家 = scripts/check_enforcement_ledger.py(stdlib 単独)。台帳は生成物 —
      # 落ちたら `make enforcement-ledger` で作り直し、消えた項目を確かめて stage する。
      # HEAD に既に在るずれは申告だけで、この commit 自身の増減が台帳に写っていれば通す(R9)。
      # pre-commit 未使用の機体は make hooks-install(scripts/git-hooks/pre-commit)。
      - id: enforcement-ledger
        name: enforcement ledger consistency (ADR-DOE-ENFORCE-001 R5/R7)
        entry: uv run --script scripts/check_enforcement_ledger.py --staged
        language: system
        files: ^(docs/adr/|\.semgrep\.yaml)
        pass_filenames: false
