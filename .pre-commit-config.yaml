repos:
  - repo: local
    hooks:
      # The Python semgrep and doeff-linter compare the findings that predate installing the hook (on 2026-10-02: 74 semgrep findings,
      # about 1,170 linter errors) with a per-rule-per-file baseline (scripts/hook_finding_baseline/), and stop only new findings and
      # a baseline that was not lowered.
      # doeff-linter looks up, in land-arm's development build and then the snapshot store, a binary with the same build-input key the
      # baseline names, and calls it (scripts/doeff_linter_locked.py, #2906 — it does not use a linter from PATH and does not build
      # inside the hook). If the store does not have it, it passes while naming it "cannot measure" — verbose, so that line shows even on success.
      # The 3 semgrep items call the uv.lock version from uv's tool store (scripts/semgrep_locked.py, #2906) — semgrep from PATH or the
      # worktree's .venv drifted in version by machine and worktree state, and in a worktree without .venv uv created an empty .venv.
      # Items that run with uv declare the hook's python with `--python 3.12` (standard-library-only scripts — the
      # scripts/lint-doeff-cluster.sh stage, which reads doeff, keeps the tree environment's python). semgrep_locked.py passes the running
      # python version to uv tool run. Without the declaration uv picks the tree's .python-version (3.14t), and semgrep's dependency
      # ruamel-yaml-clib fails to build (Pod, 2026-10-10).
      # All 4 semgrep items have the alias semgrep-rules — the plain commit hook (scripts/git-hooks/pre-commit, installed by
      # make hooks-install and by agora's worker Pods) fires the same 4 items with `pre-commit run semgrep-rules`. When adding a semgrep
      # item, write the alias too (forgetting it turns test_plain_hook_runs_every_semgrep_hook_of_the_config in tests/test_lint_entrypoint_wiring.py red).
      - id: semgrep
        alias: semgrep-rules
        name: semgrep architectural rules (Python, stops only findings not in the baseline)
        entry: uv run --no-project --python 3.12 python scripts/hook_finding_baseline.py check semgrep
        language: system
        types: [python]
        # Check only the changed files. The full scan is done by the existing daily lint/pytest.
        pass_filenames: true
        verbose: true
        # Rule fixtures (files that break the rules on purpose) are checked with polarity by the fixture tests
        # under tests/semgrep. Checking them here would stop every commit that adds a fixture that should fire (2026-09-26).
        exclude: &semgrep-fixtures '^tests/semgrep/fixtures/'

      # identify has no type tag for Hy. Do not pass it to Python-only linters; check it with the existing generic rules.
      - id: semgrep-hy
        alias: semgrep-rules
        name: semgrep Hy architectural rules
        entry: &semgrep-entry uv run --no-project --python 3.12 python scripts/semgrep_locked.py --metrics=off --disable-version-check
          --config .semgrep.yaml --error
        language: system
        types: [file]
        files: '\.hy[pk]?$'
        pass_filenames: true
        exclude: *semgrep-fixtures

      # Some rules also match documents, settings and type declarations, such as the rule against application vocabulary in
      # generic packages (doeff-packages-have-no-application-vocabulary). Python and Hy are passed by the 2 items above, so this one
      # passes all the rest (.pyi, .md, .toml, .json, .sh, Dockerfile, ...) under the same roots as the daily scan (tests/test_semgrep_gate.py —
      # doeff/ and packages/). Which packages a rule applies to is decided in one place, the rule's paths; this item names no package —
      # when it did, a change that added a package to a rule but forgot this item let the plain hook silently pass that package's
      # documents (test_plain_hook_follows_the_rule_paths_for_documents in tests/test_lint_entrypoint_wiring.py). When this was widened
      # (2026-10-11), the rules had 0 findings in the 707 files of this range.
      - id: semgrep-other-files
        alias: semgrep-rules
        name: semgrep (files other than Python and Hy under doeff/ and packages/ — the rules' paths choose where they apply)
        entry: *semgrep-entry
        language: system
        files: '^(doeff|packages)/'
        exclude: '\.(py|hy|hyp|hyk)$'
        pass_filenames: true

      # The plain commit hook (scripts/git-hooks/pre-commit — installed by agora's worker Pods) also fires this item by id doeff-linter.
      # A change that renames the item's id also fixes the plain hook's call (test_plain_hook_runs_the_doeff_linter_baseline_hook_of_the_config
      # in tests/test_lint_entrypoint_wiring.py turns red otherwise).
      - id: doeff-linter
        name: doeff-linter (Python, stops only errors not in the baseline)
        entry: uv run --no-project --python 3.12 python scripts/hook_finding_baseline.py check doeff-linter
        language: system
        types: [python]
        pass_filenames: true
        verbose: true

      # packages/doeff-cluster has its own settings ([tool.doeff-linter] in pyproject.toml) and service and invariant declarations
      # (architecture.hy). The root doeff-linter above does not read them, so this enters the package dir to apply them (Hy files are passed too).
      # The script always adds architecture.hy, so a commit that removes :invariants is stopped by DOEFF163. The test dir (tests/) is passed
      # too — the package settings' include puts it in the linter's walk, and the rules on how definitions are written (currently critical, 0 hits) judge it.
      - id: doeff-linter-doeff-cluster
        name: doeff-linter (with the settings and declarations of packages/doeff-cluster)
        entry: sh scripts/lint-doeff-cluster.sh
        language: system
        files: '^packages/doeff-cluster/(architecture\.hy|pyproject\.toml|(src|tests)/.*\.(hy|py))$'
        pass_filenames: true

      # Do not put dated quotations of the owner's chat words into the public repo. Write decisions and reasons in the record's own
      # words, and give the source as a short dated decision mark or a reference to the internal tracker. CI (.github/workflows/no-chat-quotes.yml)
      # checks the whole tree and the messages of pushed commits with the same script.
      - id: no-chat-quotes
        name: no dated quotations of the owner's chat words
        entry: uv run --no-project --python 3.12 python scripts/check_no_operator_quotes.py
        language: system
        types: [text]
        pass_filenames: true

      # ADR-DOE-ENFORCE-001 R5/R7/R9: enforcement assets and the ledger move in the same commit.
      # Home of the count = scripts/check_enforcement_ledger.py (stdlib only). The ledger is generated —
      # if this fails, rebuild it with `make enforcement-ledger`, check the removed items, and stage it.
      # Drift already in HEAD is only reported; it passes when this commit's own additions and removals are reflected in the ledger (R9).
      # Machines without pre-commit use make hooks-install (scripts/git-hooks/pre-commit).
      - id: enforcement-ledger
        name: enforcement ledger consistency (ADR-DOE-ENFORCE-001 R5/R7)
        entry: uv run --python 3.12 --script scripts/check_enforcement_ledger.py --staged
        language: system
        files: ^(docs/adr/|\.semgrep\.yaml)
        pass_filenames: false
