# The doeff docs site. It holds only the user-facing pages reached from docs/index.md — development records (docs/adr,
# docs/specs and others) are left out. The page set is written in 2 places: the allow list of exclude_docs (docs/ files outside this set
# do not enter the site) and nav (the same sections and order as the table of contents of docs/index.md). A page in only one of them makes
# the build warn and fails the --strict build (validation's omitted_files, and the warning for a nav entry whose file is missing).
# tests/test_docs_site_pages.py fails when the table of contents of docs/index.md and nav disagree.
#
# Build: make docs-site (mkdocs build --strict with the versions in tools/docs_site/requirements.txt). CI is .github/workflows/docs-site.yml.
# The site is not published yet — once a destination (GitHub Pages or similar) is chosen, add a publish job to that workflow.
site_name: doeff
site_description: Algebraic effects with one-shot continuations for Python, backed by a Rust VM
repo_url: https://github.com/proboscis/doeff
repo_name: proboscis/doeff
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

# mkdocs 1.6 also applies exclude_docs to theme files (Material's CSS and JS — under assets/), so everything under assets/ is allowed
# (with `!/assets/`, files matched by `*` do not come back; make docs-site checks that the built site has the theme's CSS and JS).
# The GIFs at the head of chapters (assets/videos/<name>.gif) are for the GitHub repo view; on the site a hook draws a video instead, so they are not copied.
exclude_docs: |
  *
  !/assets/**
  /assets/videos/*.gif
  !/index.md
  !/01-getting-started.md
  !/02-core-concepts.md
  !/03-basic-effects.md
  !/04-async-effects.md
  !/05-error-handling.md
  !/06-io-effects.md
  !/07-cache-system.md
  !/09-advanced-effects.md
  !/11-kleisli-arrows.md
  !/12-patterns.md
  !/13-api-reference.md
  !/14-cli-auto-discovery.md
  !/15-cli-script-execution.md
  !/16-run-program-api.md
  !/17-effect-boundaries.md
  !/18-effect-combinations.md
  !/20-why-effects-over-di.md
  !/21-semaphore-effects.md
  !/22-capability-classes.md
  !/23-static-typing.md
  !/25-rust-scheduler.md
  !/faq.md
  !/MARKERS.md
  !/cli-run-command-architecture.md
  !/gemini_client_setup.md
  !/gemini_cost_hook.md
  !/ide-plugins.md
  !/llm_unified_effects.md
  !/program-architecture-overview.md
  !/seedream.md
  !/positioning/what-doeff-is.md
  !/articles/algebraic-effects-in-python.md

nav:
  - Home: index.md
  - Getting Started:
      - Getting Started: 01-getting-started.md
      - What doeff Is: positioning/what-doeff-is.md
      - FAQ: faq.md
      - Why Effects?: 20-why-effects-over-di.md
      - Core Concepts: 02-core-concepts.md
  - Effect Types:
      - Basic Effects: 03-basic-effects.md
      - Async Effects: 04-async-effects.md
      - Error Handling: 05-error-handling.md
      - Cache System: 07-cache-system.md
      - Advanced Effects: 09-advanced-effects.md
      - Semaphore Effects: 21-semaphore-effects.md
  - Integration & Advanced Topics:
      - Kleisli Arrows: 11-kleisli-arrows.md
      - Patterns: 12-patterns.md
      - API Reference: 13-api-reference.md
  - CLI Tools:
      - CLI Script Execution: 15-cli-script-execution.md
      - Effect Boundaries: 17-effect-boundaries.md
      - Effect Combinations: 18-effect-combinations.md
  - Specialized Topics:
      - Program Architecture: program-architecture-overview.md
      - Removed IO API: 06-io-effects.md
      - Removed run_program API: 16-run-program-api.md
  - Design Notes:
      - Static Typing: 23-static-typing.md
      - Rust Scheduler: 25-rust-scheduler.md
      - Capability Classes: 22-capability-classes.md
      - CLI Architecture: cli-run-command-architecture.md
  - Articles:
      - 'Algebraic effects for Python': articles/algebraic-effects-in-python.md
  - Pages That Need Other Components:
      - CLI auto-discovery and IDE plugins:
          - CLI Auto-Discovery: 14-cli-auto-discovery.md
          - MARKERS.md: MARKERS.md
          - IDE Plugins: ide-plugins.md
      - LLM and image providers:
          - Unified LLM Effects: llm_unified_effects.md
          - Gemini Setup: gemini_client_setup.md
          - Gemini Cost Hook: gemini_cost_hook.md
          - seedream.md: seedream.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The click-through figures (docs/assets/figures/): tools/docs_site/hooks.py puts a figure in the page, and these move it.
extra_css:
  - assets/figures/step-figure.css
extra_javascript:
  - assets/figures/step-figure.js

markdown_extensions:
  - admonition
  # Lets a page fold its code with <details markdown="1">: GitHub folds the same block, so one line of Markdown works in both places.
  - md_in_html
  - footnotes
  - tables
  # Make heading anchors the same way GitHub does — the in-page links (#overview--motivation and so on) were written on GitHub.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Draw ```mermaid fences as diagrams (the Material way).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Make pages written to be read on GitHub read the same on the site — turn relative links to repo files outside the site into GitHub links,
# and drop the marks after the language at the head of a fence (such as the excerpts the docs example tests read). The reasons are at the head of the hook.
hooks:
  - tools/docs_site/hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
