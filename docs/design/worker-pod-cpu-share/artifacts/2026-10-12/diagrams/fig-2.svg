<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="service の和の CPU の待ち(平均)。Pod の外 8 core 未満の窓 6%、8 core 以上の窓 19%、準備の焼きの山の窓 59%、この card の所見の agora-record 58〜82%">
  <!-- 目盛りの線 -->
  <g stroke="var(--kit-row-edge)" stroke-width="1">
    <line x1="470" y1="14" x2="470" y2="240"/>
    <line x1="610" y1="14" x2="610" y2="240"/>
    <line x1="750" y1="14" x2="750" y2="240"/>
    <line x1="890" y1="14" x2="890" y2="240"/>
  </g>
  <line x1="330" y1="14" x2="330" y2="240" stroke="var(--kit-text-faint)" stroke-width="1.5"/>
  <g font-size="12" fill="var(--kit-text-muted)" text-anchor="middle">
    <text x="330" y="258">0%</text>
    <text x="470" y="258">25%</text>
    <text x="610" y="258">50%</text>
    <text x="750" y="258">75%</text>
    <text x="890" y="258">100%</text>
  </g>
  <text x="890" y="280" font-size="12.5" text-anchor="end" fill="var(--kit-text-muted)">CPU の待ち</text>

  <!-- 行の名 -->
  <g text-anchor="end">
    <text x="314" y="39" font-size="14" font-weight="600" fill="var(--kit-text)">Pod の外 8 core 未満の窓</text>
    <text x="314" y="57" font-size="12.5" fill="var(--kit-text-muted)">17 窓</text>

    <text x="314" y="97" font-size="14" font-weight="600" fill="var(--kit-text)">Pod の外 8 core 以上の窓</text>
    <text x="314" y="115" font-size="12.5" fill="var(--kit-text-muted)">50 窓</text>

    <text x="314" y="155" font-size="14" font-weight="600" fill="var(--kit-text)">準備の焼きの山の窓</text>
    <text x="314" y="173" font-size="12.5" fill="var(--kit-text-muted)">1 窓・nice 10 が 31.5 本</text>

    <text x="314" y="213" font-size="14" font-weight="600" fill="var(--kit-text)">この card の所見</text>
    <text x="314" y="231" font-size="12.5" fill="var(--kit-text-muted)">load 103〜141・agora-record</text>
  </g>

  <!-- 棒(service の和の平均) -->
  <rect x="330" y="28" width="33.6" height="28" rx="3" fill="var(--kit-violet)"/>
  <rect x="330" y="86" width="106.4" height="28" rx="3" fill="var(--kit-violet)"/>
  <rect x="330" y="144" width="330.4" height="28" rx="3" fill="var(--kit-violet)"/>

  <!-- 範囲(agora-record 58〜82%) -->
  <line x1="330" y1="216" x2="654.8" y2="216" stroke="var(--kit-row-edge)" stroke-width="1.5" stroke-dasharray="3 4"/>
  <rect x="654.8" y="202" width="134.4" height="28" rx="3" fill="var(--kit-teal)"/>

  <!-- 値 -->
  <g font-size="14" font-weight="700" fill="var(--kit-text)">
    <text x="371.6" y="47">6%</text>
    <text x="444.4" y="105">19%</text>
    <text x="668.4" y="163">59%</text>
    <text x="797.2" y="221">58〜82%</text>
  </g>

  <!-- 3 倍の括り -->
  <path d="M492 42 H502 V100 H492" stroke="var(--kit-text-muted)" stroke-width="1.5" fill="none"/>
  <text x="510" y="76" font-size="13.5" font-weight="600" fill="var(--kit-text-body)">3 倍</text>

  <!-- 凡例 -->
  <rect x="0" y="270" width="16" height="12" rx="2" fill="var(--kit-violet)"/>
  <text x="22" y="281" font-size="12.5" fill="var(--kit-text-body)">service の和(平均)</text>
  <rect x="170" y="270" width="16" height="12" rx="2" fill="var(--kit-teal)"/>
  <text x="192" y="281" font-size="12.5" fill="var(--kit-text-body)">agora-record(範囲)</text>
</svg>
