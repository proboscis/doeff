<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1480" viewBox="0 0 1280 1480">
  <!-- recorded()の組で、make_memo_rewriterが保存と通信の位置へ出すエフェクトの順(英語の記事の表の1行目の図)。
       1回目はファイルが空でnetworkはgithub、2回目は同じファイルでnetworkはoffline。 -->
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f8b8d"/>
    </marker>
    <style>
      .ja { font-family: "IPAGothic", sans-serif; fill: #1f2d4d; }
      .code { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; fill: #1f2d4d; }
      .life { stroke: #9aa7c0; stroke-width: 4; stroke-dasharray: 14 12; }
      .call { stroke: #0f8b8d; stroke-width: 7; fill: none; }
      .back { stroke: #0f8b8d; stroke-width: 7; fill: none; stroke-dasharray: 18 12; }
    </style>
  </defs>
  <rect width="1280" height="1480" fill="#ffffff"/>

  <text class="ja" x="640" y="74" font-size="42" font-weight="bold" text-anchor="middle">保存に在れば、通信の位置まで届かない</text>

  <!-- 4つの参加者(内から外へ) -->
  <rect x="10" y="120" width="300" height="130" rx="22" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="code" x="160" y="178" font-size="26" font-weight="bold" text-anchor="middle">latest_releases</text>
  <text class="ja" x="160" y="226" font-size="28" text-anchor="middle">(プログラム)</text>
  <rect x="330" y="120" width="300" height="130" rx="22" fill="#eee8f8" stroke="#b9a6e0" stroke-width="3"/>
  <text class="code" x="480" y="178" font-size="24" font-weight="bold" text-anchor="middle">make_memo_rewriter</text>
  <text class="ja" x="480" y="226" font-size="28" text-anchor="middle">(記録と再生を1つに)</text>
  <rect x="650" y="120" width="300" height="130" rx="22" fill="#e3eefc" stroke="#9dbbe8" stroke-width="3"/>
  <text class="code" x="800" y="178" font-size="30" font-weight="bold" text-anchor="middle">json_tape</text>
  <text class="ja" x="800" y="226" font-size="28" text-anchor="middle">(JSONのファイル)</text>
  <rect x="970" y="120" width="300" height="130" rx="22" fill="#fff6dc" stroke="#e5c66b" stroke-width="3"/>
  <text class="code" x="1120" y="178" font-size="30" font-weight="bold" text-anchor="middle">network</text>
  <text class="ja" x="1120" y="226" font-size="28" text-anchor="middle">(通信の位置)</text>

  <line class="life" x1="160" y1="250" x2="160" y2="1440"/>
  <line class="life" x1="480" y1="250" x2="480" y2="1440"/>
  <line class="life" x1="800" y1="250" x2="800" y2="1440"/>
  <line class="life" x1="1120" y1="250" x2="1120" y2="1440"/>

  <!-- 1回目: ファイルは空。保存に無いので、依頼を外へ出して答えを残す -->
  <rect x="10" y="280" width="1260" height="56" rx="12" fill="#f2f4f8" stroke="#c9d1e0" stroke-width="2"/>
  <text class="ja" x="30" y="318" font-size="30" font-weight="bold">1回目:ファイルは空(networkはgithub)</text>

  <text class="code" x="320" y="388" font-size="26" text-anchor="middle">① HttpRequest</text>
  <line class="call" x1="170" y1="410" x2="466" y2="410" marker-end="url(#arrow)"/>

  <text class="code" x="640" y="468" font-size="26" text-anchor="middle">② MemoExists(key)</text>
  <line class="call" x1="490" y1="490" x2="786" y2="490" marker-end="url(#arrow)"/>

  <text class="ja" x="640" y="538" font-size="28" text-anchor="middle">無い</text>
  <line class="back" x1="790" y1="560" x2="494" y2="560" marker-end="url(#arrow)"/>

  <text class="ja" x="800" y="618" font-size="28" text-anchor="middle">③ HttpRequestを外へ出す</text>
  <line class="call" x1="490" y1="640" x2="1106" y2="640" marker-end="url(#arrow)"/>

  <text class="code" x="800" y="698" font-size="26" text-anchor="middle">{"tag_name": "v2.4.1"}</text>
  <line class="back" x1="1110" y1="720" x2="494" y2="720" marker-end="url(#arrow)"/>

  <text class="code" x="640" y="778" font-size="26" text-anchor="middle">④ MemoPut(key, answer)</text>
  <line class="call" x1="490" y1="800" x2="786" y2="800" marker-end="url(#arrow)"/>

  <text class="code" x="320" y="858" font-size="26" text-anchor="middle">⑤ Resume(k, answer)</text>
  <line class="back" x1="470" y1="880" x2="174" y2="880" marker-end="url(#arrow)"/>

  <!-- 2回目: 新しい組と同じファイル。保存に在るので、保存から答える -->
  <rect x="10" y="920" width="1260" height="56" rx="12" fill="#f2f4f8" stroke="#c9d1e0" stroke-width="2"/>
  <text class="ja" x="30" y="958" font-size="30" font-weight="bold">2回目:同じファイル(networkはoffline)</text>

  <text class="code" x="320" y="1028" font-size="26" text-anchor="middle">① HttpRequest</text>
  <line class="call" x1="170" y1="1050" x2="466" y2="1050" marker-end="url(#arrow)"/>

  <text class="code" x="640" y="1108" font-size="26" text-anchor="middle">② MemoExists(key)</text>
  <line class="call" x1="490" y1="1130" x2="786" y2="1130" marker-end="url(#arrow)"/>

  <text class="ja" x="640" y="1178" font-size="28" text-anchor="middle">在る</text>
  <line class="back" x1="790" y1="1200" x2="494" y2="1200" marker-end="url(#arrow)"/>

  <text class="code" x="640" y="1258" font-size="26" text-anchor="middle">③ MemoGet(key)</text>
  <line class="call" x1="490" y1="1280" x2="786" y2="1280" marker-end="url(#arrow)"/>

  <text class="ja" x="640" y="1328" font-size="28" text-anchor="middle">保存した答え</text>
  <line class="back" x1="790" y1="1350" x2="494" y2="1350" marker-end="url(#arrow)"/>

  <text class="ja" x="316" y="1398" font-size="26" text-anchor="middle">④ Resume(k, 保存した答え)</text>
  <line class="back" x1="470" y1="1420" x2="174" y2="1420" marker-end="url(#arrow)"/>

  <!-- 2回目は、offlineに依頼が届かない -->
  <rect x="980" y="1090" width="280" height="150" rx="20" fill="#fff6dc" stroke="#e5c66b" stroke-width="3"/>
  <text class="code" x="1120" y="1150" font-size="28" font-weight="bold" text-anchor="middle">offline</text>
  <text class="ja" x="1120" y="1200" font-size="28" text-anchor="middle">まで届かない</text>
</svg>
