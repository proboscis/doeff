<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1560" viewBox="0 0 1080 1560">
  <!-- budget(5)(research(TOPICS))の実行を、やりとり1つずつ示す(英語の記事のsequenceDiagramの訳)。 -->
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f8b8d"/>
    </marker>
    <style>
      .ja { font-family: "IPAGothic", sans-serif; fill: #1f2d4d; }
      .code { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; fill: #1f2d4d; }
    </style>
  </defs>
  <rect width="1080" height="1560" fill="#ffffff"/>

  <text class="ja" x="540" y="76" font-size="44" font-weight="bold" text-anchor="middle">budget(5)が、2回目のSpendで続きを捨てる</text>

  <rect x="60" y="120" width="960" height="190" rx="24" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="ja" x="95" y="176" font-size="40" font-weight="bold">① research</text>
  <text class="code" x="95" y="244" font-size="44" xml:space="preserve">yield Spend(3)</text>
  <text class="ja" x="95" y="292" font-size="36">1つ目の話題で止まる(続きがk)</text>

  <line x1="200" y1="318" x2="200" y2="392" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="368" font-size="38">Spendとkがbudgetに届く</text>

  <rect x="60" y="400" width="960" height="190" rx="24" fill="#eee8f8" stroke="#b9a6e0" stroke-width="3"/>
  <text class="ja" x="95" y="456" font-size="40" font-weight="bold">② budget(5)</text>
  <text class="ja" x="95" y="512" font-size="36">3は残りの5に収まる → left = 2</text>
  <text class="code" x="95" y="568" font-size="44" xml:space="preserve">yield Resume(k, None)</text>

  <line x1="200" y1="598" x2="200" y2="672" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="648" font-size="38">researchが続きから進む</text>

  <rect x="60" y="680" width="960" height="250" rx="24" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="ja" x="95" y="736" font-size="40" font-weight="bold">③ research</text>
  <text class="ja" x="95" y="792" font-size="36">notes on tides のメモができる</text>
  <text class="code" x="95" y="856" font-size="44" xml:space="preserve">yield Spend(3)</text>
  <text class="ja" x="95" y="908" font-size="36">2つ目の話題で、また止まる</text>

  <line x1="200" y1="938" x2="200" y2="1012" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="988" font-size="38">Spendとkがbudgetに届く</text>

  <rect x="60" y="1020" width="960" height="190" rx="24" fill="#fdecea" stroke="#e8a59c" stroke-width="3"/>
  <text class="ja" x="95" y="1076" font-size="40" font-weight="bold">④ budget(5)</text>
  <text class="ja" x="95" y="1132" font-size="36">3は残りの2に収まらない → kを捨てる</text>
  <text class="code" x="95" y="1188" font-size="44" xml:space="preserve">return "over budget"</text>

  <line x1="200" y1="1218" x2="200" y2="1292" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="1268" font-size="38">researchは再開されない</text>

  <rect x="60" y="1300" width="960" height="200" rx="24" fill="#fff6dc" stroke="#e5c66b" stroke-width="3"/>
  <text class="ja" x="95" y="1356" font-size="40" font-weight="bold">⑤ run() の結果</text>
  <text class="code" x="95" y="1424" font-size="44" xml:space="preserve">"over budget"</text>
  <text class="ja" x="95" y="1476" font-size="36">2つ目の話題(moons)は調べられない</text>
</svg>
