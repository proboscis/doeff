<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" font-family="IPAPGothic, IPAGothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="1200" height="1100" fill="#ffffff"/>
  <text x="600" y="62" text-anchor="middle" font-size="40" font-weight="bold" fill="#111827">同じbuildを、ハンドラの組を替えて組み直す</text>

  <!-- 上の左: build -->
  <rect x="40" y="100" width="640" height="230" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="70" y="142" font-size="26" font-weight="bold" fill="#111827">build(content) — 1つだけ書く</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#111827">
    <text x="70" y="190">for match in FIGURE.finditer(content):</text>
    <text x="100" y="226">svg = <tspan font-weight="bold" fill="#0f766e">yield DrawnFigure(id)</tspan></text>
    <text x="100" y="262">drawn += svg is not None</text>
    <text x="70" y="298">return page, drawn, total</text>
  </g>

  <!-- 上の右: 中身のファイル -->
  <rect x="720" y="100" width="440" height="230" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <text x="940" y="142" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f766e">中身のファイル(会話が書く)</text>
  <g font-family="DejaVu Sans Mono, IPAGothic, monospace" font-size="20" fill="#111827">
    <text x="750" y="190"># 検索の応答が遅くなった件</text>
    <text x="750" y="226">## 結論 …</text>
    <text x="750" y="262">~~~図 fig-1 …</text>
    <text x="750" y="298">~~~図 fig-2 …</text>
  </g>
  <line x1="720" y1="215" x2="686" y2="215" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="360" y1="330" x2="360" y2="392" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="384" y="368" font-size="22" fill="#111827">DrawnFigure(id)を外側へ。担当外はPassで、さらに外へ</text>

  <!-- 1回目の組 -->
  <text x="40" y="430" font-size="26" font-weight="bold" fill="#4b5563">1回目: with_handlers([not_yet], build(content))</text>
  <rect x="40" y="448" width="640" height="110" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="70" y="492" font-size="26" font-weight="bold" fill="#c2410c">not_yet</text>
  <text x="70" y="532" font-size="22" fill="#111827">どの図にも「まだ無い」(None)と答える</text>
  <line x1="680" y1="503" x2="752" y2="503" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="760" y="448" width="400" height="110" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="960" y="492" text-anchor="middle" font-size="30" font-weight="bold" fill="#111827">図 0/2</text>
  <text x="960" y="532" text-anchor="middle" font-size="22" fill="#111827">文章と表が先に開く(作成中の枠2つ)</text>

  <!-- 作業役 -->
  <line x1="960" y1="558" x2="960" y2="640" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="574" width="880" height="56" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="70" y="610" font-size="22" fill="#1d4ed8">作業役が figures/fig-1.svg と fig-2.svg を置き、build し直す(例の試しで90秒)</text>

  <!-- 2回目の組 -->
  <text x="40" y="690" font-size="26" font-weight="bold" fill="#4b5563">2回目: with_handlers([not_yet, from_dir(figures)], …)</text>
  <rect x="40" y="708" width="640" height="200" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="70" y="750" font-size="26" font-weight="bold" fill="#c2410c">not_yet(外側)</text>
  <text x="70" y="786" font-size="22" fill="#111827">from_dirから渡ってきた図に、None と答える</text>
  <rect x="70" y="804" width="580" height="84" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="96" y="840" font-size="24" font-weight="bold" fill="#1d4ed8">from_dir(内側・先に受ける)</text>
  <text x="96" y="872" font-size="21" fill="#111827">置かれた図はSVGを返す・無い図はPassで外へ</text>
  <line x1="680" y1="808" x2="752" y2="808" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="760" y="648" width="400" height="260" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="960" y="790" text-anchor="middle" font-size="30" font-weight="bold" fill="#111827">図 2/2</text>
  <text x="960" y="830" text-anchor="middle" font-size="22" fill="#111827">描けた図から入る</text>
  <text x="960" y="862" text-anchor="middle" font-size="22" fill="#111827">文章を直しても図は消えない</text>

  <!-- 試しの時間の帯 -->
  <text x="40" y="964" font-size="24" font-weight="bold" fill="#111827">2026年10月1日の試し: 頼んでから開くまで5分36秒(長さは秒に比例)</text>
  <rect x="40" y="984" width="189" height="56" fill="#0f766e"/>
  <rect x="231" y="984" width="70" height="56" fill="#9ca3af"/>
  <rect x="303" y="984" width="857" height="56" fill="#1d4ed8"/>
  <text x="134" y="1020" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">中身 57秒</text>
  <text x="266" y="1072" text-anchor="middle" font-size="20" fill="#4b5563">起動 21秒</text>
  <text x="731" y="1020" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">作業役が図4つと見た目を作って開く 4分18秒</text>
</svg>
