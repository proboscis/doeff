<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 880" width="1200" height="1760">
  <style>
    text { font-family: "IPAPGothic", "IPAGothic", "Noto Sans CJK JP", sans-serif; fill: #1b2a4a; }
    .title { font-size: 25px; font-weight: bold; }
    .sub { font-size: 19px; fill: #4a5878; }
    .head { font-size: 21px; font-weight: bold; }
    .body { font-size: 19px; }
    .muted { font-size: 18px; fill: #4a5878; }
    .code { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; font-size: 18px; }
    .name { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; font-size: 18px; font-weight: bold; }
    .num { font-size: 22px; font-weight: bold; fill: #ffffff; }
    .flow { stroke: #0e7c86; stroke-width: 3.5; fill: none; }
    .answer { stroke: #0e7c86; stroke-width: 3.5; fill: none; stroke-dasharray: 9 7; }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/>
    </marker>
  </defs>
  <rect width="600" height="880" fill="#ffffff"/>

  <text class="title" x="300" y="48" text-anchor="middle">awaitは実装を進め、yieldは依頼を外側へ出す</text>
  <text class="sub" x="300" y="82" text-anchor="middle">違うのは、止まった所へ値を返す者</text>

  <!-- ① async/await -->
  <rect x="40" y="104" width="520" height="306" rx="14" fill="#f4f5f8" stroke="#b9c0cc" stroke-width="2"/>
  <circle cx="72" cy="136" r="17" fill="#5b6478"/><text class="num" x="72" y="144" text-anchor="middle">1</text>
  <text class="head" x="100" y="143">async/await(呼んだ実装を進める)</text>

  <rect x="60" y="160" width="480" height="62" rx="10" fill="#ffffff" stroke="#b9c0cc" stroke-width="2"/>
  <text class="code" x="76" y="186">async def greet_async():</text>
  <text class="code" x="119" y="212">name = await read_name_async()</text>

  <path class="flow" d="M160,226 V282" marker-end="url(#tip)"/>
  <text class="body" x="172" y="260">呼んだ実装へ進む</text>
  <path class="answer" d="M420,282 V226" marker-end="url(#tip)"/>
  <text class="body" x="432" y="260">戻り値「花子」</text>

  <rect x="60" y="286" width="480" height="62" rx="10" fill="#ffffff" stroke="#b9c0cc" stroke-width="2"/>
  <text class="code" x="76" y="312">async def read_name_async():</text>
  <text class="code" x="119" y="338">return "花子"</text>
  <text class="muted" x="300" y="338">← 名前は実装が決める</text>

  <text class="muted" x="64" y="376">動かすのは、asyncioなどのイベントループ</text>
  <text class="muted" x="64" y="400">替えるには、patchを当てるか、関数を引数で渡す</text>

  <!-- ② doeffのyield -->
  <rect x="40" y="430" width="520" height="380" rx="14" fill="#e9f1fc" stroke="#9db8e0" stroke-width="2"/>
  <circle cx="72" cy="462" r="17" fill="#2f5aa8"/><text class="num" x="72" y="470" text-anchor="middle">2</text>
  <text class="head" x="100" y="469">doeffのyield(依頼を外側へ出す)</text>

  <rect x="60" y="486" width="480" height="62" rx="10" fill="#ffffff" stroke="#9db8e0" stroke-width="2"/>
  <text class="code" x="76" y="512">@do def greet():</text>
  <text class="code" x="119" y="538">name = yield ReadName()</text>

  <path class="flow" d="M160,552 V608" marker-end="url(#tip)"/>
  <text class="body" x="172" y="586">依頼を出して止まる</text>
  <path class="answer" d="M400,608 V552" marker-end="url(#tip)"/>
  <text class="code" x="412" y="586" style="font-size:17px">Resume(k, 値)</text>

  <rect x="60" y="612" width="480" height="150" rx="10" fill="#f6f8fb" stroke="#9db8e0" stroke-width="2"/>
  <text class="head" x="76" y="640">外側に付けたハンドラ(どれか1つ)</text>
  <rect x="76" y="654" width="448" height="44" rx="8" fill="#e4f5ee" stroke="#8fcfb3" stroke-width="2"/>
  <text class="name" x="92" y="683">hanako</text>
  <text class="body" x="200" y="683">「花子」で続きを動かす</text>
  <rect x="76" y="706" width="448" height="44" rx="8" fill="#e4f5ee" stroke="#8fcfb3" stroke-width="2"/>
  <text class="name" x="92" y="735">taro</text>
  <text class="body" x="200" y="735">「太郎」で続きを動かす</text>

  <text class="muted" x="64" y="788">greetは変えずに、付けるハンドラだけを替える</text>

  <!-- 凡例 -->
  <text class="head" x="40" y="852" style="font-size:18px">凡例</text>
  <path class="flow" d="M92,846 H140" marker-end="url(#tip)"/>
  <text class="muted" x="148" y="852">進む・依頼する</text>
  <path class="answer" d="M290,846 H338" marker-end="url(#tip)"/>
  <text class="muted" x="346" y="852">値が戻り、続きが動く</text>
</svg>
