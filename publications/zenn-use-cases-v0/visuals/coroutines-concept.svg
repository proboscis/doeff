<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200">
  <!-- drive.pyのtwice_asyncをasyncioで走らせた時の、要求と再開の往復(英語の記事の1枚目のsequenceDiagramの訳)。 -->
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f8b8d"/>
    </marker>
    <style>
      .ja { font-family: "IPAGothic", sans-serif; fill: #1f2d4d; }
      .code { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; fill: #1f2d4d; }
      .life { stroke: #9aa7c0; stroke-width: 4; stroke-dasharray: 14 12; }
      .call { stroke: #0f8b8d; stroke-width: 7; fill: none; }
      .back { stroke: #0f8b8d; stroke-width: 7; fill: none; stroke-dasharray: 18 12; }
    </style>
  </defs>
  <rect width="1080" height="1200" fill="#ffffff"/>

  <text class="ja" x="540" y="70" font-size="42" font-weight="bold" text-anchor="middle">awaitの要求は、間のcoroutineを</text>
  <text class="ja" x="540" y="124" font-size="42" font-weight="bold" text-anchor="middle">素通りしてTaskへ届く</text>

  <!-- 3つの参加者 -->
  <rect x="40" y="170" width="300" height="120" rx="22" fill="#fff6dc" stroke="#e5c66b" stroke-width="3"/>
  <text class="ja" x="190" y="220" font-size="34" text-anchor="middle">イベントループの</text>
  <text class="code" x="190" y="268" font-size="38" font-weight="bold" text-anchor="middle">Task</text>
  <rect x="390" y="170" width="300" height="120" rx="22" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="code" x="540" y="244" font-size="36" font-weight="bold" text-anchor="middle">twice_async</text>
  <rect x="740" y="170" width="300" height="120" rx="22" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="code" x="890" y="244" font-size="36" font-weight="bold" text-anchor="middle">greet_async</text>

  <line class="life" x1="190" y1="290" x2="190" y2="1090"/>
  <line class="life" x1="540" y1="290" x2="540" y2="1090"/>
  <line class="life" x1="890" y1="290" x2="890" y2="1090"/>

  <!-- ① Taskがtwice_asyncを進める -->
  <text class="code" x="365" y="368" font-size="32" text-anchor="middle">① send(None)</text>
  <line class="call" x1="200" y1="392" x2="526" y2="392" marker-end="url(#arrow)"/>

  <!-- ② twice_asyncがgreet_asyncを呼ぶ -->
  <text class="code" x="712" y="498" font-size="27" text-anchor="middle">② await greet_async()</text>
  <line class="call" x1="550" y1="522" x2="876" y2="522" marker-end="url(#arrow)"/>
  <text class="ja" x="715" y="572" font-size="32" text-anchor="middle">ただの呼び出し</text>

  <!-- ③ 要求は、twice_asyncを素通りしてTaskへ -->
  <text class="ja" x="540" y="668" font-size="34" text-anchor="middle">③ 要求をyieldする</text>
  <line class="call" x1="880" y1="692" x2="204" y2="692" marker-end="url(#arrow)"/>
  <text class="ja" x="540" y="742" font-size="32" text-anchor="middle">twice_asyncを素通り</text>

  <rect x="40" y="782" width="420" height="110" rx="22" fill="#fdecea" stroke="#e8a59c" stroke-width="3"/>
  <text class="ja" x="250" y="830" font-size="34" font-weight="bold" text-anchor="middle">受け取るのは、</text>
  <text class="ja" x="250" y="874" font-size="34" font-weight="bold" text-anchor="middle">ここだけ</text>

  <!-- ④ Taskが、greet_asyncを直に進める -->
  <text class="code" x="540" y="968" font-size="32" text-anchor="middle">④ send(None)</text>
  <line class="back" x1="200" y1="992" x2="876" y2="992" marker-end="url(#arrow)"/>
  <text class="ja" x="540" y="1042" font-size="32" text-anchor="middle">twice_asyncを素通り</text>

  <text class="ja" x="540" y="1150" font-size="32" text-anchor="middle">twice_asyncは、要求を見ず、答えず、変えない</text>
</svg>
