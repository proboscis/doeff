<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" font-family="IPAPGothic, IPAGothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="jump" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1200" height="1040" fill="#ffffff"/>
  <text x="600" y="72" text-anchor="middle" font-size="44" font-weight="bold" fill="#111827">仮想時計は、次の予定の時刻へ飛ぶ</text>

  <!-- 目盛り -->
  <text x="40" y="140" font-size="28" fill="#4b5563">仮想時刻</text>
  <g font-size="30" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="320" y="140">0秒</text>
    <text x="710" y="140">10秒</text>
    <text x="1100" y="140">20秒</text>
  </g>
  <g stroke="#d1d5db" stroke-width="2" stroke-dasharray="8 8">
    <line x1="320" y1="158" x2="320" y2="560"/>
    <line x1="710" y1="158" x2="710" y2="560"/>
    <line x1="1100" y1="158" x2="1100" y2="560"/>
  </g>

  <!-- worker(20) -->
  <text x="40" y="226" font-size="28" font-family="DejaVu Sans Mono, monospace" fill="#111827">worker(20)</text>
  <rect x="320" y="190" width="780" height="50" rx="10" fill="#d1fae5"/>
  <text x="340" y="226" font-size="26" fill="#065f46">Delay(20) で待つ</text>
  <circle cx="1100" cy="215" r="14" fill="#0f766e"/>
  <text x="1080" y="282" text-anchor="end" font-size="26" fill="#111827">20秒で再開</text>

  <!-- worker(10) -->
  <text x="40" y="346" font-size="28" font-family="DejaVu Sans Mono, monospace" fill="#111827">worker(10)</text>
  <rect x="320" y="310" width="390" height="50" rx="10" fill="#d1fae5"/>
  <text x="340" y="346" font-size="26" fill="#065f46">Delay(10) で待つ</text>
  <circle cx="710" cy="335" r="14" fill="#0f766e"/>
  <text x="730" y="346" font-size="26" fill="#111827">10秒で再開</text>

  <!-- 時計 -->
  <text x="40" y="486" font-size="28" fill="#111827">時計</text>
  <circle cx="320" cy="476" r="12" fill="#0f766e"/>
  <circle cx="710" cy="476" r="12" fill="#0f766e"/>
  <circle cx="1100" cy="476" r="12" fill="#0f766e"/>
  <path d="M 330 466 Q 515 386 700 466" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#jump)"/>
  <path d="M 720 466 Q 905 386 1090 466" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#jump)"/>
  <text x="515" y="530" text-anchor="middle" font-size="24" fill="#065f46">動けるタスクが無い</text>
  <text x="515" y="562" text-anchor="middle" font-size="24" fill="#065f46">→ 10秒へ飛ぶ</text>
  <text x="905" y="530" text-anchor="middle" font-size="24" fill="#065f46">動けるタスクが無い</text>
  <text x="905" y="562" text-anchor="middle" font-size="24" fill="#065f46">→ 20秒へ飛ぶ</text>

  <!-- Gather -->
  <rect x="40" y="606" width="1120" height="120" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="70" y="656" font-size="30" font-family="DejaVu Sans Mono, monospace" fill="#111827">Gather(slow, fast)</text>
  <line x1="420" y1="646" x2="520" y2="646" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="540" y="658" font-size="34" font-weight="bold" font-family="DejaVu Sans Mono, monospace" fill="#111827">[20.0, 10.0]</text>
  <text x="70" y="704" font-size="26" fill="#4b5563">渡した順に返す（終わった順ではない）</text>

  <!-- 実時間 -->
  <text x="40" y="792" font-size="30" font-weight="bold" fill="#111827">かかった実時間（2026-10-16に測定）</text>
  <text x="40" y="860" font-size="28" fill="#0f766e" font-weight="bold">仮想時計</text>
  <rect x="320" y="830" width="6" height="44" fill="#0f766e"/>
  <text x="344" y="862" font-size="28" fill="#111827">0.01秒未満</text>
  <text x="40" y="950" font-size="28" fill="#c2410c" font-weight="bold">実時間の時計</text>
  <rect x="320" y="920" width="780" height="44" rx="6" fill="#fdba74"/>
  <text x="1090" y="952" text-anchor="end" font-size="28" fill="#111827">20.09秒</text>
  <text x="40" y="1012" font-size="22" fill="#6b7280">同じworkflowを1回走らせた時間。横棒の長さは秒数に比例する。</text>
</svg>
