<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1760" viewBox="0 0 1080 1760">
  <!-- scheduled(virtual_clock(START)(two_naps()))の実行を、やりとり1つずつ示す(英語の3本目の記事のsequenceDiagramの訳)。 -->
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f8b8d"/>
    </marker>
    <style>
      .ja { font-family: "IPAGothic", sans-serif; fill: #1f2d4d; }
      .code { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; fill: #1f2d4d; }
    </style>
  </defs>
  <rect width="1080" height="1760" fill="#ffffff"/>

  <text class="ja" x="540" y="76" font-size="42" font-weight="bold" text-anchor="middle">virtual_clockが、待つkを持って時計を進める</text>

  <rect x="60" y="120" width="960" height="190" rx="24" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="ja" x="95" y="176" font-size="40" font-weight="bold">① nap(20)</text>
  <text class="code" x="95" y="244" font-size="44" xml:space="preserve">yield Delay(20)</text>
  <text class="ja" x="95" y="292" font-size="36">止まり、続きをk1として時計に預ける</text>

  <line x1="200" y1="318" x2="200" y2="392" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="368" font-size="38">時計は、k1を再開しない</text>

  <rect x="60" y="400" width="960" height="190" rx="24" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="ja" x="95" y="456" font-size="40" font-weight="bold">② nap(10)</text>
  <text class="code" x="95" y="524" font-size="44" xml:space="preserve">yield Delay(10)</text>
  <text class="ja" x="95" y="572" font-size="36">止まり、続きをk2として時計に預ける</text>

  <line x1="200" y1="598" x2="200" y2="672" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="648" font-size="38">どのタスクも動けない</text>

  <rect x="60" y="680" width="960" height="190" rx="24" fill="#eee8f8" stroke="#b9a6e0" stroke-width="3"/>
  <text class="ja" x="95" y="736" font-size="40" font-weight="bold">③ virtual_clock(advance)</text>
  <text class="ja" x="95" y="792" font-size="36">時刻をいちばん早い起床の09:00:10へ進める</text>
  <text class="code" x="95" y="852" font-size="44" xml:space="preserve">Resume(k2, None)</text>

  <line x1="200" y1="878" x2="200" y2="952" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="928" font-size="38">nap(10)が続きから進む</text>

  <rect x="60" y="960" width="960" height="250" rx="24" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="ja" x="95" y="1016" font-size="40" font-weight="bold">④ nap(10)と時計</text>
  <text class="code" x="95" y="1078" font-size="44" xml:space="preserve">yield GetTime()</text>
  <text class="code" x="95" y="1138" font-size="44" xml:space="preserve">Resume(k2, 09:00:10)</text>
  <text class="ja" x="95" y="1190" font-size="36">nap(10)は09:00:10を返して終わる</text>

  <line x1="200" y1="1218" x2="200" y2="1292" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="1268" font-size="38">また、どのタスクも動けない</text>

  <rect x="60" y="1300" width="960" height="190" rx="24" fill="#eee8f8" stroke="#b9a6e0" stroke-width="3"/>
  <text class="ja" x="95" y="1356" font-size="40" font-weight="bold">⑤ virtual_clock(advance)</text>
  <text class="ja" x="95" y="1412" font-size="36">時刻を次の起床の09:00:20へ進める</text>
  <text class="code" x="95" y="1472" font-size="44" xml:space="preserve">Resume(k1, None)</text>

  <line x1="200" y1="1498" x2="200" y2="1572" stroke="#0f8b8d" stroke-width="8" marker-end="url(#arrow)"/>
  <text class="ja" x="230" y="1548" font-size="38">nap(20)も時刻を問い、09:00:20で終わる</text>

  <rect x="60" y="1580" width="960" height="150" rx="24" fill="#fff6dc" stroke="#e5c66b" stroke-width="3"/>
  <text class="ja" x="95" y="1636" font-size="40" font-weight="bold">⑥ two_napsの結果</text>
  <text class="code" x="95" y="1704" font-size="44" xml:space="preserve">[20.0, 10.0]</text>
  <text class="ja" x="450" y="1702" font-size="36">実時間はほぼ0秒</text>
</svg>
