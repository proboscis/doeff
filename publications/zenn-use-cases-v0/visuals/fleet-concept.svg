  <text x="151" y="1022" font-size="24" fill="#111827">仕事中</text>
  <rect x="250" y="1002" width="26" height="22" rx="5" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="286" y="1022" font-size="24" fill="#111827">空き(塗りの数は例)</text>
  <text x="115" y="1058" font-size="24" fill="#111827">各会話: ブランチを切る → commit → push</text>

  <line x1="420" y1="1075" x2="420" y2="1135" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="444" y="1113" font-size="26" fill="#111827">変更を列に載せる</text>

  <!-- ③ マージの列 -->
  <rect x="60" y="1140" width="720" height="140" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="90" y="1182" font-size="30" font-weight="bold" fill="#111827">③ マージの列</text>
  <text x="90" y="1224" font-size="26" fill="#111827">衝突の印だけを見て、mainの先端へ入れる</text>
  <text x="90" y="1262" font-size="24" fill="#4b5563">テストは別の便で1日1回 → 安定版のブランチ</text>

  <line x1="420" y1="1280" x2="420" y2="1330" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="330" y="1335" width="180" height="60" rx="30" fill="#111827"/>
  <text x="420" y="1375" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff">main</text>

  <!-- 戻りの矢印: 報告して card を done へ -->
  <path d="M780,880 L860,880 L860,370 L786,370" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-teal)"/>
  <text x="880" y="600" font-size="26" fill="#0f766e">報告して、</text>
  <text x="880" y="636" font-size="26" fill="#0f766e">cardをdoneへ</text>

  <!-- 戻りの矢印: 判断が要る時だけ問う -->
  <path d="M780,950 L1140,950 L1140,165 L786,165" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-orange)"/>
  <text x="800" y="148" font-size="26" fill="#c2410c">判断が要る時だけ問う</text>
  <text x="880" y="760" font-size="24" fill="#4b5563">返事の終わりに</text>
  <text x="880" y="792" font-size="24" fill="#4b5563">待っている物を</text>
  <text x="880" y="824" font-size="24" fill="#4b5563">2行で書く</text>
