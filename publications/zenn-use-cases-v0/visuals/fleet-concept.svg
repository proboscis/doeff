<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" font-family="IPAPGothic, IPAGothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1200" height="1420" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-size="44" font-weight="bold" fill="#111827">1人と最大50の会話の間に、3つの仕組みを置く</text>

  <!-- 人 -->
  <rect x="60" y="110" width="720" height="110" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="420" y="153" text-anchor="middle" font-size="32" font-weight="bold" fill="#c2410c">人(1人)</text>
  <text x="420" y="198" text-anchor="middle" font-size="26" fill="#111827">目標とcardを書く・問われた時だけ答える</text>

  <line x1="420" y1="220" x2="420" y2="280" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="444" y="258" font-size="26" fill="#111827">cardを書く</text>

  <!-- ① 作業ボード -->
  <rect x="60" y="285" width="720" height="195" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="90" y="327" font-size="30" font-weight="bold" fill="#111827">① 作業ボード</text>
  <text x="90" y="367" font-size="26" fill="#111827">1枚 = 本文・受け入れの条件・先に終わるべきcard</text>
  <rect x="90" y="385" width="200" height="42" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="190" y="414" text-anchor="middle" font-size="24" fill="#111827">todo 326枚</text>
  <rect x="310" y="385" width="200" height="42" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="410" y="414" text-anchor="middle" font-size="24" fill="#111827">doing 33枚</text>
  <rect x="530" y="385" width="220" height="42" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="640" y="414" text-anchor="middle" font-size="24" fill="#111827">done 3,058枚</text>
  <text x="90" y="464" font-size="22" fill="#4b5563">枚数は2026年10月17日2時に読んだ値</text>

  <line x1="420" y1="480" x2="420" y2="540" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="444" y="518" font-size="26" fill="#111827">配れるcardだけ</text>

  <!-- ② 配り役 -->
  <rect x="60" y="545" width="720" height="150" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="90" y="587" font-size="30" font-weight="bold" fill="#0f766e">② 配り役(doeffのProgram)</text>
  <text x="90" y="631" font-size="26" fill="#111827">先のcardが終わったtodoを、空きの数だけ配る</text>
  <text x="90" y="673" font-size="26" font-weight="bold" fill="#0f766e">同時に走る会話は、上限50まで</text>

  <line x1="420" y1="695" x2="420" y2="755" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="444" y="733" font-size="26" fill="#111827">会話を起こして頼む</text>

