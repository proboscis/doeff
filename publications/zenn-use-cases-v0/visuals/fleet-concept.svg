  <rect x="60" y="760" width="720" height="315" rx="18" fill="#eff6ff" stroke="#2a78d6" stroke-width="3"/>
  <text x="90" y="805" font-size="30" font-weight="bold" fill="#111827">会話(Claude Codeのsession)最大50</text>
