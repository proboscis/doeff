<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" font-family="IPAPGothic, IPAGothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="1240" fill="#ffffff"/>
  <text x="600" y="66" text-anchor="middle" font-size="40" font-weight="bold" fill="#111827">マージと検証を、別の列に分ける</text>

  <!-- 左: 前の形 -->
  <text x="300" y="130" text-anchor="middle" font-size="30" font-weight="bold" fill="#c2410c">前の形</text>
  <text x="300" y="168" text-anchor="middle" font-size="24" fill="#4b5563">門でテストを走らせる</text>

  <rect x="60" y="196" width="480" height="96" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="300" y="236" text-anchor="middle" font-size="26" fill="#111827">変更(会話が書く)</text>
  <text x="300" y="272" text-anchor="middle" font-size="22" fill="#4b5563">1日に100件を越える</text>

  <line x1="300" y1="294" x2="300" y2="340" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 待ちの列 -->
  <g fill="#fed7aa" stroke="#c2410c" stroke-width="2">
    <rect x="120" y="350" width="60" height="40" rx="6"/>
    <rect x="190" y="350" width="60" height="40" rx="6"/>
    <rect x="260" y="350" width="60" height="40" rx="6"/>
    <rect x="330" y="350" width="60" height="40" rx="6"/>
    <rect x="400" y="350" width="60" height="40" rx="6"/>
  </g>
  <text x="300" y="424" text-anchor="middle" font-size="22" fill="#c2410c">待ちが積み重なる</text>

  <rect x="60" y="446" width="480" height="300" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="88" y="490" font-size="28" font-weight="bold" fill="#c2410c">マージキュー(1件ずつ)</text>
  <text x="88" y="540" font-size="24" fill="#111827">① 積み直し(rebase)</text>
  <text x="88" y="582" font-size="24" fill="#111827">② 衝突の印</text>
  <text x="88" y="624" font-size="24" font-weight="bold" fill="#c2410c">③ テストと検査の束</text>
  <text x="88" y="676" font-size="22" fill="#111827">1語の修正でも517秒</text>
  <text x="88" y="712" font-size="20" fill="#4b5563">(2026年9月26日に測った1件)</text>

  <line x1="300" y1="748" x2="300" y2="794" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="160" y="802" width="280" height="64" rx="12" fill="#111827"/>
  <text x="300" y="844" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">main</text>
  <text x="300" y="914" text-anchor="middle" font-size="24" fill="#c2410c">1日に通せるのは167件まで</text>
  <text x="300" y="948" text-anchor="middle" font-size="20" fill="#4b5563">(86,400秒 ÷ 517秒)</text>

  <!-- 区切り -->
  <line x1="600" y1="110" x2="600" y2="960" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- 右: 今の形 -->
  <text x="900" y="130" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f766e">今の形</text>
  <text x="900" y="168" text-anchor="middle" font-size="24" fill="#4b5563">門は衝突だけを見る</text>

  <rect x="660" y="196" width="480" height="96" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="900" y="236" text-anchor="middle" font-size="26" fill="#111827">変更(会話が書く)</text>
  <text x="900" y="272" text-anchor="middle" font-size="22" fill="#0f766e">変えた所のテストを、手元で走らせる</text>

  <line x1="900" y1="294" x2="900" y2="440" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="660" y="446" width="480" height="300" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="688" y="490" font-size="28" font-weight="bold" fill="#0f766e">マージキュー(1件ずつ)</text>
  <text x="688" y="540" font-size="24" fill="#111827">① 積み直し(rebase)</text>
  <text x="688" y="582" font-size="24" fill="#111827">② 衝突の印(git grepの1行)</text>
  <text x="688" y="624" font-size="24" fill="#111827">③ 直近2日の変更の打ち消し</text>
  <text x="688" y="676" font-size="22" font-weight="bold" fill="#0f766e">門は中央値5.3秒</text>
  <text x="688" y="712" font-size="20" fill="#4b5563">(2026年10月16日の394件)</text>

  <line x1="900" y1="748" x2="900" y2="794" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="760" y="802" width="280" height="64" rx="12" fill="#111827"/>
  <text x="900" y="844" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">main</text>
  <text x="900" y="914" text-anchor="middle" font-size="24" fill="#0f766e">1日に433件が入った</text>
  <text x="900" y="948" text-anchor="middle" font-size="20" fill="#4b5563">(2026年10月16日・9つのリポジトリ)</text>

  <!-- 4時間ごとの検証の列 -->
  <line x1="1100" y1="834" x2="1100" y2="990" stroke="#374151" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="1042" y1="834" x2="1100" y2="834" stroke="#374151" stroke-width="3" stroke-dasharray="6 6"/>
  <rect x="60" y="996" width="1080" height="210" rx="16" fill="#f8fafc" stroke="#2a78d6" stroke-width="3"/>
  <text x="88" y="1040" font-size="28" font-weight="bold" fill="#2a78d6">別の列: 4時間ごとの全体の検証(mainの先端の版)</text>
  <text x="88" y="1084" font-size="24" fill="#111827">pytest・型の検査・リンター・画面の試験など25の段。見積もり約3時間39分</text>
  <text x="88" y="1134" font-size="24" fill="#111827">全部の段が緑 → 安定版のブランチ stable を進める</text>
  <text x="88" y="1178" font-size="24" fill="#111827">赤の段がある → 段ごとにcardを立てて直す。mainへの流れは止めない</text>
</svg>
