<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" font-family="IPAPGothic, IPAGothic, sans-serif">
  <rect width="1200" height="1110" fill="#ffffff"/>
  <text x="600" y="64" text-anchor="middle" font-size="42" font-weight="bold" fill="#111827">0.6.0の84個の穴と、その扱い</text>

  <rect x="30" y="94" width="1140" height="76" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="600" y="143" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">PyPIの0.6.0 ・ 公開の名381個のうち84個の型が分からない(点78%)</text>

  <g font-size="22" fill="#4b5563">
    <text x="44" y="206">穴の訳</text>
    <text x="560" y="206">数(1目盛り = 名1個)</text>
    <text x="1045" y="206" text-anchor="middle">扱い</text>
  </g>

  <!-- 1つのcommitで塞いだ4行 -->
  <rect x="30" y="220" width="1150" height="442" rx="16" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- 行0: 再公開 27 -->
  <text x="44" y="270" font-size="25" font-weight="bold" fill="#111827">頭から公開し直した依頼と控え</text>
  <text x="44" y="304" font-size="20" fill="#4b5563">Task・Tellなど。__repr__やidの注記が無い</text>
  <rect x="560" y="254" width="324" height="52" rx="6" fill="#0f766e"/>
  <text x="896" y="290" font-size="28" font-weight="bold" fill="#111827">27</text>
  <rect x="940" y="246" width="210" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1045" y="288" text-anchor="middle" font-size="22" fill="#0f766e">注記を付けた</text>

  <!-- 行1: 廃止した名 17 -->
  <text x="44" y="378" font-size="25" font-weight="bold" fill="#111827">廃止した名の置き物</text>
  <text x="44" y="412" font-size="20" fill="#4b5563">KleisliProgramなど。実行時だけに要る</text>
  <rect x="560" y="362" width="204" height="52" rx="6" fill="#1d4ed8"/>
  <text x="776" y="398" font-size="28" font-weight="bold" fill="#111827">17</text>
  <rect x="940" y="354" width="210" height="68" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1045" y="396" text-anchor="middle" font-size="22" fill="#1d4ed8">型の道具から隠した</text>

  <!-- 行2: ほかの関数 12 -->
  <text x="44" y="486" font-size="25" font-weight="bold" fill="#111827">ほかの関数とclass</text>
  <text x="44" y="520" font-size="20" fill="#4b5563">program()・merge_dicts()など</text>
  <rect x="560" y="470" width="144" height="52" rx="6" fill="#0f766e"/>
  <text x="716" y="506" font-size="28" font-weight="bold" fill="#111827">12</text>
  <rect x="940" y="462" width="210" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1045" y="504" text-anchor="middle" font-size="22" fill="#0f766e">注記を付けた</text>

  <!-- 行3: CLI 11 -->
  <text x="44" y="594" font-size="25" font-weight="bold" fill="#111827">命令の口(CLI)の部品</text>
  <text x="44" y="628" font-size="20" fill="#4b5563">5個は、道具ごとに推す型が違いうる</text>
  <rect x="560" y="578" width="132" height="52" rx="6" fill="#0f766e"/>
  <text x="704" y="614" font-size="28" font-weight="bold" fill="#111827">11</text>
  <rect x="940" y="570" width="210" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1045" y="612" text-anchor="middle" font-size="22" fill="#0f766e">注記を付けた</text>

  <text x="44" y="696" font-size="22" font-weight="bold" fill="#0f766e">点線の中の67個は、2026年10月17日の1つのcommitで塞いだ(69個 → 2個)</text>

  <!-- 行4: Some・Maybe 15 -->
  <text x="44" y="752" font-size="25" font-weight="bold" fill="#111827">Some・Maybe・Nothing</text>
  <text x="44" y="786" font-size="20" fill="#4b5563">値が在るか無いかを表す型</text>
  <rect x="560" y="736" width="180" height="52" rx="6" fill="#0f766e"/>
  <text x="752" y="772" font-size="28" font-weight="bold" fill="#111827">15</text>
  <rect x="940" y="728" width="210" height="68" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="1045" y="758" text-anchor="middle" font-size="22" fill="#0f766e">注記を付けた</text>
  <text x="1045" y="786" text-anchor="middle" font-size="18" fill="#0f766e">(同じ日の先のcommit)</text>

  <!-- 行5: 残した 2 -->
  <text x="44" y="860" font-size="25" font-weight="bold" fill="#111827">DoExpr・ProgramBase</text>
  <text x="44" y="894" font-size="20" fill="#4b5563">isinstanceに渡すため、型の引数を書かない</text>
  <rect x="560" y="844" width="24" height="52" rx="6" fill="#6b7280"/>
  <text x="596" y="880" font-size="28" font-weight="bold" fill="#111827">2</text>
  <rect x="940" y="836" width="210" height="68" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="1045" y="866" text-anchor="middle" font-size="22" fill="#374151">訳を書いて</text>
  <text x="1045" y="894" text-anchor="middle" font-size="22" fill="#374151">表に残した</text>

  <rect x="30" y="936" width="1140" height="110" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
  <text x="600" y="980" text-anchor="middle" font-size="28" font-weight="bold" fill="#15803d">PyPIの0.7.0 ・ 406個のうち5個(点98.8%)</text>
  <text x="600" y="1024" text-anchor="middle" font-size="22" fill="#111827">5個 = 残した2個 + 後で足した3個(python -m doeff demoの例・訳を書いて表へ)</text>

  <text x="600" y="1086" text-anchor="middle" font-size="20" fill="#4b5563">2026年10月18日に、PyPIの2つの版をPython 3.12・pyright 1.1.414で測った</text>
</svg>
