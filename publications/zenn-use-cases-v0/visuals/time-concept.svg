<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1076" viewBox="0 0 1200 1076" font-family="IPAPGothic, IPAGothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="1076" fill="#ffffff"/>
  <text x="600" y="68" text-anchor="middle" font-size="42" font-weight="bold" fill="#111827">どう待つかを、処理の外で決める</text>

  <!-- 上段: よくある書き方 -->
  <text x="40" y="132" font-size="30" font-weight="bold" fill="#4b5563">よくある書き方</text>
  <rect x="40" y="152" width="460" height="176" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="64" y="192" font-size="24" fill="#4b5563">関数の中で、自分で待つ</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#111827">
    <text x="64" y="240">def fetch_with_retry(...):</text>
    <text x="64" y="282"><tspan xml:space="preserve">    </tspan><tspan fill="#b45309" font-weight="bold">time.sleep(20)</tspan></text>
  </g>
  <text x="64" y="314" font-size="22" fill="#4b5563">待ち方は、関数の中で決まっている</text>

  <line x1="502" y1="208" x2="616" y2="208" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="502" y1="290" x2="616" y2="290" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="622" y="152" width="538" height="80" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="646" y="186" font-size="26" font-weight="bold" fill="#c2410c">そのままテストする</text>
  <text x="646" y="220" font-size="24" fill="#111827">本当に20秒止まる</text>

  <rect x="622" y="248" width="538" height="80" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="646" y="282" font-size="26" font-weight="bold" fill="#c2410c">sleepをモックで消す</text>
  <text x="646" y="316" font-size="24" fill="#111827">速いが、時計が進まない</text>

  <line x1="40" y1="372" x2="1160" y2="372" stroke="#d1d5db" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- 下段: doeff -->
  <text x="40" y="428" font-size="30" font-weight="bold" fill="#0f766e">doeffの書き方</text>
  <rect x="300" y="448" width="600" height="222" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="324" y="488" font-size="24" fill="#4b5563">処理本体（テストと本番で同じ）</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="28" fill="#111827">
    <text x="344" y="534">@do</text>
    <text x="344" y="572">def job(seconds):</text>
    <text x="344" y="610"><tspan xml:space="preserve">    yield </tspan><tspan fill="#0f766e" font-weight="bold">Delay(seconds)</tspan></text>
    <text x="344" y="648"><tspan xml:space="preserve">    return </tspan>"完了"</text>
  </g>

  <line x1="600" y1="672" x2="600" y2="736" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="624" y="714" font-size="26" fill="#111827">「20秒待ちたい」と頼むだけ</text>

  <text x="600" y="772" text-anchor="middle" font-size="26" fill="#4b5563">頼みに答えるハンドラを、外側で選んで付ける</text>

  <!-- テスト -->
  <rect x="40" y="792" width="545" height="190" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="66" y="838" font-size="30" font-weight="bold" fill="#0f766e">テストでは</text>
  <text x="66" y="882" font-size="26" font-family="DejaVu Sans Mono, monospace" fill="#111827">sim_time_handler()</text>
  <text x="66" y="924" font-size="26" fill="#111827">仮想の時計の針を、20秒進める</text>
  <text x="66" y="964" font-size="26" font-weight="bold" fill="#0f766e">かかる時間：ほぼ0秒</text>

  <!-- 本番 -->
  <rect x="615" y="792" width="545" height="190" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="641" y="838" font-size="30" font-weight="bold" fill="#c2410c">本番では</text>
  <text x="641" y="882" font-size="26" font-family="DejaVu Sans Mono, monospace" fill="#111827">async_time_handler()</text>
  <text x="641" y="924" font-size="26" fill="#111827">asyncioで、本当に20秒待つ</text>
  <text x="641" y="964" font-size="26" font-weight="bold" fill="#c2410c">かかる時間：約20秒</text>

  <text x="600" y="1040" text-anchor="middle" font-size="28" fill="#111827">どちらを付けても、<tspan font-weight="bold">job(20)</tspan> は「完了」を返す</text>
</svg>
