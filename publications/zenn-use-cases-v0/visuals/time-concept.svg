<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <!-- 同じtwo_napsを、自作の時計tickingとvirtual_clockで走らせた時の、2つのnapの待ちの並び(英語の3本目の記事の[20.0, 30.0]と[20.0, 10.0])。帯の長さは秒数に比例する(1秒 = 28px)。 -->
  <defs>
    <style>
      .ja { font-family: "IPAGothic", sans-serif; fill: #1f2d4d; }
      .code { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; fill: #1f2d4d; }
      .bar { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1080" height="1440" fill="#ffffff"/>

  <text class="ja" x="540" y="72" font-size="42" font-weight="bold" text-anchor="middle">同じtwo_napsでも、kをいつ動かすかで答えが変わる</text>

  <rect x="60" y="110" width="960" height="190" rx="24" fill="#f3f5f9" stroke="#c4cbd9" stroke-width="3"/>
  <text class="ja" x="95" y="164" font-size="36" font-weight="bold">two_naps(抜粋)</text>
  <text class="code" x="95" y="220" font-size="40" xml:space="preserve">slow_task = yield Spawn(nap(20))</text>
  <text class="code" x="95" y="274" font-size="40" xml:space="preserve">fast_task = yield Spawn(nap(10))</text>

  <rect x="60" y="330" width="960" height="430" rx="24" fill="#fdecea" stroke="#e8a59c" stroke-width="3"/>
  <text class="ja" x="95" y="390" font-size="40" font-weight="bold">ticking(自作の時計)</text>
  <text class="ja" x="95" y="446" font-size="36">Delayのたびに、すぐkを再開する</text>
  <rect x="120" y="476" width="560" height="54" rx="10" fill="#c0504d"/>
  <text class="bar" x="140" y="516" font-size="36">nap(20)</text>
  <rect x="680" y="546" width="280" height="54" rx="10" fill="#c0504d"/>
  <text class="bar" x="700" y="586" font-size="36">nap(10)</text>
  <line x1="120" y1="620" x2="960" y2="620" stroke="#1f2d4d" stroke-width="3"/>
  <text class="ja" x="120" y="662" font-size="36" text-anchor="middle">0</text>
  <text class="ja" x="400" y="662" font-size="36" text-anchor="middle">10</text>
  <text class="ja" x="680" y="662" font-size="36" text-anchor="middle">20</text>
  <text class="ja" x="960" y="662" font-size="36" text-anchor="middle">30秒</text>
  <text class="code" x="95" y="730" font-size="44" xml:space="preserve">[20.0, 30.0]</text>
  <text class="ja" x="450" y="728" font-size="36">待ちが足し算になる</text>

  <rect x="60" y="790" width="960" height="430" rx="24" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="ja" x="95" y="850" font-size="40" font-weight="bold">virtual_clock(仮想の時計)</text>
  <text class="ja" x="95" y="906" font-size="36">どのタスクも動けなくなるまでkを持つ</text>
  <rect x="120" y="936" width="560" height="54" rx="10" fill="#0f8b8d"/>
  <text class="bar" x="140" y="976" font-size="36">nap(20)</text>
  <rect x="120" y="1006" width="280" height="54" rx="10" fill="#0f8b8d"/>
  <text class="bar" x="140" y="1046" font-size="36">nap(10)</text>
  <line x1="120" y1="1080" x2="960" y2="1080" stroke="#1f2d4d" stroke-width="3"/>
  <text class="ja" x="120" y="1122" font-size="36" text-anchor="middle">0</text>
  <text class="ja" x="400" y="1122" font-size="36" text-anchor="middle">10</text>
  <text class="ja" x="680" y="1122" font-size="36" text-anchor="middle">20</text>
  <text class="ja" x="960" y="1122" font-size="36" text-anchor="middle">30秒</text>
  <text class="code" x="95" y="1190" font-size="44" xml:space="preserve">[20.0, 10.0]</text>
  <text class="ja" x="450" y="1188" font-size="36">待ちが重なる</text>

  <rect x="60" y="1250" width="960" height="150" rx="24" fill="#fff6dc" stroke="#e5c66b" stroke-width="3"/>
  <text class="ja" x="95" y="1312" font-size="36">napとtwo_napsは、どちらも同じコード。</text>
  <text class="ja" x="95" y="1370" font-size="36">違うのは、kを受け取るハンドラだけ。</text>
</svg>
