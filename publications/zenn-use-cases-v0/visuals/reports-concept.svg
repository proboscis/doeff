<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" font-family="IPAPGothic, IPAGothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="1120" fill="#ffffff"/>
  <text x="600" y="66" text-anchor="middle" font-size="40" font-weight="bold" fill="#111827">報告のページを、中身・HTML・図の3つの役に分ける</text>

  <!-- 列の見出し -->
  <text x="300" y="134" text-anchor="middle" font-size="30" font-weight="bold" fill="#4b5563">前の形(丸ごと任せる)</text>
  <text x="900" y="134" text-anchor="middle" font-size="30" font-weight="bold" fill="#0f766e">今の形(3つの役に分ける)</text>
  <line x1="600" y1="105" x2="600" y2="1010" stroke="#e5e7eb" stroke-width="3"/>

  <!-- 左: 話していた会話 -->
  <rect x="40" y="160" width="520" height="130" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="300" y="204" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">話していた会話(Claude Code)</text>
  <text x="300" y="244" text-anchor="middle" font-size="24" fill="#111827">報告のページを頼む</text>
  <text x="300" y="276" text-anchor="middle" font-size="22" fill="#4b5563">文脈を持つのは、この会話だけ</text>

  <line x1="300" y1="290" x2="300" y2="350" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="324" y="328" font-size="24" fill="#111827">丸ごと頼む</text>

  <!-- 左: 作業役 -->
  <rect x="40" y="355" width="520" height="405" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="300" y="400" text-anchor="middle" font-size="28" font-weight="bold" fill="#c2410c">作業役(文脈なし)</text>
  <text x="70" y="452" font-size="24" fill="#111827">コードとissueを読み直す</text>
  <rect x="70" y="468" width="200" height="44" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="170" y="498" text-anchor="middle" font-size="24" font-weight="bold" fill="#c2410c">15.7分</text>
  <text x="70" y="562" font-size="24" fill="#111827">中身・HTML・CSS・図を書く 3.5分</text>
  <text x="70" y="620" font-size="24" fill="#111827">ページ全体のスクリーンショットで</text>
  <text x="70" y="654" font-size="24" fill="#111827">確かめる</text>
  <rect x="70" y="670" width="200" height="44" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="170" y="700" text-anchor="middle" font-size="24" font-weight="bold" fill="#c2410c">12分</text>

  <line x1="300" y1="760" x2="300" y2="820" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 左: 出来たページ -->
  <rect x="40" y="825" width="520" height="100" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="300" y="866" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">出来たページ</text>
  <text x="300" y="904" text-anchor="middle" font-size="24" fill="#111827">誰にも開かれずに置かれた 9.5分</text>

  <rect x="40" y="945" width="520" height="62" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="300" y="986" text-anchor="middle" font-size="26" font-weight="bold" fill="#c2410c">開くまで42分(読める物まで74分)</text>

  <!-- 右: 話していた会話 -->
  <rect x="640" y="160" width="520" height="130" rx="18" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <text x="900" y="204" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f766e">話していた会話(Claude Code)</text>
  <text x="900" y="244" text-anchor="middle" font-size="24" fill="#111827">中身のファイルを書く 57秒</text>
  <text x="900" y="276" text-anchor="middle" font-size="22" fill="#4b5563">文・表・数字・図の指定</text>

  <line x1="900" y1="290" x2="900" y2="350" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="924" y="328" font-size="24" fill="#111827">build</text>

  <!-- 右: スクリプトと雛形 -->
  <rect x="640" y="355" width="520" height="130" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="900" y="399" text-anchor="middle" font-size="28" font-weight="bold" fill="#111827">スクリプトと雛形(殻)</text>
  <text x="900" y="439" text-anchor="middle" font-size="24" fill="#111827">AIに見た目を書かせずに組む</text>
  <text x="900" y="471" text-anchor="middle" font-size="22" fill="#4b5563">図の所は「作成中」の枠で、文章と表が先に開く</text>

  <line x1="900" y1="485" x2="900" y2="545" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="924" y="523" font-size="24" fill="#111827">決まった依頼文</text>

  <!-- 右: 図の作業役 -->
  <rect x="640" y="550" width="520" height="210" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="900" y="595" text-anchor="middle" font-size="28" font-weight="bold" fill="#1d4ed8">図の作業役(Opusのサブエージェント)</text>
  <text x="670" y="640" font-size="24" fill="#111827">図の指定だけを読み、調べ直さない</text>
  <text x="670" y="678" font-size="24" fill="#111827">数字を足さず、figures/&lt;id&gt;.svg に描く</text>
  <text x="670" y="716" font-size="22" fill="#111827">試しでは、起動21秒・図4つと見た目で4分18秒</text>

  <line x1="900" y1="760" x2="900" y2="820" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="924" y="798" font-size="24" fill="#111827">build し直す</text>

  <!-- 右: ページ -->
  <rect x="640" y="825" width="520" height="100" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="900" y="866" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">ページ</text>
  <text x="900" y="904" text-anchor="middle" font-size="24" fill="#111827">確かめは最後の1行「図 4/4」</text>

  <rect x="640" y="945" width="520" height="62" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="900" y="986" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f766e">開くまで5分36秒</text>

  <text x="600" y="1060" text-anchor="middle" font-size="22" fill="#4b5563">左は2026年9月30日の夜の報告、右は10月1日に試した報告の、1回ずつの実測。</text>
  <text x="600" y="1094" text-anchor="middle" font-size="22" fill="#4b5563">毎日使った1週間(10月12〜18日)の中央値は、図が全部入るまで9.2分。</text>
</svg>
