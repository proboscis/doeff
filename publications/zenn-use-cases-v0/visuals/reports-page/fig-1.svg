<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="fig1-title fig1-desc" font-family="sans-serif">
<title id="fig1-title">作り直しの前後の応答の秒</title>
<desc id="fig1-desc">中央値。21時 0.2秒・22時 3.1秒・23時 0.2秒。作り直した直後の30分だけ、応答が遅い。</desc>
<rect x="0" y="0" width="720" height="360" fill="#fcfcfb"/>
<text x="24" y="34" font-size="18" font-weight="bold" fill="#0b0b0b">作り直しの前後の応答の秒</text>
<text x="24" y="58" font-size="14" fill="#52514e">作り直した直後の30分だけ、応答が遅い</text>
<text x="90" y="84" font-size="13" fill="#52514e">中央値(秒)</text>
<line x1="90" y1="92" x2="90" y2="300" stroke="#d8d7d1" stroke-width="1"/>
<line x1="90" y1="300" x2="660" y2="300" stroke="#d8d7d1" stroke-width="1"/>
<polyline points="150,288 375,114 600,288" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g>
<title>21時 0.2秒</title>
<circle cx="150" cy="288" r="14" fill="transparent"/>
<circle cx="150" cy="288" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<g>
<title>22時 3.1秒</title>
<circle cx="375" cy="114" r="14" fill="transparent"/>
<circle cx="375" cy="114" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<g>
<title>23時 0.2秒</title>
<circle cx="600" cy="288" r="14" fill="transparent"/>
<circle cx="600" cy="288" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="150" y="272" font-size="14" fill="#0b0b0b" text-anchor="middle">0.2秒</text>
<text x="375" y="98" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">3.1秒</text>
<text x="600" y="272" font-size="14" fill="#0b0b0b" text-anchor="middle">0.2秒</text>
<text x="392" y="120" font-size="13" fill="#52514e">作り直した直後</text>
<text x="150" y="324" font-size="14" fill="#52514e" text-anchor="middle">21時</text>
<text x="375" y="324" font-size="14" fill="#52514e" text-anchor="middle">22時</text>
<text x="600" y="324" font-size="14" fill="#52514e" text-anchor="middle">23時</text>
</svg>
