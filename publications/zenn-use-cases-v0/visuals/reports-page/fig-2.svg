<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="fig2-title fig2-desc" font-family="sans-serif">
<title id="fig2-title">索引の作り直しの手順</title>
<desc id="fig2-desc">作る → 温める → 切り替える。切り替えの前に、温める段を足した。</desc>
<rect x="0" y="0" width="720" height="220" fill="#fcfcfb"/>
<text x="24" y="34" font-size="18" font-weight="bold" fill="#0b0b0b">索引の作り直しの手順</text>
<text x="24" y="58" font-size="14" fill="#52514e">切り替えの前に、温める段を足した</text>
<rect x="60" y="120" width="160" height="64" rx="8" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<text x="140" y="158" font-size="18" fill="#0b0b0b" text-anchor="middle">作る</text>
<rect x="280" y="120" width="160" height="64" rx="8" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2"/>
<text x="360" y="158" font-size="18" font-weight="bold" fill="#0b0b0b" text-anchor="middle">温める</text>
<rect x="320" y="94" width="80" height="22" rx="11" fill="#1c5fb0"/>
<text x="360" y="110" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">足した段</text>
<rect x="500" y="120" width="160" height="64" rx="8" fill="#f1f0ec" stroke="#c9c8c2" stroke-width="1"/>
<text x="580" y="158" font-size="18" fill="#0b0b0b" text-anchor="middle">切り替える</text>
<line x1="226" y1="152" x2="266" y2="152" stroke="#52514e" stroke-width="2"/>
<polygon points="274,152 264,146 264,158" fill="#52514e"/>
<line x1="446" y1="152" x2="486" y2="152" stroke="#52514e" stroke-width="2"/>
<polygon points="494,152 484,146 484,158" fill="#52514e"/>
</svg>
