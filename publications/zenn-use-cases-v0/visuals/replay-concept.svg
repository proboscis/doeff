<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200">
  <!-- recordが、HttpRequestを外のgithubへ出し直して答えを取っておく道(英語の記事の1枚目のsequenceDiagramの訳)。 -->
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f8b8d"/>
    </marker>
    <style>
      .ja { font-family: "IPAGothic", sans-serif; fill: #1f2d4d; }
      .code { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; fill: #1f2d4d; }
      .life { stroke: #9aa7c0; stroke-width: 4; stroke-dasharray: 14 12; }
      .call { stroke: #0f8b8d; stroke-width: 7; fill: none; }
      .back { stroke: #0f8b8d; stroke-width: 7; fill: none; stroke-dasharray: 18 12; }
    </style>
  </defs>
  <rect width="1080" height="1200" fill="#ffffff"/>

  <text class="ja" x="540" y="76" font-size="40" font-weight="bold" text-anchor="middle">recordは、出ていく依頼と戻る答えを両方見る</text>

  <!-- 3つの参加者(内から外へ) -->
  <rect x="30" y="130" width="320" height="130" rx="22" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="code" x="190" y="190" font-size="30" font-weight="bold" text-anchor="middle">latest_releases</text>
  <text class="ja" x="190" y="238" font-size="30" text-anchor="middle">(プログラム)</text>
  <rect x="380" y="130" width="320" height="130" rx="22" fill="#eee8f8" stroke="#b9a6e0" stroke-width="3"/>
  <text class="code" x="540" y="190" font-size="38" font-weight="bold" text-anchor="middle">record</text>
  <text class="ja" x="540" y="238" font-size="30" text-anchor="middle">(記録の係)</text>
  <rect x="730" y="130" width="320" height="130" rx="22" fill="#eee8f8" stroke="#b9a6e0" stroke-width="3"/>
  <text class="code" x="890" y="190" font-size="38" font-weight="bold" text-anchor="middle">github</text>
  <text class="ja" x="890" y="238" font-size="30" text-anchor="middle">(1つ外のハンドラ)</text>

  <line class="life" x1="190" y1="260" x2="190" y2="990"/>
  <line class="life" x1="540" y1="260" x2="540" y2="990"/>
  <line class="life" x1="890" y1="260" x2="890" y2="990"/>

  <!-- ① latest_releasesが止まり、HttpRequestがいちばん内側のrecordへ -->
  <text class="code" x="365" y="338" font-size="28" text-anchor="middle">① yield HttpRequest</text>
  <line class="call" x1="200" y1="362" x2="526" y2="362" marker-end="url(#arrow)"/>
  <text class="ja" x="365" y="412" font-size="30" text-anchor="middle">kとして止まる</text>

  <!-- ② recordが同じエフェクトを出し直す -->
  <text class="code" x="715" y="488" font-size="30" text-anchor="middle">② yield effect</text>
  <line class="call" x1="550" y1="512" x2="876" y2="512" marker-end="url(#arrow)"/>
  <text class="ja" x="715" y="562" font-size="30" text-anchor="middle">1つ外へ出し直す</text>

  <!-- ③ githubが答える -->
  <text class="code" x="715" y="638" font-size="22" text-anchor="middle">③ {"tag_name": "v2.4.1"}</text>
  <line class="back" x1="880" y1="662" x2="554" y2="662" marker-end="url(#arrow)"/>
  <text class="ja" x="715" y="712" font-size="30" text-anchor="middle">recordが受け取る</text>

  <!-- recordがtapeに書く -->
  <rect x="300" y="748" width="480" height="78" rx="16" fill="#fff6dc" stroke="#e5c66b" stroke-width="3"/>
  <text class="code" x="540" y="798" font-size="26" text-anchor="middle">tape[("GET", url)] = answer</text>

  <!-- ④ recordが同じ答えでkを再開する -->
  <text class="code" x="365" y="888" font-size="28" text-anchor="middle">④ Resume(k, answer)</text>
  <line class="back" x1="530" y1="912" x2="204" y2="912" marker-end="url(#arrow)"/>
  <text class="ja" x="365" y="962" font-size="30" text-anchor="middle">同じ答えで続きが進む</text>

  <rect x="30" y="1020" width="1020" height="140" rx="24" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="ja" x="70" y="1078" font-size="32" font-weight="bold">latest_releasesが受け取る答えは、</text>
  <text class="ja" x="70" y="1130" font-size="32" font-weight="bold">記録の係が間に無い時と同じ</text>
</svg>
