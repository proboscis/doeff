<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="IPAPGothic, IPAGothic, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="600" y="66" text-anchor="middle" font-size="42" font-weight="bold" fill="#111827">決まりを破る3つの変更と、止まる所</text>

  <!-- 列の見出し -->
  <text x="190" y="128" text-anchor="middle" font-size="26" fill="#4b5563">変更</text>
  <text x="600" y="128" text-anchor="middle" font-size="26" fill="#4b5563">普段のpytest</text>
  <text x="1006" y="128" text-anchor="middle" font-size="26" fill="#4b5563">止める所</text>

  <!-- 1. 業務のコード -->
  <rect x="30" y="150" width="320" height="200" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="54" y="194" font-size="28" font-weight="bold" fill="#111827">1. 業務のコード</text>
  <text x="54" y="240" font-size="24" fill="#111827">billing.pyで</text>
  <text x="54" y="280" font-size="22" font-family="DejaVu Sans Mono, monospace" fill="#b91c1c">datetime.now(</text>
  <text x="54" y="312" font-size="22" font-family="DejaVu Sans Mono, monospace" fill="#b91c1c">  due.tzinfo)を読む</text>
  <line x1="352" y1="250" x2="416" y2="250" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="420" y="150" width="360" height="200" rx="16" fill="#fef9c3" stroke="#a16207" stroke-width="3"/>
  <text x="444" y="196" font-size="30" font-weight="bold" fill="#a16207">3 passed</text>
  <text x="444" y="242" font-size="24" fill="#111827">10月31日までは</text>
  <text x="444" y="280" font-size="24" fill="#111827">deftestも通ってしまう</text>
  <text x="444" y="322" font-size="22" fill="#4b5563">(実行のテストの見逃し)</text>
  <line x1="782" y1="250" x2="846" y2="250" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="850" y="150" width="320" height="200" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="874" y="196" font-size="27" font-weight="bold" fill="#c2410c">semgrep scan</text>
  <text x="874" y="242" font-size="24" fill="#111827">9行目を指して止める</text>
  <text x="874" y="282" font-size="22" font-family="DejaVu Sans Mono, monospace" fill="#111827">billing-no-direct-now</text>
  <text x="874" y="322" font-size="24" fill="#111827">終了コード 1</text>

  <!-- 2. ADRの検査 -->
  <rect x="30" y="390" width="320" height="200" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="54" y="434" font-size="28" font-weight="bold" fill="#111827">2. ADRの検査</text>
  <text x="54" y="480" font-size="24" fill="#111827">ADRから</text>
  <text x="54" y="520" font-size="24" font-family="DejaVu Sans Mono, monospace" fill="#b91c1c">:enforcement</text>
  <text x="54" y="558" font-size="24" fill="#111827">を消す</text>
  <line x1="352" y1="490" x2="416" y2="490" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="420" y="390" width="360" height="200" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="444" y="436" font-size="30" font-weight="bold" fill="#b91c1c">1 failed</text>
  <text x="444" y="482" font-size="24" fill="#111827">ADRの形のテストが落ちる</text>
  <text x="444" y="524" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827">accepted ADR must have</text>
  <text x="444" y="554" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827">executable enforcement</text>
  <line x1="782" y1="490" x2="846" y2="490" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="850" y="390" width="320" height="200" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="874" y="436" font-size="27" font-weight="bold" fill="#0f766e">pytest</text>
  <text x="874" y="482" font-size="24" fill="#111827">採用済みなのに</text>
  <text x="874" y="522" font-size="24" fill="#111827">検査が無いとして止める</text>
  <text x="874" y="562" font-size="24" fill="#111827">終了コード 1</text>

  <!-- 3. pytestの設定 -->
  <rect x="30" y="630" width="320" height="200" rx="16" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="54" y="674" font-size="28" font-weight="bold" fill="#111827">3. pytestの設定</text>
  <text x="54" y="720" font-size="24" fill="#111827">testpathsを</text>
  <text x="54" y="760" font-size="24" font-family="DejaVu Sans Mono, monospace" fill="#b91c1c">["tests"]</text>
  <text x="54" y="798" font-size="24" fill="#111827">にする</text>
  <line x1="352" y1="730" x2="416" y2="730" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="420" y="630" width="360" height="200" rx="16" fill="#fef9c3" stroke="#a16207" stroke-width="3"/>
  <text x="444" y="676" font-size="30" font-weight="bold" fill="#a16207">1 passed</text>
  <text x="444" y="722" font-size="24" fill="#111827">testsのテストだけが走る</text>
  <text x="444" y="762" font-size="24" fill="#111827">ADRのテストは0本</text>
  <text x="444" y="802" font-size="22" fill="#4b5563">(ADRが漏れても通る)</text>
  <line x1="782" y1="730" x2="846" y2="730" stroke="#374151" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="850" y="630" width="320" height="200" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="874" y="676" font-size="27" font-weight="bold" fill="#1d4ed8">verify-wiring</text>
  <text x="874" y="722" font-size="24" fill="#111827">集められていない</text>
  <text x="874" y="762" font-size="24" fill="#111827">ADRのファイルを名指す</text>
  <text x="874" y="802" font-size="24" fill="#111827">終了コード 4</text>

  <text x="600" y="890" text-anchor="middle" font-size="27" font-weight="bold" fill="#111827">実行のテストと形の検査が、互いの見逃しを埋める</text>
  <text x="600" y="940" text-anchor="middle" font-size="22" fill="#4b5563">2026-10-17に、doeffのmainで走らせた結果</text>
</svg>
