<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1140" viewBox="0 0 1080 1140">
  <!-- run(ada(titled(twice())))で、1つ目のReadNameが進む道(英語の記事の2枚目のsequenceDiagramの訳)。 -->
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0f8b8d"/>
    </marker>
    <style>
      .ja { font-family: "IPAGothic", sans-serif; fill: #1f2d4d; }
      .code { font-family: "DejaVu Sans Mono", "IPAGothic", monospace; fill: #1f2d4d; }
      .life { stroke: #9aa7c0; stroke-width: 4; stroke-dasharray: 14 12; }
      .call { stroke: #0f8b8d; stroke-width: 7; fill: none; }
      .back { stroke: #0f8b8d; stroke-width: 7; fill: none; stroke-dasharray: 18 12; }
    </style>
  </defs>
  <rect width="1080" height="1140" fill="#ffffff"/>

  <text class="ja" x="540" y="76" font-size="42" font-weight="bold" text-anchor="middle">titledが、ReadNameを外のadaへ出し直す</text>

  <!-- 3つの参加者(内から外へ) -->
  <rect x="40" y="130" width="300" height="130" rx="22" fill="#e0f5ef" stroke="#8fd3bf" stroke-width="3"/>
  <text class="code" x="190" y="190" font-size="38" font-weight="bold" text-anchor="middle">greet</text>
  <text class="ja" x="190" y="238" font-size="30" text-anchor="middle">(1回目の呼び出し)</text>
  <rect x="390" y="130" width="300" height="130" rx="22" fill="#eee8f8" stroke="#b9a6e0" stroke-width="3"/>
  <text class="code" x="540" y="190" font-size="38" font-weight="bold" text-anchor="middle">titled</text>
  <text class="ja" x="540" y="238" font-size="30" text-anchor="middle">(間のハンドラ)</text>
  <rect x="740" y="130" width="300" height="130" rx="22" fill="#eee8f8" stroke="#b9a6e0" stroke-width="3"/>
  <text class="code" x="890" y="190" font-size="38" font-weight="bold" text-anchor="middle">ada</text>
  <text class="ja" x="890" y="238" font-size="30" text-anchor="middle">(外のハンドラ)</text>

  <line class="life" x1="190" y1="260" x2="190" y2="900"/>
  <line class="life" x1="540" y1="260" x2="540" y2="900"/>
  <line class="life" x1="890" y1="260" x2="890" y2="900"/>

  <!-- ① greetが止まり、ReadNameがいちばん内側のtitledへ -->
  <text class="code" x="365" y="338" font-size="30" text-anchor="middle">① yield ReadName()</text>
  <line class="call" x1="200" y1="362" x2="526" y2="362" marker-end="url(#arrow)"/>
  <text class="ja" x="365" y="412" font-size="32" text-anchor="middle">kとして止まる</text>

  <!-- ② titledが同じエフェクトを出し直す -->
  <text class="code" x="715" y="488" font-size="32" text-anchor="middle">② yield effect</text>
  <line class="call" x1="550" y1="512" x2="876" y2="512" marker-end="url(#arrow)"/>
  <text class="ja" x="715" y="562" font-size="32" text-anchor="middle">1つ外へ出し直す</text>

  <!-- ③ adaが答える -->
  <text class="code" x="715" y="638" font-size="32" text-anchor="middle">③ "Ada"</text>
  <line class="back" x1="880" y1="662" x2="554" y2="662" marker-end="url(#arrow)"/>
  <text class="ja" x="715" y="712" font-size="32" text-anchor="middle">titledが受け取る</text>

  <!-- ④ titledがkを再開する -->
  <text class="code" x="362" y="788" font-size="26" text-anchor="middle">④ Resume(k, "Dr. Ada")</text>
  <line class="back" x1="530" y1="812" x2="204" y2="812" marker-end="url(#arrow)"/>
  <text class="ja" x="365" y="862" font-size="32" text-anchor="middle">greetの続きが進む</text>

  <rect x="40" y="930" width="1000" height="160" rx="24" fill="#fff6dc" stroke="#e5c66b" stroke-width="3"/>
  <text class="ja" x="80" y="990" font-size="34" font-weight="bold">2回目の呼び出しは、近いgraceが答える</text>
  <text class="code" x="80" y="1056" font-size="34">('Hello, Dr. Ada', 'Hello, Grace')</text>
</svg>
