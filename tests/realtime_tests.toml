# Registry of tests that may wait in real (wall-clock) time.
#
# The semgrep rule doeff-no-sleep-in-tests in .semgrep.yaml does not flag sleep inside functions marked
# @pytest.mark.realtime or modules marked pytestmark = pytest.mark.realtime. For Hy tests, the doeff-linter rule DOEFF211 applies the same
# policy, reading the deftest meta {:marks ["realtime"]}, the decorator on a plain test function
# (defn [pytest.mark.realtime] name [] ...), and a top-level (val pytestmark pytest.mark.realtime) in a module as the marker. Only tests whose subject is real
# threads, a real asyncio loop, or the wall-clock time of a real external process or library may carry the marker. Every other test
# makes the program yield doeff-time's Delay and runs on the virtual clock of sim_time_handler, or names the thing (event) it waits for.
#
# A test carrying the marker is listed here together with the reason saying what wall-clock behavior is under test. Mismatches between
# the registry and the markers (a marker not listed, a row without a marker) are turned red by tests/semgrep/test_realtime_tests_registry.py.
#
# Key = "<path from repo root>::<function name>" (for a class method, "<path>::<class name>::<function name>");
#       for a module pytestmark, "<path>". Value = a one-line reason. Hy test names are in the form pytest shows (with - turned into _).
#
# The only ways out of the rule are the two tables in this file:
# - [tests]: the marker above. A support module (a file pytest does not collect) for tests that wait on a real process is also declared
#   with the same one-line pytestmark and listed here. For an independent Hy script that a test launches as a separate process (a job body or a stub CLI;
#   it does not import pytest, so it cannot carry the marker), one line naming the file in the exclude of [tool.doeff-linter.test_sleep] stands in for the marker, and it is also listed here.
# - [suites]: directories written in the rule's paths.exclude. Only suites in which every test drives a real external process as a black box
#   are listed, one line per directory (the same reason is not repeated per file). The rule's exclude and this table are one to one: both the semgrep rule's paths.exclude and the
#   dir lines in the exclude of doeff-linter's [tool.doeff-linter.test_sleep] (except the rule's fixture dirs) exclude the same dirs as this table.
# There is no way to disable the rule with an inline annotation (nosemgrep): even a single such line in the rule's scope turns the registry test red.

