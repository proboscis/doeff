# 実時間で待ってよい検の名簿(card ki-94380dba532f)。
#
# .semgrep.yaml の規則 doeff-no-sleep-in-tests は、@pytest.mark.realtime を名乗る関数と
# pytestmark = pytest.mark.realtime を名乗る module の中の sleep を鳴らさない。Hy の検は doeff-linter の規則 DOEFF211 が同じ
# 決まりを持ち(card ki-bb3ee40d0af2)、deftest の meta の {:marks ["realtime"]}・素の関数の検の decorator
# (defn [pytest.mark.realtime] 名 [] …)・module の最上位の (val pytestmark pytest.mark.realtime) を名乗りと読む。名乗ってよいのは、本物の thread・
# 本物の asyncio の loop・本物の外の process や library の実時間そのものが対象の検だけ。それ以外の検は、program に
# doeff-time の Delay を yield させて sim_time_handler の仮想の時計で走らせるか、待つ物(出来事)を名指して待つ。
#
# marker を名乗る検は、ここに「実時間の何が対象か」の理由と一緒に載せる。名簿と marker の食い違い(載っていない
# marker・marker の無い行)は tests/semgrep/test_realtime_tests_registry.py が赤にする。
#
# 鍵 = "<repo の根からの path>::<関数の名>"(class の method は "<path>::<class の名>::<関数の名>")・
#      module の pytestmark は "<path>"。値 = 理由の 1 行。Hy の検の名は pytest が見せる形(- を _ に直した名)。
#
# 規則の外へ出る道はこの file の 2 つの表だけ(card ki-6aa7cb5ffb83):
# - [tests]: 上の marker。本物の process を待つ検の support の module(pytest が集めない file)も、同じ pytestmark の 1 行で
#   名乗ってここに載る。Hy の、検が別の process として起こす独立の script(job の本体・替え玉の CLI — pytest を import しないので
#   marker を名乗れない)は、[tool.doeff-linter.test_sleep] の exclude に file で名指した 1 行が名乗りの代わりで、同じくここに載る。
# - [suites]: 規則の paths.exclude に書いた dir。どの検も本物の外の process を黒箱で動かす組だけを、dir の 1 行で載せる
#   (file ごとに同じ理由を並べない)。規則の exclude とこの表は 1 対 1 — semgrep の規則の paths.exclude と、doeff-linter の
#   [tool.doeff-linter.test_sleep] の exclude の dir の行(規則の検体の dir を除く)の両方が、この表と同じ dir を除く。
# 行の注釈で規則を外す道(nosemgrep)は無い — 規則の範囲に 1 行でも在れば名簿の検が赤にする。

